<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#84cc16" />
<title>🐦 Flappy Flap — Flap to Fly</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{background:#0a1a05;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;gap:18px}
#wrap{position:relative;height:95vh;aspect-ratio:9/16;flex-shrink:0;border-radius:24px;overflow:hidden;box-shadow:0 0 90px rgba(132,204,22,.35),0 0 0 2px rgba(255,255,255,.06)}
canvas{width:100%;height:100%;display:block;background:#0a1a05}
#panel{display:flex;flex-direction:column;gap:7px;width:186px;max-height:95vh;overflow-y:auto;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
.badge{padding:11px 8px;border-radius:13px;text-align:center;background:linear-gradient(135deg,#3f6212,#84cc16);box-shadow:0 6px 22px rgba(132,204,22,.4)}
.badge .nm{font-size:15px;font-weight:900;letter-spacing:2px;color:#fff}
.badge .tg{font-size:8.5px;opacity:.95;margin-top:2px;letter-spacing:1px;font-weight:700}
.btn{width:100%;padding:11px 8px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96);opacity:.85}
#startBtn{background:linear-gradient(135deg,#3f6212,#84cc16);color:#fff}
#stopBtn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1)}
#recordBtn{background:linear-gradient(135deg,#ef4444,#f43f5e);color:#fff}
#recordBtn.rec{animation:rec 1.1s ease-in-out infinite}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.7)}50%{box-shadow:0 0 0 9px rgba(244,63,94,0)}}
#shareBtn{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff}
#dlArea{display:none;flex-direction:column;gap:5px}
#dlBtn{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.dl-meta{font-size:9px;color:rgba(255,255,255,.4);text-align:center;line-height:1.4}
.divider{height:1px;background:rgba(255,255,255,.07);margin:1px 0}
.sec{font-size:10px;font-weight:800;color:rgba(255,255,255,.32);letter-spacing:1px;text-transform:uppercase}
select{width:100%;padding:7px;border-radius:9px;background:rgba(255,255,255,.05);color:#fff;font-size:11px;border:1px solid rgba(255,255,255,.1)}
.row3{display:flex;gap:5px}
.t-btn{flex:1;padding:7px 3px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.08);transition:all .12s}
.t-btn.active{background:rgba(132,204,22,.22);color:#bef264;border-color:rgba(132,204,22,.45)}
.toggle-btn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1);font-size:11px}
.toggle-btn.on{background:rgba(85,239,196,.15);color:#55efc4;border-color:rgba(85,239,196,.35)}
#status{font-size:10px;color:rgba(255,255,255,.4);text-align:center;line-height:1.6}
.hint{font-size:10px;color:rgba(255,255,255,.3);line-height:1.85}
@media (max-width:900px),(orientation:portrait) and (max-width:1100px){body{flex-direction:column;min-height:100dvh;min-height:100vh;height:auto;align-items:stretch;justify-content:flex-start;padding:5px;gap:5px;overflow:visible}#wrap{height:calc(100dvh - 130px);height:calc(100vh - 130px);width:auto;max-width:calc(100vw - 10px);aspect-ratio:9/16;margin:0 auto;border-radius:18px;flex-shrink:0}#panel{width:100%;max-width:560px;margin:0 auto;flex-direction:row;flex-wrap:wrap;gap:5px;max-height:none;overflow:visible;align-content:flex-start;padding:0 4px;flex-shrink:0}.badge,#status,.sec,.divider,#camSelect,.hint{display:none !important}#panel .btn{flex:1 1 calc(33% - 5px);padding:10px 5px;font-size:12px;min-width:0}#panel #recordBtn,#panel #shareBtn{flex:1 1 calc(50% - 3px)}#panel #dlArea{flex:1 1 100%;flex-direction:row;gap:4px}#panel #dlBtn{flex:1 1 100%;padding:10px 5px;font-size:12px}#panel .dl-meta{display:none}.row3{flex:1 1 100%;display:flex;gap:4px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="canv"></canvas></div>
<div id="panel">
<div class="badge"><div class="nm">🐦 FLAPPY FLAP</div><div class="tg">FLAP YOUR ARMS!</div></div>
<button class="btn" id="startBtn">▶ Start</button><button class="btn" id="stopBtn">⏹ Stop</button>
<div class="sec">Mode</div><div class="row3"><button class="t-btn" data-mode="endless">∞</button><button class="t-btn active" data-mode="60">60s</button><button class="t-btn" data-mode="30">30s</button></div>
<button class="btn" id="recordBtn">⏺ Record</button>
<div id="dlArea"><button class="btn" id="dlBtn">⬇ Download</button><div class="dl-meta" id="dlMeta">—</div></div>
<button class="btn" id="shareBtn">🔗 Share</button>
<div class="divider"></div><div class="sec">Camera</div><select id="camSelect"><option>Loading…</option></select>
<div class="divider"></div><button class="btn toggle-btn on" id="muteBtn">🔊 Sound</button>
<div id="status">Loading…</div>
<div class="divider"></div><div class="hint">🦅 FLAP your arms!<br>⬇️ Bird falls without flapping<br>🌲 Don't hit pipes<br>🎬 Pure comedy gold</div>
</div>
<video id="vid" playsinline webkit-playsinline muted autoplay style="display:none"></video>
<audio id="silent" playsinline webkit-playsinline loop preload="auto" src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//FJAhwBkgVw6q9PoIjLZNAvQQyPM1wAA4AGRmHEEswj3w5tOi4NRGvSILIRWFYABg00cZ4FpcFzEkdjEQwYYXQH0ABp0uKkCUDuMa7QrZmWTFjHd" style="display:none"></audio>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script>
const STATS_NS='gameos-kyadav2270';
function ping(k){fetch(`https://abacus.jasoncameron.dev/hit/${STATS_NS}/${k}`).catch(()=>{});}
ping('visit_flappy');
const canvas=document.getElementById('canv'),ctx=canvas.getContext('2d'),video=document.getElementById('vid');
const $=id=>document.getElementById(id);
const W=540,H=960,RW=1080,RH=1920,SCALE=RW/W;canvas.width=RW;canvas.height=RH;
const SAFE={x:25,y:90,w:390,h:630};
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);
let gameState='ready',lastTime=0,dt=0,hands=[],handsCount=0,cameraOK=false,cropParams=null,isFrontCamera=true;
let timerMode='60',timerLeft=60,timerRunning=false,isRecording=false,cdNum=3,cdT=0,endRecordTimer=null;
const END_RECORD_MS=4500;let shakeFrames=0,shakeAmp=0,flashAlpha=0,flashCol='255,255,255';

let muted=false,audioCtx=null,masterGain=null,audioDest=null,silentUnlocked=false;
function unlockSilent(){if(silentUnlocked)return;const el=$('silent');if(!el)return;el.volume=0.001;const p=el.play();if(p&&p.then)p.then(()=>silentUnlocked=true).catch(()=>{});else silentUnlocked=true;}
function getAC(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();if(audioCtx&&!masterGain){masterGain=audioCtx.createGain();masterGain.gain.value=1;masterGain.connect(audioCtx.destination);audioDest=audioCtx.createMediaStreamDestination();masterGain.connect(audioDest);try{const buf=audioCtx.createBuffer(1,1,22050);const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start(0);}catch(_){}}unlockSilent();return audioCtx;}
function audioOut(){getAC();return masterGain||(audioCtx&&audioCtx.destination);}
function tone(f,d,t='sine',v=.25,dl=0){if(muted)return;try{const ac=getAC();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(audioOut());o.type=t;o.frequency.setValueAtTime(f,ac.currentTime+dl);g.gain.setValueAtTime(v,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d+.01);}catch(_){}}
const sfx={
  flap(){tone(600,.05,'square',.18);},
  score(){tone(1320,.08,'sine',.25);tone(1760,.1,'sine',.18,.04);},
  crash(){tone(110,.4,'sawtooth',.45);},
  count(last){tone(last?880:440,.15,'triangle',.3);},
  cheer(){tone(440,.3,'sine',.2);},
};

let mpHands=null,sendingHands=false;
try{mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});mpHands.setOptions({maxNumHands:2,modelComplexity:IS_MOBILE?0:1,minDetectionConfidence:IS_MOBILE?.3:.5,minTrackingConfidence:IS_MOBILE?.3:.4});mpHands.onResults(r=>{hands=[];handsCount=0;if(!r.multiHandLandmarks)return;handsCount=r.multiHandLandmarks.length;for(const lms of r.multiHandLandmarks){const lm=lms[9];let cx,cy;if(cropParams){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vx=lm.x*vw,vy=lm.y*vh;const nx=(vx-cropParams.sx)/cropParams.sw;cx=(isFrontCamera?(1-nx):nx)*W;cy=(vy-cropParams.sy)/cropParams.sh*H;}else{cx=(isFrontCamera?(1-lm.x):lm.x)*W;cy=lm.y*H;}hands.push([{x:cx,y:cy}]);}});}catch(e){console.warn(e);}
async function pumpFrames(){if(mpHands&&video.readyState>=2&&!sendingHands){sendingHands=true;try{await mpHands.send({image:video});}catch(_){}sendingHands=false;}requestAnimationFrame(pumpFrames);}

let currentCamId=null;
async function startCamera(deviceId,facingPref){try{if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());const Wi=IS_MOBILE?2160:3840,Hi=IS_MOBILE?3840:2160;const c={video:deviceId?{deviceId:{exact:deviceId},width:{ideal:Wi},height:{ideal:Hi}}:{facingMode:facingPref||'user',width:{ideal:Wi},height:{ideal:Hi}},audio:false};const s=await navigator.mediaDevices.getUserMedia(c);video.srcObject=s;await video.play();const st=s.getVideoTracks()[0].getSettings();currentCamId=deviceId||st.deviceId;isFrontCamera=st.facingMode?(st.facingMode==='user'):true;cameraOK=true;$('status').textContent=`✅ ${st.width||'?'}×${st.height||'?'}`;return true;}catch(e){$('status').textContent='⚠️ '+e.message;return false;}}
async function listCameras(){try{const devs=await navigator.mediaDevices.enumerateDevices();const cams=devs.filter(d=>d.kind==='videoinput');$('camSelect').innerHTML='';cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.deviceId;let lbl=c.label||`Camera ${i+1}`;if(/iphone/i.test(lbl))lbl='📱 '+lbl;else if(/facetime|builtin/i.test(lbl))lbl='💻 '+lbl;o.textContent=lbl;if(c.deviceId===currentCamId)o.selected=true;$('camSelect').appendChild(o);});if(cams.length===0)$('camSelect').innerHTML='<option>No cameras</option>';}catch(_){}}
$('camSelect').addEventListener('change',()=>startCamera($('camSelect').value));
if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',listCameras);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)listCameras();});
function drawCamera(){ctx.save();if(isFrontCamera){ctx.translate(W,0);ctx.scale(-1,1);}if(video.readyState>=2){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vAR=vw/vh,cAR=W/H;let sx,sy,sw,sh;if(vAR>cAR){sh=vh;sw=vh*cAR;sx=(vw-sw)/2;sy=0;}else{sw=vw;sh=vw/cAR;sx=0;sy=(vh-sh)/2;}cropParams={sx,sy,sw,sh};ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);}else{ctx.fillStyle='#1a2d10';ctx.fillRect(0,0,W,H);cropParams=null;}ctx.restore();}

class P{constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-.5)*9;this.vy=(Math.random()-.5)*9-3;this.r=3+Math.random()*5;this.c=c;this.life=1;this.dec=.018;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.25;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
class Cf{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-.5)*10;this.vy=-6-Math.random()*6;this.w=6+Math.random()*6;this.h=4+Math.random()*4;this.rot=Math.random()*Math.PI;this.rotV=(Math.random()-.5)*.15;const PA=['#84cc16','#fbbf24','#fff','#ef4444','#0ea5e9'];this.c=PA[0|Math.random()*PA.length];this.life=1;this.dec=.012;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.rot+=this.rotV;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.c;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();}}
class FT{constructor(x,y,t,c,big){this.x=x;this.y=y;this.t=t;this.c=c;this.life=1;this.vy=big?-3:-1.8;this.sz=big?40:22;}update(){this.y+=this.vy;this.life-=.022;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.font=`900 ${this.sz}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=4;ctx.strokeText(this.t,this.x,this.y);ctx.fillStyle=this.c;ctx.fillText(this.t,this.x,this.y);ctx.restore();}}
let particles=[],floatTexts=[],confetti=[];
function burstP(x,y,c,n=15){for(let i=0;i<n;i++)particles.push(new P(x,y,i%2?c:'#fff'));}
function burstC(x,y,n=70){for(let i=0;i<n;i++)confetti.push(new Cf(x,y));}
function floatT(x,y,t,c,big){floatTexts.push(new FT(x,y,t,c,big));}

/* ===== BIRD + PIPES ===== */
const bird={x:W*.3, y:H*.45, vy:0, r:24, rot:0, wingPhase:0};
let pipes=[];
let bgX=0;
let prevHandY=[];
let pipeT=0;
let scrolled=0;
let score=0,passed=0;
let hiScore=parseInt(localStorage.getItem('flappy_hi')||'0');

function spawnPipe(){
  const gap=180+Math.max(0,150-score*3);
  const minTop=80, maxTop=H-gap-150;
  const topH=minTop+Math.random()*(maxTop-minTop);
  pipes.push({x:W+50, topH, gap, passed:false, w:64});
}
function endGame(){if(gameState==='gameover')return;gameState='gameover';if(score>hiScore){hiScore=score;localStorage.setItem('flappy_hi',hiScore);}sfx.cheer();ping('complete_flappy');burstC(W*.3,SAFE.y+220,90);burstC(W*.7,SAFE.y+220,90);if(isRecording){if(endRecordTimer)clearTimeout(endRecordTimer);endRecordTimer=setTimeout(()=>{if(isRecording&&gameState==='gameover')stopRecording();},END_RECORD_MS);}}

let gravFlip=0, gravFlipNext=5; /* seconds remaining, score threshold for next flip */
function update(d){
  if(window.GameOS) GameOS.update(d);
  if(timerMode!=='endless'&&timerRunning){timerLeft=Math.max(0,timerLeft-d);if(timerLeft<=0){timerRunning=false;endGame();}}
  /* GRAVITY FLIP — every 5 pipes the world inverts for 3s. Bird's instincts betray you. */
  if(score>=gravFlipNext && gravFlip<=0){
    gravFlip=3.0; gravFlipNext+=5;
    if(window.GameOS){ GameOS.onBigMoment(0.8); GameOS.shake(12,18); }
    floatT(W/2, SAFE.y+120, '🌀 GRAVITY FLIP!', '#a855f7', true);
    sfx.flap();
  }
  if(gravFlip>0) gravFlip-=d;
  const gDir = gravFlip>0 ? -1 : 1;

  /* DETECT FLAP: any hand moving UP fast = thrust */
  const currentHandY = hands.map(h=>h[0]?.y).filter(v=>typeof v==='number');
  let totalFlap=0;
  if(prevHandY.length===currentHandY.length){
    for(let i=0;i<currentHandY.length;i++){
      const dy = prevHandY[i] - currentHandY[i]; /* positive = moved up */
      if(dy>8) totalFlap += dy;
    }
  }
  prevHandY=currentHandY;

  if(totalFlap>10){
    bird.vy = gDir * (-7 - Math.min(6, totalFlap*0.3)); /* thrust opposes gravity direction */
    bird.wingPhase = .8;
    sfx.flap();
    burstP(bird.x-15, bird.y, '#fbbf24', 3);
  }

  /* gravity (flips during gravFlip) */
  bird.vy += 0.35 * gDir;
  bird.vy = Math.max(-10, Math.min(bird.vy, 10));
  bird.y += bird.vy;
  bird.rot = Math.max(-.5, Math.min(1.0, bird.vy*0.06));
  bird.wingPhase = Math.max(0, bird.wingPhase - d*4);

  /* floor / ceiling */
  if(bird.y > H-50){bird.y=H-50; crash(); return;}
  if(bird.y < 30){bird.y=30; bird.vy=0;}

  /* scroll pipes */
  const speed = 3.5;
  scrolled += speed;
  for(const p of pipes){
    p.x -= speed;
    /* check collision */
    if(p.x < bird.x+bird.r && p.x+p.w > bird.x-bird.r){
      if(bird.y-bird.r < p.topH || bird.y+bird.r > p.topH+p.gap){
        crash();
        return;
      }
    }
    /* check pass */
    if(!p.passed && p.x+p.w < bird.x){
      p.passed=true; passed++; score++;
      if(window.GameOS) GameOS.onScore(1, bird.x, bird.y-40, '+1');
      else floatT(bird.x, bird.y-40, '+1', '#fbbf24');
      sfx.score();burstP(p.x+p.w/2, p.topH+p.gap/2, '#fbbf24', 8);
      flashAlpha=.2; flashCol='251,191,36';
    }
  }
  pipes = pipes.filter(p=>p.x+p.w>-10);

  /* spawn */
  pipeT -= d;
  if(pipeT<=0){pipeT=1.6; spawnPipe();}

  /* parallax bg */
  bgX -= speed*.3;
}

function crash(){
  burstP(bird.x, bird.y, '#ef4444', 30);
  sfx.crash();shakeFrames=22;shakeAmp=16;flashAlpha=.6;flashCol='239,68,68';
  endGame();
}

/* ===== BACKGROUND ===== */
function drawBg(){
  /* sky gradient */
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'rgba(135,200,250,.5)');
  sky.addColorStop(.4,'rgba(180,230,255,.4)');
  sky.addColorStop(.7,'rgba(220,240,180,.3)');
  sky.addColorStop(1,'rgba(120,180,80,.4)');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  /* clouds parallax */
  for(let i=0;i<6;i++){
    const cx=((bgX*.3 + i*150) % (W+200))-100;
    const cy=80+i*30;
    ctx.save();ctx.globalAlpha=.7;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+18,cy,22,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+38,cy,16,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+24,cy-10,18,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  /* distant hills */
  for(let layer=0;layer<2;layer++){
    ctx.save();
    const offY = H*(.65+layer*.05);
    const grad=ctx.createLinearGradient(0,offY,0,offY+80);
    grad.addColorStop(0, layer?'#3f6212':'#65a30d');
    grad.addColorStop(1, layer?'#1a2e08':'#365314');
    ctx.fillStyle=grad;
    ctx.beginPath();
    const spd=layer?.4:.6;
    const phase = bgX*spd;
    ctx.moveTo(0, offY+30);
    for(let x=0;x<=W+50;x+=30){
      const y=offY + 30 + Math.sin((x+phase)*.02)*15 - Math.abs(Math.sin((x+phase)*.01))*30;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

function drawPipe(p){
  /* PIPE — green with darker shading + caps */
  const drawSegment=(x,y,w,h)=>{
    /* body */
    const g=ctx.createLinearGradient(x,y,x+w,y);
    g.addColorStop(0,'#3f6212');
    g.addColorStop(.3,'#65a30d');
    g.addColorStop(.7,'#84cc16');
    g.addColorStop(1,'#3f6212');
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    /* outline */
    ctx.strokeStyle='#1a2e08';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
    /* shine */
    ctx.fillStyle='rgba(255,255,255,.15)';
    ctx.fillRect(x+5,y,4,h);
  };
  const drawCap=(x,y,w,h)=>{
    ctx.fillStyle='#3f6212';
    ctx.fillRect(x-6,y,w+12,h);
    ctx.fillStyle='#84cc16';
    ctx.fillRect(x-4,y+2,w+8,h-4);
    ctx.strokeStyle='#1a2e08';ctx.lineWidth=2;
    ctx.strokeRect(x-6,y,w+12,h);
  };
  /* TOP PIPE */
  drawSegment(p.x, 0, p.w, p.topH-24);
  drawCap(p.x, p.topH-24, p.w, 24);
  /* BOTTOM PIPE */
  drawCap(p.x, p.topH+p.gap, p.w, 24);
  drawSegment(p.x, p.topH+p.gap+24, p.w, H-(p.topH+p.gap+24));
}

function drawBird(){
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  /* shadow */
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=10;ctx.shadowOffsetY=5;
  /* body */
  const g=ctx.createRadialGradient(-bird.r*.3, -bird.r*.4, bird.r*.1, 0, 0, bird.r*1.1);
  g.addColorStop(0,'#fde047');
  g.addColorStop(.6,'#fbbf24');
  g.addColorStop(1,'#b45309');
  ctx.beginPath();ctx.ellipse(0,0,bird.r*1.1,bird.r,0,0,Math.PI*2);
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;
  /* belly */
  ctx.beginPath();ctx.ellipse(2,4,bird.r*.7,bird.r*.55,0,0,Math.PI*2);
  ctx.fillStyle='#fef9c3';ctx.fill();
  /* wing - animated */
  const wingY = bird.wingPhase>0 ? -8-bird.wingPhase*6 : 4;
  ctx.beginPath();
  ctx.ellipse(-bird.r*.3, wingY, bird.r*.55, bird.r*.4, -.3, 0, Math.PI*2);
  ctx.fillStyle='#f59e0b';ctx.fill();
  ctx.strokeStyle='#92400e';ctx.lineWidth=1.5;ctx.stroke();
  /* eye */
  ctx.beginPath();ctx.arc(bird.r*.4, -bird.r*.2, bird.r*.25, 0, Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(bird.r*.5, -bird.r*.2, bird.r*.13, 0, Math.PI*2);
  ctx.fillStyle='#000';ctx.fill();
  /* beak */
  ctx.beginPath();
  ctx.moveTo(bird.r*.9, -2);
  ctx.lineTo(bird.r*1.5, 0);
  ctx.lineTo(bird.r*.9, 8);
  ctx.closePath();
  ctx.fillStyle='#ea580c';ctx.fill();
  ctx.strokeStyle='#7c2d12';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}

function drawHands(){
  for(const h of hands){
    const p=h[0];
    ctx.save();
    ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);
    ctx.fillStyle='rgba(132,204,22,.15)';ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);
    ctx.strokeStyle='#84cc16';ctx.lineWidth=2.5;
    ctx.shadowColor='#84cc16';ctx.shadowBlur=10;ctx.stroke();
    ctx.shadowBlur=0;
    ctx.font='14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🪶',p.x,p.y);
    ctx.restore();
  }
}

function draw(){
  drawCamera();drawBg();
  for(const p of pipes)drawPipe(p);
  drawBird();
  drawHands();
  for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);
  for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);
  for(const t of floatTexts){t.update();t.draw();}floatTexts=floatTexts.filter(t=>t.life>0);
  if(gravFlip>0){ /* purple gravity-flip overlay */
    const a=Math.min(.22, gravFlip*0.15);
    ctx.fillStyle=`rgba(168,85,247,${a})`; ctx.fillRect(0,0,W,H);
  }
  if(window.GameOS) GameOS.drawPopups(ctx);
  drawHUD();
  if(window.GameOS) GameOS.drawComboHUD(ctx, SAFE.x+12, SAFE.y+SAFE.h-24, 84);
}

function drawHUD(){
  const hudY=SAFE.y+12;
  ctx.save();ctx.font='900 60px -apple-system,Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=10;ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(String(score),W/2,hudY);ctx.fillStyle='#fff';ctx.fillText(String(score),W/2,hudY);ctx.restore();
  ctx.save();ctx.textAlign='right';ctx.textBaseline='top';if(timerMode!=='endless'){const col=timerLeft<=10?'#ef4444':timerLeft<=20?'#f59e0b':'#22c55e';ctx.font='900 28px Arial';ctx.fillStyle=col;ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillText(`${Math.ceil(timerLeft)}s`,SAFE.x+SAFE.w-5,hudY);}ctx.restore();
  ctx.save();ctx.font='bold 11px Arial';ctx.textBaseline='bottom';ctx.textAlign='left';ctx.fillStyle=handsCount>0?'#55efc4':'#ff8888';ctx.fillText(handsCount>0?`🪶 ${handsCount} WING(S)`:'🪶 SHOW HANDS',SAFE.x+5,SAFE.y+SAFE.h-8);if(hiScore>0){ctx.textAlign='right';ctx.fillStyle='rgba(249,202,36,.7)';ctx.fillText(`🏆 ${hiScore}`,SAFE.x+SAFE.w-5,SAFE.y+SAFE.h-8);}ctx.restore();
  if(isRecording){ctx.save();ctx.beginPath();ctx.arc(SAFE.x+SAFE.w-15,hudY+10,6,0,Math.PI*2);ctx.fillStyle=`rgba(244,63,94,${.7+.3*Math.sin(Date.now()/250)})`;ctx.shadowColor='#f43f5e';ctx.shadowBlur=12;ctx.fill();ctx.restore();}
}

function drawCountdown(){ctx.fillStyle='rgba(0,0,10,.4)';ctx.fillRect(0,0,W,H);const big=cdNum===0;ctx.save();ctx.font='900 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;ctx.fillStyle='#84cc16';ctx.fillText('FLAP YOUR ARMS!',W/2,SAFE.y+220);ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText('Move hands UP-DOWN to flap',W/2,SAFE.y+255);ctx.font=`900 ${big?100:160}px Arial`;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=8;ctx.strokeText(big?'FLY!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.fillStyle=big?'#84cc16':'#fff';ctx.fillText(big?'FLY!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.restore();drawHands();}

function drawEnd(){ctx.fillStyle='rgba(0,0,10,.85)';ctx.fillRect(0,0,W,H);const cw=SAFE.w-20,ch=400;const cx=SAFE.x+10,cy=SAFE.y+(SAFE.h-ch)/2-20;const ccx=cx+cw/2;ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,cy,cw,ch,24);else ctx.rect(cx,cy,cw,ch);ctx.fillStyle='rgba(10,20,8,.85)';ctx.fill();ctx.strokeStyle='rgba(132,204,22,.3)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();let y=cy+50;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='80px Arial';const e=score>=20?'🦅':score>=10?'🐦':score>=5?'🪶':'🐤';ctx.fillText(e,ccx,y);y+=70;ctx.font='900 26px Arial';ctx.fillStyle='#84cc16';const lbl=score>=20?'EAGLE EYE!':score>=10?'BIRD MASTER!':score>=5?'NICE FLAPS!':'KEEP FLAPPING!';ctx.fillText(lbl,ccx,y);y+=46;ctx.font='bold 16px Arial';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('FLAPPY FLAP',ccx,y);y+=30;ctx.font='900 32px Arial';ctx.fillStyle='#fff';ctx.fillText(`${score} pipes passed`,ccx,y);y+=42;if(score>=hiScore&&score>0){ctx.font='900 18px Arial';ctx.fillStyle='#fbbf24';ctx.fillText('🏆 NEW RECORD!',ccx,y);y+=22;}else if(hiScore>0){ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText(`Best: ${hiScore}`,ccx,y);}ctx.font='bold 13px Arial';ctx.fillStyle='#84cc16';ctx.fillText('🎬 #GameOSFlappy',ccx,cy+ch-44);ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText('▶ Press Start to play again',ccx,cy+ch-22);ctx.restore();}

function loop(ts){dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;ctx.setTransform(SCALE,0,0,SCALE,0,0);if(shakeFrames>0){const a=shakeAmp*(shakeFrames/22);ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);shakeFrames--;}
  if(gameState==="ready"){drawCamera();drawBg();drawBird();if(window.drawGameOSReady)window.drawGameOSReady(ctx,{W,H,SAFE,emoji:"🐦",name:"Flappy Arms",tagline:"FLAP YOUR ARMS to fly through pipes!",hiScore,hue:180,accentA:"#84cc16",accentB:"#0ea5e9",tip:"🦅 Use your whole body — big flaps = big lift"});drawHands();}
  else if(gameState==='countdown'){drawCamera();drawBg();drawBird();cdT-=dt;if(cdT<=0){cdNum--;if(cdNum<0){gameState='playing';timerLeft=parseInt(timerMode)||999;timerRunning=true;}else{cdT=1;sfx.count(cdNum===0);}}drawCountdown();}
  else if(gameState==='playing'){update(dt);if(flashAlpha>0){ctx.fillStyle=`rgba(${flashCol},${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha=Math.max(0,flashAlpha-dt*2.5);}draw();}
  else if(gameState==='gameover'){drawCamera();drawBg();for(const p of pipes)drawPipe(p);drawBird();for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);drawEnd();}
  requestAnimationFrame(loop);}

let mediaRecorder=null,recChunks=[],savedBlob=null,savedMime='';
function pickMime(){const w=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(const m of w)if(MediaRecorder.isTypeSupported(m))return m;return '';}
function startRecording(){recChunks=[];savedBlob=null;$('dlArea').style.display='none';getAC();const vs=canvas.captureStream(30);let stream=vs;if(audioDest&&audioDest.stream&&audioDest.stream.getAudioTracks().length){stream=new MediaStream([...vs.getVideoTracks(),...audioDest.stream.getAudioTracks()]);}savedMime=pickMime();const opts={videoBitsPerSecond:16_000_000,audioBitsPerSecond:256_000};if(savedMime)opts.mimeType=savedMime;try{mediaRecorder=new MediaRecorder(stream,opts);}catch(e){mediaRecorder=new MediaRecorder(stream);savedMime='video/webm';}mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};mediaRecorder.onstop=()=>{const ext=savedMime.includes('mp4')?'mp4':'webm';savedBlob=new Blob(recChunks,{type:savedMime||'video/webm'});savedBlob.__ext=ext;const mb=(savedBlob.size/1024/1024).toFixed(1);$('dlMeta').textContent=`${mb}MB .${ext}`;$('dlArea').style.display='flex';$('status').textContent='✅ Done!';};mediaRecorder.start(100);isRecording=true;$('recordBtn').textContent='⏹ Stop & Save';$('recordBtn').classList.add('rec');$('status').textContent='● REC';try{const ac=getAC();if(ac){const o=ac.createOscillator(),g=ac.createGain();g.gain.value=0.0001;o.connect(g);g.connect(audioOut());o.frequency.value=20;o.start();mediaRecorder._silent=o;}}catch(_){}ping('record_flappy');}
function stopRecording(){if(mediaRecorder){try{if(mediaRecorder._silent)mediaRecorder._silent.stop();}catch(_){}if(mediaRecorder.state!=='inactive')mediaRecorder.stop();}isRecording=false;$('recordBtn').textContent='⏺ Record';$('recordBtn').classList.remove('rec');$('status').textContent='Saving…';}

function reset(){score=0;passed=0;bird.y=H*.45;bird.vy=0;bird.rot=0;bird.wingPhase=0;pipes=[];pipeT=.8;bgX=0;scrolled=0;prevHandY=[];particles=[];floatTexts=[];confetti=[];flashAlpha=0;shakeFrames=0;timerRunning=false;timerLeft=parseInt(timerMode)||999;gravFlip=0;gravFlipNext=5;if(window.GameOS)GameOS.reset();}
$('startBtn').addEventListener('click',()=>{getAC();reset();cdNum=3;cdT=1;sfx.count(false);gameState='countdown';$('startBtn').textContent='🔄 Restart';ping('start_flappy');});
$('stopBtn').addEventListener('click',()=>{if(gameState==='playing'||gameState==='countdown')endGame();});
$('recordBtn').addEventListener('click',()=>{if(!isRecording)startRecording();else stopRecording();});
$('shareBtn').addEventListener('click',()=>{const url=location.href;if(navigator.share)navigator.share({title:'🐦 Flappy Flap',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>{$('status').textContent='🔗 Copied!';setTimeout(()=>$('status').textContent='',2500);});else prompt('Link:',url);ping('share_flappy');});
$('dlBtn').addEventListener('click',()=>{if(!savedBlob)return;const url=URL.createObjectURL(savedBlob);const a=document.createElement('a');a.href=url;a.download=`flappy-${Date.now()}.${savedBlob.__ext||'webm'}`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);$('dlMeta').textContent='Downloaded! 🚀';ping('download_flappy');});
$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇 Sound':'🔊 Sound';$('muteBtn').classList.toggle('on',!muted);});
document.querySelectorAll('.t-btn').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');timerMode=el.dataset.mode;}));

(async()=>{await startCamera();await listCameras();pumpFrames();})();
[1500,3500,7000].forEach(ms=>setTimeout(listCameras,ms));
requestAnimationFrame(t=>{lastTime=t;loop(t);});
</script>
<script src="gameos-nav.js"></script>
