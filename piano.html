<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1e1b4b" />
<title>🎹 Piano Tiles — Hit the Beat</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{background:#0a0612;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;gap:18px}
#wrap{position:relative;height:95vh;aspect-ratio:9/16;flex-shrink:0;border-radius:24px;overflow:hidden;box-shadow:0 0 90px rgba(124,58,237,.35),0 0 0 2px rgba(255,255,255,.06)}
canvas{width:100%;height:100%;display:block;background:#0a0612}
#panel{display:flex;flex-direction:column;gap:7px;width:186px;max-height:95vh;overflow-y:auto;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
.badge{padding:11px 8px;border-radius:13px;text-align:center;background:linear-gradient(135deg,#4c1d95,#a855f7);box-shadow:0 6px 22px rgba(168,85,247,.4)}
.badge .nm{font-size:15px;font-weight:900;letter-spacing:2px;color:#fff}
.badge .tg{font-size:8.5px;opacity:.95;margin-top:2px;letter-spacing:1px;font-weight:700}
.btn{width:100%;padding:11px 8px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96);opacity:.85}
#startBtn{background:linear-gradient(135deg,#4c1d95,#a855f7);color:#fff}
#stopBtn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1)}
#recordBtn{background:linear-gradient(135deg,#ef4444,#f43f5e);color:#fff}
#recordBtn.rec{animation:rec 1.1s ease-in-out infinite}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.7)}50%{box-shadow:0 0 0 9px rgba(244,63,94,0)}}
#shareBtn{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff}
#dlArea{display:none;flex-direction:column;gap:5px}
#dlBtn{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.dl-meta{font-size:9px;color:rgba(255,255,255,.4);text-align:center;line-height:1.4}
.divider{height:1px;background:rgba(255,255,255,.07);margin:1px 0}
.sec{font-size:10px;font-weight:800;color:rgba(255,255,255,.32);letter-spacing:1px;text-transform:uppercase}
select{width:100%;padding:7px;border-radius:9px;background:rgba(255,255,255,.05);color:#fff;font-size:11px;border:1px solid rgba(255,255,255,.1)}
.row3{display:flex;gap:5px}
.t-btn{flex:1;padding:7px 3px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.08);transition:all .12s}
.t-btn.active{background:rgba(168,85,247,.22);color:#d8b4fe;border-color:rgba(168,85,247,.45)}
.toggle-btn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1);font-size:11px}
.toggle-btn.on{background:rgba(85,239,196,.15);color:#55efc4;border-color:rgba(85,239,196,.35)}
#status{font-size:10px;color:rgba(255,255,255,.4);text-align:center;line-height:1.6}
.hint{font-size:10px;color:rgba(255,255,255,.3);line-height:1.85}
@media (max-width:900px),(orientation:portrait) and (max-width:1100px){body{flex-direction:column;min-height:100dvh;min-height:100vh;height:auto;align-items:stretch;justify-content:flex-start;padding:5px;gap:5px;overflow:visible}#wrap{height:calc(100dvh - 130px);height:calc(100vh - 130px);width:auto;max-width:calc(100vw - 10px);aspect-ratio:9/16;margin:0 auto;border-radius:18px;flex-shrink:0}#panel{width:100%;max-width:560px;margin:0 auto;flex-direction:row;flex-wrap:wrap;gap:5px;max-height:none;overflow:visible;align-content:flex-start;padding:0 4px;flex-shrink:0}.badge,#status,.sec,.divider,#camSelect,.hint{display:none !important}#panel .btn{flex:1 1 calc(33% - 5px);padding:10px 5px;font-size:12px;min-width:0}#panel #recordBtn,#panel #shareBtn{flex:1 1 calc(50% - 3px)}#panel #dlArea{flex:1 1 100%;flex-direction:row;gap:4px}#panel #dlBtn{flex:1 1 100%;padding:10px 5px;font-size:12px}#panel .dl-meta{display:none}.row3{flex:1 1 100%;display:flex;gap:4px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="canv"></canvas></div>
<div id="panel">
<div class="badge"><div class="nm">🎹 PIANO TILES</div><div class="tg">HIT THE BEAT</div></div>
<button class="btn" id="startBtn">▶ Start</button><button class="btn" id="stopBtn">⏹ Stop</button>
<div class="sec">Mode</div><div class="row3"><button class="t-btn" data-mode="endless">∞</button><button class="t-btn active" data-mode="60">60s</button><button class="t-btn" data-mode="30">30s</button></div>
<button class="btn" id="recordBtn">⏺ Record</button>
<div id="dlArea"><button class="btn" id="dlBtn">⬇ Download</button><div class="dl-meta" id="dlMeta">—</div></div>
<button class="btn" id="shareBtn">🔗 Share</button>
<div class="divider"></div><div class="sec">Camera</div><select id="camSelect"><option>Loading…</option></select>
<div class="divider"></div><button class="btn toggle-btn on" id="muteBtn">🔊 Sound</button>
<div id="status">Loading…</div>
<div class="divider"></div><div class="hint">🎹 Tap black tiles<br>👆 Hand in lane<br>🎵 Each tap = note<br>⚡ Don't miss any</div>
</div>
<video id="vid" playsinline webkit-playsinline muted autoplay style="display:none"></video>
<audio id="silent" playsinline webkit-playsinline loop preload="auto" src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//FJAhwBkgVw6q9PoIjLZNAvQQyPM1wAA4AGRmHEEswj3w5tOi4NRGvSILIRWFYABg00cZ4FpcFzEkdjEQwYYXQH0ABp0uKkCUDuMa7QrZmWTFjHd" style="display:none"></audio>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script>
const STATS_NS='gameos-kyadav2270';
function ping(k){fetch(`https://abacus.jasoncameron.dev/hit/${STATS_NS}/${k}`).catch(()=>{});}
ping('visit_piano');
const canvas=document.getElementById('canv'),ctx=canvas.getContext('2d'),video=document.getElementById('vid');
const $=id=>document.getElementById(id);
const W=540,H=960,RW=1080,RH=1920,SCALE=RW/W;canvas.width=RW;canvas.height=RH;
const SAFE={x:25,y:90,w:390,h:630};
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);
let gameState='ready',lastTime=0,dt=0,hands=[],handsCount=0,cameraOK=false,cropParams=null,isFrontCamera=true;
let timerMode='60',timerLeft=60,timerRunning=false,isRecording=false,cdNum=3,cdT=0,endRecordTimer=null;
const END_RECORD_MS=4500;let shakeFrames=0,shakeAmp=0,flashAlpha=0,flashCol='255,255,255';

let muted=false,audioCtx=null,masterGain=null,audioDest=null,silentUnlocked=false;
function unlockSilent(){if(silentUnlocked)return;const el=$('silent');if(!el)return;el.volume=0.001;const p=el.play();if(p&&p.then)p.then(()=>silentUnlocked=true).catch(()=>{});else silentUnlocked=true;}
function getAC(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();if(audioCtx&&!masterGain){masterGain=audioCtx.createGain();masterGain.gain.value=1;masterGain.connect(audioCtx.destination);audioDest=audioCtx.createMediaStreamDestination();masterGain.connect(audioDest);try{const buf=audioCtx.createBuffer(1,1,22050);const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start(0);}catch(_){}}unlockSilent();return audioCtx;}
function audioOut(){getAC();return masterGain||(audioCtx&&audioCtx.destination);}
function tone(f,d,t='sine',v=.25,dl=0){if(muted)return;try{const ac=getAC();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(audioOut());o.type=t;o.frequency.setValueAtTime(f,ac.currentTime+dl);g.gain.setValueAtTime(v,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d+.01);}catch(_){}}
/* piano scale */
const SCALE_NOTES=[523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5]; // C major
let noteIdx=0;
const sfx={
  note(lane){const f=SCALE_NOTES[(lane+noteIdx)%SCALE_NOTES.length];tone(f,.18,'sine',.22);tone(f*2,.12,'triangle',.08,.02);noteIdx++;},
  miss(){tone(110,.3,'sawtooth',.4);},
  count(last){tone(last?880:440,.15,'triangle',.3);},
  cheer(){tone(440,.3,'sine',.2);},
  levelup(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.22,i*.08));},
};

let mpHands=null,sendingHands=false;
try{mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});mpHands.setOptions({maxNumHands:2,modelComplexity:IS_MOBILE?0:1,minDetectionConfidence:IS_MOBILE?.3:.5,minTrackingConfidence:IS_MOBILE?.3:.4});mpHands.onResults(r=>{hands=[];handsCount=0;if(!r.multiHandLandmarks)return;handsCount=r.multiHandLandmarks.length;for(const lms of r.multiHandLandmarks){const lm=lms[8];/* index tip */let cx,cy;if(cropParams){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vx=lm.x*vw,vy=lm.y*vh;const nx=(vx-cropParams.sx)/cropParams.sw;cx=(isFrontCamera?(1-nx):nx)*W;cy=(vy-cropParams.sy)/cropParams.sh*H;}else{cx=(isFrontCamera?(1-lm.x):lm.x)*W;cy=lm.y*H;}hands.push([{x:cx,y:cy}]);}});}catch(e){console.warn(e);}
async function pumpFrames(){if(mpHands&&video.readyState>=2&&!sendingHands){sendingHands=true;try{await mpHands.send({image:video});}catch(_){}sendingHands=false;}requestAnimationFrame(pumpFrames);}

let currentCamId=null;
async function startCamera(deviceId,facingPref){try{if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());const Wi=IS_MOBILE?2160:3840,Hi=IS_MOBILE?3840:2160;const c={video:deviceId?{deviceId:{exact:deviceId},width:{ideal:Wi},height:{ideal:Hi}}:{facingMode:facingPref||'user',width:{ideal:Wi},height:{ideal:Hi}},audio:false};const s=await navigator.mediaDevices.getUserMedia(c);video.srcObject=s;await video.play();const st=s.getVideoTracks()[0].getSettings();currentCamId=deviceId||st.deviceId;isFrontCamera=st.facingMode?(st.facingMode==='user'):true;cameraOK=true;$('status').textContent=`✅ ${st.width||'?'}×${st.height||'?'}`;return true;}catch(e){$('status').textContent='⚠️ '+e.message;return false;}}
async function listCameras(){try{const devs=await navigator.mediaDevices.enumerateDevices();const cams=devs.filter(d=>d.kind==='videoinput');$('camSelect').innerHTML='';cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.deviceId;let lbl=c.label||`Camera ${i+1}`;if(/iphone/i.test(lbl))lbl='📱 '+lbl;else if(/facetime|builtin/i.test(lbl))lbl='💻 '+lbl;o.textContent=lbl;if(c.deviceId===currentCamId)o.selected=true;$('camSelect').appendChild(o);});if(cams.length===0)$('camSelect').innerHTML='<option>No cameras</option>';}catch(_){}}
$('camSelect').addEventListener('change',()=>startCamera($('camSelect').value));
if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',listCameras);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)listCameras();});
function drawCamera(){ctx.save();if(isFrontCamera){ctx.translate(W,0);ctx.scale(-1,1);}if(video.readyState>=2){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vAR=vw/vh,cAR=W/H;let sx,sy,sw,sh;if(vAR>cAR){sh=vh;sw=vh*cAR;sx=(vw-sw)/2;sy=0;}else{sw=vw;sh=vw/cAR;sx=0;sy=(vh-sh)/2;}cropParams={sx,sy,sw,sh};ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);}else{ctx.fillStyle='#0a0612';ctx.fillRect(0,0,W,H);cropParams=null;}ctx.restore();}

class P{constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-.5)*9;this.vy=(Math.random()-.5)*9-3;this.r=3+Math.random()*5;this.c=c;this.life=1;this.dec=.018;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.25;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
class Cf{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-.5)*10;this.vy=-6-Math.random()*6;this.w=6+Math.random()*6;this.h=4+Math.random()*4;this.rot=Math.random()*Math.PI;this.rotV=(Math.random()-.5)*.15;const PA=['#a855f7','#ec4899','#fff','#fbbf24','#22d3ee'];this.c=PA[0|Math.random()*PA.length];this.life=1;this.dec=.012;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.rot+=this.rotV;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.c;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();}}
class FT{constructor(x,y,t,c,big){this.x=x;this.y=y;this.t=t;this.c=c;this.life=1;this.vy=big?-3:-1.8;this.sz=big?34:20;}update(){this.y+=this.vy;this.life-=.022;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.font=`900 ${this.sz}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=4;ctx.strokeText(this.t,this.x,this.y);ctx.fillStyle=this.c;ctx.fillText(this.t,this.x,this.y);ctx.restore();}}
let particles=[],floatTexts=[],confetti=[];
function burstP(x,y,c,n=10){for(let i=0;i<n;i++)particles.push(new P(x,y,i%2?c:'#fff'));}
function burstC(x,y,n=60){for(let i=0;i<n;i++)confetti.push(new Cf(x,y));}
function floatT(x,y,t,c,big){floatTexts.push(new FT(x,y,t,c,big));}

/* ===== PIANO ===== */
const LANES=4;
const PLAY_TOP = SAFE.y+50;
const PLAY_BOT = SAFE.y+SAFE.h-50;
const HIT_LINE = PLAY_BOT - 80;
const LANE_W = SAFE.w/LANES;
let tiles=[]; /* {lane, y, hit, missed, fx} */
let spawnT=.5;
let speed=180; /* px per second */
let score=0,hits=0,misses=0,streak=0,maxStreak=0;
let hiScore=parseInt(localStorage.getItem('piano_hi')||'0');

function spawnTile(){
  const lane=0|Math.random()*LANES;
  tiles.push({lane, y:-100, hit:false, missed:false, fx:0});
}
function endGame(){if(gameState==='gameover')return;gameState='gameover';if(score>hiScore){hiScore=score;localStorage.setItem('piano_hi',hiScore);}sfx.cheer();ping('complete_piano');burstC(W*.3,SAFE.y+220,90);burstC(W*.7,SAFE.y+220,90);if(isRecording){if(endRecordTimer)clearTimeout(endRecordTimer);endRecordTimer=setTimeout(()=>{if(isRecording&&gameState==='gameover')stopRecording();},END_RECORD_MS);}}

function laneOf(x){
  const inX = x - SAFE.x;
  if(inX<0||inX>SAFE.w) return -1;
  return Math.floor(inX/LANE_W);
}

let prevHandTaps={}; /* keyed by hand idx; track last lane to detect entry */

function update(d){
  if(timerMode!=='endless'&&timerRunning){timerLeft=Math.max(0,timerLeft-d);if(timerLeft<=0){timerRunning=false;endGame();}}
  /* gradually speed up */
  speed=180 + Math.min(220, hits*4);
  /* spawn tiles */
  spawnT-=d;
  const spawnInterval = Math.max(.35, .7 - hits*.005);
  if(spawnT<=0){spawnT=spawnInterval; spawnTile();}
  /* update tiles */
  for(const t of tiles){
    if(t.fx>0)t.fx-=d*3;
    if(t.hit||t.missed) continue;
    t.y += speed*d;
    if(t.y > HIT_LINE+50){
      /* missed */
      t.missed=true; misses++; streak=0;
      sfx.miss();shakeFrames=10;shakeAmp=8;flashAlpha=.3;flashCol='239,68,68';
      floatT(SAFE.x+t.lane*LANE_W+LANE_W/2, HIT_LINE-30, 'MISS', '#ef4444');
    }
  }
  /* hand tap detection: any fingertip inside an active tile's hit area */
  for(const h of hands){
    const p=h[0];if(!p)continue;
    const lane=laneOf(p.x);
    if(lane<0)continue;
    /* only register hit if hand near hit line */
    if(p.y < HIT_LINE-100 || p.y > HIT_LINE+50) continue;
    /* find closest unhit tile in that lane */
    let best=null,bestDy=999;
    for(const t of tiles){
      if(t.lane!==lane||t.hit||t.missed)continue;
      const dy=Math.abs(t.y - HIT_LINE);
      if(dy<70 && dy<bestDy){best=t;bestDy=dy;}
    }
    if(best){
      best.hit=true;best.fx=1;
      hits++;streak++;maxStreak=Math.max(maxStreak,streak);
      const perfect = bestDy<18;
      const pts = perfect?3:1;
      score+=pts*Math.max(1, Math.floor(streak/5));
      const fxCol = perfect?'#fbbf24':'#a855f7';
      floatT(SAFE.x+lane*LANE_W+LANE_W/2, HIT_LINE-30, perfect?'PERFECT!':'+1', fxCol, perfect);
      burstP(SAFE.x+lane*LANE_W+LANE_W/2, HIT_LINE, fxCol, perfect?14:8);
      sfx.note(lane);
      if(streak>0 && streak%10===0){floatT(W/2, SAFE.y+200, `🔥 ${streak} STREAK`, '#fbbf24', true);sfx.levelup();burstC(W*.3,SAFE.y+220,30);burstC(W*.7,SAFE.y+220,30);}
    }
  }
  /* remove tiles offscreen */
  tiles=tiles.filter(t=>t.y<H+100 && (!t.hit || t.fx>0));
}

/* ===== DRAW ===== */
function drawStage(){
  /* purple/pink dark stage */
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'rgba(20,5,40,.55)');
  sky.addColorStop(.5,'rgba(60,15,80,.55)');
  sky.addColorStop(1,'rgba(15,5,30,.85)');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  /* spotlight glow */
  const sp=ctx.createRadialGradient(W/2,H*.5,40,W/2,H*.5,W*.7);
  sp.addColorStop(0,'rgba(168,85,247,.18)');
  sp.addColorStop(1,'rgba(168,85,247,0)');
  ctx.fillStyle=sp;ctx.fillRect(0,0,W,H);
  /* equalizer bars at top */
  for(let i=0;i<12;i++){
    const x=SAFE.x+i*(SAFE.w/12);
    const bw=SAFE.w/12-3;
    const t=Math.sin(Date.now()/(120+i*30)+i)*.5+.5;
    const bh=8+t*22;
    const g=ctx.createLinearGradient(x,SAFE.y+10,x,SAFE.y+10+bh);
    g.addColorStop(0,'#ec4899');g.addColorStop(1,'#7c3aed');
    ctx.fillStyle=g;
    ctx.fillRect(x,SAFE.y+40-bh, bw, bh);
  }
  /* lane dividers */
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.08)';
  ctx.lineWidth=2;
  for(let i=0;i<=LANES;i++){
    const x=SAFE.x+i*LANE_W;
    ctx.beginPath();ctx.moveTo(x,PLAY_TOP);ctx.lineTo(x,PLAY_BOT);ctx.stroke();
  }
  /* hit line — glowing horizontal */
  const hl=ctx.createLinearGradient(SAFE.x,HIT_LINE,SAFE.x+SAFE.w,HIT_LINE);
  hl.addColorStop(0,'#ec4899');hl.addColorStop(.5,'#fff');hl.addColorStop(1,'#a855f7');
  ctx.strokeStyle=hl;ctx.lineWidth=4;
  ctx.shadowColor='#ec4899';ctx.shadowBlur=18;
  ctx.beginPath();ctx.moveTo(SAFE.x,HIT_LINE);ctx.lineTo(SAFE.x+SAFE.w,HIT_LINE);ctx.stroke();
  ctx.restore();
  /* white piano keys at bottom */
  for(let i=0;i<LANES;i++){
    const x=SAFE.x+i*LANE_W;
    /* white base */
    ctx.fillStyle='rgba(245,245,245,.92)';
    ctx.fillRect(x+2, HIT_LINE, LANE_W-4, PLAY_BOT-HIT_LINE);
    /* gradient face */
    const kg=ctx.createLinearGradient(x,HIT_LINE,x,PLAY_BOT);
    kg.addColorStop(0,'rgba(255,255,255,.95)');
    kg.addColorStop(1,'rgba(200,200,210,.92)');
    ctx.fillStyle=kg;ctx.fillRect(x+2, HIT_LINE, LANE_W-4, PLAY_BOT-HIT_LINE);
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=2;
    ctx.strokeRect(x+2, HIT_LINE, LANE_W-4, PLAY_BOT-HIT_LINE);
  }
}

function drawTile(t){
  if(t.hit){
    /* burst expand */
    const x=SAFE.x+t.lane*LANE_W+4;
    const w=LANE_W-8;
    ctx.save();
    ctx.globalAlpha=Math.max(0,t.fx);
    const ex=18*(1-t.fx);
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x-ex, HIT_LINE-50-ex, w+ex*2, 80+ex*2, 12);else ctx.rect(x-ex, HIT_LINE-50-ex, w+ex*2, 80+ex*2);
    ctx.fillStyle='rgba(168,85,247,.4)';
    ctx.fill();
    ctx.restore();
    return;
  }
  const x=SAFE.x+t.lane*LANE_W+4;
  const w=LANE_W-8, h=88;
  ctx.save();
  /* black tile body */
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x, t.y, w, h, 10);else ctx.rect(x, t.y, w, h);
  const g=ctx.createLinearGradient(x,t.y,x,t.y+h);
  g.addColorStop(0,'#1f1138');
  g.addColorStop(1,'#0a0421');
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;
  /* glowing edge */
  ctx.strokeStyle='#a855f7';ctx.lineWidth=2;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x, t.y, w, h, 10);else ctx.rect(x, t.y, w, h);
  ctx.stroke();
  /* shine highlight */
  ctx.fillStyle='rgba(168,85,247,.25)';
  ctx.fillRect(x+w*.1, t.y+4, w*.8, 6);
  /* music note icon */
  ctx.font='28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(216,180,254,.7)';
  ctx.fillText('🎵', x+w/2, t.y+h/2);
  ctx.restore();
}

function drawHands(){
  for(const h of hands){
    const p=h[0];
    /* highlight active lane */
    const lane=laneOf(p.x);
    if(lane>=0){
      ctx.save();
      ctx.fillStyle='rgba(168,85,247,.1)';
      ctx.fillRect(SAFE.x+lane*LANE_W, PLAY_TOP, LANE_W, PLAY_BOT-PLAY_TOP);
      ctx.restore();
    }
    ctx.save();
    ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);
    ctx.fillStyle='rgba(168,85,247,.2)';ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);
    ctx.strokeStyle='#a855f7';ctx.lineWidth=3;
    ctx.shadowColor='#a855f7';ctx.shadowBlur=12;ctx.stroke();
    ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    ctx.restore();
  }
}

function draw(){
  drawCamera();drawStage();
  for(const t of tiles)drawTile(t);
  drawHands();
  for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);
  for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);
  for(const t of floatTexts){t.update();t.draw();}floatTexts=floatTexts.filter(t=>t.life>0);
  drawHUD();
}

function drawHUD(){
  const hudY=SAFE.y+12;
  ctx.save();ctx.font='900 42px -apple-system,Arial';ctx.textAlign='left';ctx.textBaseline='top';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.fillText(String(score),SAFE.x+5,hudY);ctx.font='bold 11px Arial';ctx.fillStyle='#a855f7';ctx.fillText(`HITS ${hits} · MISS ${misses}`,SAFE.x+5,hudY+48);ctx.restore();
  ctx.save();ctx.textAlign='right';ctx.textBaseline='top';if(timerMode!=='endless'){const col=timerLeft<=10?'#ef4444':timerLeft<=20?'#f59e0b':'#22c55e';ctx.font='900 30px Arial';ctx.fillStyle=col;ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillText(`${Math.ceil(timerLeft)}s`,SAFE.x+SAFE.w-5,hudY);}ctx.restore();
  if(streak>=3){const pulse=1+0.06*Math.sin(Date.now()/80);ctx.save();ctx.font=`900 ${(22+Math.min(streak,8)*1.4)*pulse}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=6;ctx.fillStyle=`rgba(251,191,36,.85)`;ctx.fillText(`🔥 ${streak}`,W/2,hudY+28);ctx.restore();}
  ctx.save();ctx.font='bold 11px Arial';ctx.textBaseline='bottom';ctx.textAlign='left';ctx.fillStyle=handsCount>0?'#55efc4':'#ff8888';ctx.fillText(handsCount>0?`👆 ${handsCount} READY`:'👆 SHOW FINGERS',SAFE.x+5,SAFE.y+SAFE.h-8);if(hiScore>0){ctx.textAlign='right';ctx.fillStyle='rgba(249,202,36,.7)';ctx.fillText(`🏆 ${hiScore}`,SAFE.x+SAFE.w-5,SAFE.y+SAFE.h-8);}ctx.restore();
  if(isRecording){ctx.save();ctx.beginPath();ctx.arc(SAFE.x+SAFE.w-15,hudY+10,6,0,Math.PI*2);ctx.fillStyle=`rgba(244,63,94,${.7+.3*Math.sin(Date.now()/250)})`;ctx.shadowColor='#f43f5e';ctx.shadowBlur=12;ctx.fill();ctx.restore();}
}

function drawCountdown(){ctx.fillStyle='rgba(0,0,10,.55)';ctx.fillRect(0,0,W,H);const big=cdNum===0;ctx.save();ctx.font='900 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;ctx.fillStyle='#a855f7';ctx.fillText('HIT THE TILES!',W/2,SAFE.y+220);ctx.font='13px Arial';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('Tap dark tiles on the line',W/2,SAFE.y+255);ctx.font=`900 ${big?100:160}px Arial`;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=8;ctx.strokeText(big?'PLAY!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.fillStyle=big?'#a855f7':'#fff';ctx.fillText(big?'PLAY!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.restore();drawHands();}

function drawEnd(){ctx.fillStyle='rgba(0,0,10,.85)';ctx.fillRect(0,0,W,H);const cw=SAFE.w-20,ch=400;const cx=SAFE.x+10,cy=SAFE.y+(SAFE.h-ch)/2-20;const ccx=cx+cw/2;ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,cy,cw,ch,24);else ctx.rect(cx,cy,cw,ch);ctx.fillStyle='rgba(15,5,30,.85)';ctx.fill();ctx.strokeStyle='rgba(168,85,247,.3)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();let y=cy+50;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='80px Arial';const e=score>=80?'🎼':score>=40?'🎹':score>=15?'🎵':'🎶';ctx.fillText(e,ccx,y);y+=70;ctx.font='900 26px Arial';ctx.fillStyle='#a855f7';const lbl=score>=80?'VIRTUOSO!':score>=40?'PIANIST!':score>=15?'GOOD EAR!':'KEEP PLAYING!';ctx.fillText(lbl,ccx,y);y+=46;ctx.font='bold 16px Arial';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('PIANO TILES',ccx,y);y+=30;ctx.font='900 32px Arial';ctx.fillStyle='#fff';ctx.fillText(`${score} pts · ${hits} hits`,ccx,y);y+=40;ctx.font='bold 16px Arial';ctx.fillStyle='#fbbf24';ctx.fillText(`Max streak: ${maxStreak}`,ccx,y);y+=30;if(score>=hiScore&&score>0){ctx.font='900 18px Arial';ctx.fillStyle='#fbbf24';ctx.fillText('🏆 NEW RECORD!',ccx,y);y+=22;}else if(hiScore>0){ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText(`Best: ${hiScore}`,ccx,y);}ctx.font='bold 13px Arial';ctx.fillStyle='#a855f7';ctx.fillText('🎬 #GameOSPiano',ccx,cy+ch-44);ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText('▶ Press Start to play again',ccx,cy+ch-22);ctx.restore();}

function loop(ts){dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;ctx.setTransform(SCALE,0,0,SCALE,0,0);if(shakeFrames>0){const a=shakeAmp*(shakeFrames/22);ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);shakeFrames--;}
  if(gameState==='ready'){drawCamera();drawStage();ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='80px Arial';ctx.fillText('🎹',W/2,SAFE.y+220);ctx.font='900 44px Arial';const wm=ctx.createLinearGradient(0,SAFE.y+260,0,SAFE.y+320);wm.addColorStop(0,'#a855f7');wm.addColorStop(1,'#4c1d95');ctx.fillStyle=wm;ctx.fillText('PIANO TILES',W/2,SAFE.y+290);ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('Tap falling tiles to the beat',W/2,SAFE.y+325);if(hiScore>0){ctx.font='bold 16px Arial';ctx.fillStyle='#fbbf24';ctx.fillText(`🏆 Best: ${hiScore}`,W/2,SAFE.y+SAFE.h-100);}ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText('▶ Press Start',W/2,SAFE.y+SAFE.h-50);ctx.restore();drawHands();}
  else if(gameState==='countdown'){drawCamera();drawStage();cdT-=dt;if(cdT<=0){cdNum--;if(cdNum<0){gameState='playing';timerLeft=parseInt(timerMode)||999;timerRunning=true;}else{cdT=1;sfx.count(cdNum===0);}}drawCountdown();}
  else if(gameState==='playing'){update(dt);if(flashAlpha>0){ctx.fillStyle=`rgba(${flashCol},${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha=Math.max(0,flashAlpha-dt*2.5);}draw();}
  else if(gameState==='gameover'){drawCamera();drawStage();for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);drawEnd();}
  requestAnimationFrame(loop);}

let mediaRecorder=null,recChunks=[],savedBlob=null,savedMime='';
function pickMime(){const w=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(const m of w)if(MediaRecorder.isTypeSupported(m))return m;return '';}
function startRecording(){recChunks=[];savedBlob=null;$('dlArea').style.display='none';getAC();const vs=canvas.captureStream(30);let stream=vs;if(audioDest&&audioDest.stream&&audioDest.stream.getAudioTracks().length){stream=new MediaStream([...vs.getVideoTracks(),...audioDest.stream.getAudioTracks()]);}savedMime=pickMime();const opts={videoBitsPerSecond:16_000_000,audioBitsPerSecond:256_000};if(savedMime)opts.mimeType=savedMime;try{mediaRecorder=new MediaRecorder(stream,opts);}catch(e){mediaRecorder=new MediaRecorder(stream);savedMime='video/webm';}mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};mediaRecorder.onstop=()=>{const ext=savedMime.includes('mp4')?'mp4':'webm';savedBlob=new Blob(recChunks,{type:savedMime||'video/webm'});savedBlob.__ext=ext;const mb=(savedBlob.size/1024/1024).toFixed(1);$('dlMeta').textContent=`${mb}MB .${ext}`;$('dlArea').style.display='flex';$('status').textContent='✅ Done!';};mediaRecorder.start(100);isRecording=true;$('recordBtn').textContent='⏹ Stop & Save';$('recordBtn').classList.add('rec');$('status').textContent='● REC';try{const ac=getAC();if(ac){const o=ac.createOscillator(),g=ac.createGain();g.gain.value=0.0001;o.connect(g);g.connect(audioOut());o.frequency.value=20;o.start();mediaRecorder._silent=o;}}catch(_){}ping('record_piano');}
function stopRecording(){if(mediaRecorder){try{if(mediaRecorder._silent)mediaRecorder._silent.stop();}catch(_){}if(mediaRecorder.state!=='inactive')mediaRecorder.stop();}isRecording=false;$('recordBtn').textContent='⏺ Record';$('recordBtn').classList.remove('rec');$('status').textContent='Saving…';}

function reset(){score=0;hits=0;misses=0;streak=0;maxStreak=0;noteIdx=0;tiles=[];particles=[];floatTexts=[];confetti=[];spawnT=.8;flashAlpha=0;shakeFrames=0;timerRunning=false;timerLeft=parseInt(timerMode)||999;}
$('startBtn').addEventListener('click',()=>{getAC();reset();cdNum=3;cdT=1;sfx.count(false);gameState='countdown';$('startBtn').textContent='🔄 Restart';ping('start_piano');});
$('stopBtn').addEventListener('click',()=>{if(gameState==='playing'||gameState==='countdown')endGame();});
$('recordBtn').addEventListener('click',()=>{if(!isRecording)startRecording();else stopRecording();});
$('shareBtn').addEventListener('click',()=>{const url=location.href;if(navigator.share)navigator.share({title:'🎹 Piano Tiles',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>{$('status').textContent='🔗 Copied!';setTimeout(()=>$('status').textContent='',2500);});else prompt('Link:',url);ping('share_piano');});
$('dlBtn').addEventListener('click',()=>{if(!savedBlob)return;const url=URL.createObjectURL(savedBlob);const a=document.createElement('a');a.href=url;a.download=`piano-${Date.now()}.${savedBlob.__ext||'webm'}`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);$('dlMeta').textContent='Downloaded! 🚀';ping('download_piano');});
$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇 Sound':'🔊 Sound';$('muteBtn').classList.toggle('on',!muted);});
document.querySelectorAll('.t-btn').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');timerMode=el.dataset.mode;}));

(async()=>{await startCamera();await listCameras();pumpFrames();})();
[1500,3500,7000].forEach(ms=>setTimeout(listCameras,ms));
requestAnimationFrame(t=>{lastTime=t;loop(t);});
</script>
<script src="gameos-nav.js"></script>
</body>
