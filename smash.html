<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#020617" />
<title>💥 Solar Smash — Destroy Planets</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{background:#020617;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;gap:18px}
#wrap{position:relative;height:95vh;aspect-ratio:9/16;flex-shrink:0;border-radius:24px;overflow:hidden;box-shadow:0 0 90px rgba(56,189,248,.35),0 0 0 2px rgba(255,255,255,.06)}
canvas{width:100%;height:100%;display:block;background:#020617}
#panel{display:flex;flex-direction:column;gap:7px;width:186px;max-height:95vh;overflow-y:auto;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
.badge{padding:11px 8px;border-radius:13px;text-align:center;background:linear-gradient(135deg,#0c4a6e,#38bdf8);box-shadow:0 6px 22px rgba(56,189,248,.4)}
.badge .nm{font-size:15px;font-weight:900;letter-spacing:2px;color:#fff}
.badge .tg{font-size:8.5px;opacity:.95;margin-top:2px;letter-spacing:1px;font-weight:700}
.btn{width:100%;padding:11px 8px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96);opacity:.85}
#startBtn{background:linear-gradient(135deg,#0c4a6e,#38bdf8);color:#fff}
#stopBtn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1)}
#recordBtn{background:linear-gradient(135deg,#ef4444,#f43f5e);color:#fff}
#recordBtn.rec{animation:rec 1.1s ease-in-out infinite}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.7)}50%{box-shadow:0 0 0 9px rgba(244,63,94,0)}}
#shareBtn{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff}
#dlArea{display:none;flex-direction:column;gap:5px}
#dlBtn{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.dl-meta{font-size:9px;color:rgba(255,255,255,.4);text-align:center;line-height:1.4}
.divider{height:1px;background:rgba(255,255,255,.07);margin:1px 0}
.sec{font-size:10px;font-weight:800;color:rgba(255,255,255,.32);letter-spacing:1px;text-transform:uppercase}
select{width:100%;padding:7px;border-radius:9px;background:rgba(255,255,255,.05);color:#fff;font-size:11px;border:1px solid rgba(255,255,255,.1)}
.row3{display:flex;gap:5px}
.t-btn{flex:1;padding:7px 3px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.08);transition:all .12s}
.t-btn.active{background:rgba(56,189,248,.22);color:#7dd3fc;border-color:rgba(56,189,248,.45)}
.toggle-btn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1);font-size:11px}
.toggle-btn.on{background:rgba(85,239,196,.15);color:#55efc4;border-color:rgba(85,239,196,.35)}
#status{font-size:10px;color:rgba(255,255,255,.4);text-align:center;line-height:1.6}
.hint{font-size:10px;color:rgba(255,255,255,.3);line-height:1.85}
@media (max-width:900px),(orientation:portrait) and (max-width:1100px){body{flex-direction:column;min-height:100dvh;min-height:100vh;height:auto;align-items:stretch;justify-content:flex-start;padding:5px;gap:5px;overflow:visible}#wrap{height:calc(100dvh - 130px);height:calc(100vh - 130px);width:auto;max-width:calc(100vw - 10px);aspect-ratio:9/16;margin:0 auto;border-radius:18px;flex-shrink:0}#panel{width:100%;max-width:560px;margin:0 auto;flex-direction:row;flex-wrap:wrap;gap:5px;max-height:none;overflow:visible;align-content:flex-start;padding:0 4px;flex-shrink:0}.badge,#status,.sec,.divider,#camSelect,.hint{display:none !important}#panel .btn{flex:1 1 calc(33% - 5px);padding:10px 5px;font-size:12px;min-width:0}#panel #recordBtn,#panel #shareBtn{flex:1 1 calc(50% - 3px)}#panel #dlArea{flex:1 1 100%;flex-direction:row;gap:4px}#panel #dlBtn{flex:1 1 100%;padding:10px 5px;font-size:12px}#panel .dl-meta{display:none}.row3{flex:1 1 100%;display:flex;gap:4px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="canv"></canvas></div>
<div id="panel">
  <div class="badge"><div class="nm">💥 SOLAR SMASH</div><div class="tg">DESTROY THE PLANETS</div></div>
  <button class="btn" id="startBtn">▶ Start</button>
  <button class="btn" id="stopBtn">⏹ Stop</button>
  <div class="sec">Mode</div>
  <div class="row3"><button class="t-btn" data-mode="endless">∞</button><button class="t-btn active" data-mode="60">60s</button><button class="t-btn" data-mode="30">30s</button></div>
  <button class="btn" id="recordBtn">⏺ Record</button>
  <div id="dlArea"><button class="btn" id="dlBtn">⬇ Download</button><div class="dl-meta" id="dlMeta">—</div></div>
  <button class="btn" id="shareBtn">🔗 Share</button>
  <div class="divider"></div>
  <div class="sec">Camera</div>
  <select id="camSelect"><option>Loading…</option></select>
  <div class="divider"></div>
  <button class="btn toggle-btn on" id="muteBtn">🔊 Sound</button>
  <div id="status">Loading…</div>
  <div class="divider"></div>
  <div class="hint">🚀 Hand fires lasers<br>🌍 Hit planet repeatedly<br>💥 Destroy = points<br>🌌 Bigger = more pts</div>
</div>
<video id="vid" playsinline webkit-playsinline muted autoplay style="display:none"></video>
<audio id="silent" playsinline webkit-playsinline loop preload="auto" src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//FJAhwBkgVw6q9PoIjLZNAvQQyPM1wAA4AGRmHEEswj3w5tOi4NRGvSILIRWFYABg00cZ4FpcFzEkdjEQwYYXQH0ABp0uKkCUDuMa7QrZmWTFjHd" style="display:none"></audio>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script>
const STATS_NS='gameos-kyadav2270';
function ping(k){fetch(`https://abacus.jasoncameron.dev/hit/${STATS_NS}/${k}`).catch(()=>{});}
ping('visit_smash');
const canvas=document.getElementById('canv'),ctx=canvas.getContext('2d'),video=document.getElementById('vid');
const $=id=>document.getElementById(id);
const W=540,H=960,RW=1080,RH=1920,SCALE=RW/W;
canvas.width=RW;canvas.height=RH;
const SAFE={x:25,y:90,w:390,h:630};
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);
let gameState='ready',lastTime=0,dt=0,hands=[],handsCount=0,cameraOK=false,cropParams=null,isFrontCamera=true;
let timerMode='60',timerLeft=60,timerRunning=false,isRecording=false,cdNum=3,cdT=0,endRecordTimer=null;
const END_RECORD_MS=4500;
let shakeFrames=0,shakeAmp=0,flashAlpha=0,flashCol='255,255,255';
let score=0,level=1,combo=0,comboT=0,levelScore=0,destroyed=0;
let planets=[],lasers=[],debris=[],particles=[],floatTexts=[],confetti=[],stars=[],asteroids=[];
let spawnT=1.5,fireT=0;
let hiScore=parseInt(localStorage.getItem('smash_hi')||'0');

let muted=false,audioCtx=null,masterGain=null,audioDest=null,silentUnlocked=false;
function unlockSilent(){if(silentUnlocked)return;const el=$('silent');if(!el)return;el.volume=0.001;const p=el.play();if(p&&p.then)p.then(()=>silentUnlocked=true).catch(()=>{});else silentUnlocked=true;}
function getAC(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();if(audioCtx&&!masterGain){masterGain=audioCtx.createGain();masterGain.gain.value=1;masterGain.connect(audioCtx.destination);audioDest=audioCtx.createMediaStreamDestination();masterGain.connect(audioDest);try{const buf=audioCtx.createBuffer(1,1,22050);const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start(0);}catch(_){}}unlockSilent();return audioCtx;}
function audioOut(){getAC();return masterGain||(audioCtx&&audioCtx.destination);}
function tone(f,d,t='sine',v=.25,dl=0){if(muted)return;try{const ac=getAC();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(audioOut());o.type=t;o.frequency.setValueAtTime(f,ac.currentTime+dl);g.gain.setValueAtTime(v,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d+.01);}catch(_){}}
function noise(dur,vol=.3,freq=2000){if(muted)return;try{const ac=getAC();if(!ac)return;const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=ac.createBufferSource();src.buffer=buf;const g=ac.createGain();g.gain.value=vol;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;src.connect(f);f.connect(g);g.connect(audioOut());src.start();}catch(_){}}
const sfx={
  laser(){tone(2200,.06,'sawtooth',.18);tone(1100,.08,'square',.12,.02);},
  hit(){noise(.04,.2,3000);tone(600,.04,'square',.18);},
  destroy(){noise(.6,.4,300);tone(80,.5,'sawtooth',.4);tone(50,.6,'sine',.3,.1);},
  count(last){tone(last?880:440,.15,'triangle',.3);},
  levelup(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.22,i*.08));},
  cheer(){noise(.7,.25,3000);},
};

let mpHands=null,sendingHands=false;
try{mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});mpHands.setOptions({maxNumHands:2,modelComplexity:IS_MOBILE?0:1,minDetectionConfidence:IS_MOBILE?.3:.5,minTrackingConfidence:IS_MOBILE?.3:.4});mpHands.onResults(r=>{hands=[];handsCount=0;if(!r.multiHandLandmarks)return;handsCount=r.multiHandLandmarks.length;for(const lms of r.multiHandLandmarks){const lm=lms[8];/* index fingertip */let cx,cy;if(cropParams){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vx=lm.x*vw,vy=lm.y*vh;const nx=(vx-cropParams.sx)/cropParams.sw;cx=(isFrontCamera?(1-nx):nx)*W;cy=(vy-cropParams.sy)/cropParams.sh*H;}else{cx=(isFrontCamera?(1-lm.x):lm.x)*W;cy=lm.y*H;}hands.push([{x:cx,y:cy}]);}});}catch(e){console.warn(e);}
async function pumpFrames(){if(mpHands&&video.readyState>=2&&!sendingHands){sendingHands=true;try{await mpHands.send({image:video});}catch(_){}sendingHands=false;}requestAnimationFrame(pumpFrames);}

let currentCamId=null;
async function startCamera(deviceId,facingPref){try{if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());const Wi=IS_MOBILE?2160:3840,Hi=IS_MOBILE?3840:2160;const c={video:deviceId?{deviceId:{exact:deviceId},width:{ideal:Wi},height:{ideal:Hi}}:{facingMode:facingPref||'user',width:{ideal:Wi},height:{ideal:Hi}},audio:false};const s=await navigator.mediaDevices.getUserMedia(c);video.srcObject=s;await video.play();const st=s.getVideoTracks()[0].getSettings();currentCamId=deviceId||st.deviceId;isFrontCamera=st.facingMode?(st.facingMode==='user'):true;cameraOK=true;$('status').textContent=`✅ ${st.width||'?'}×${st.height||'?'}`;return true;}catch(e){$('status').textContent='⚠️ '+e.message;return false;}}
async function listCameras(){try{const devs=await navigator.mediaDevices.enumerateDevices();const cams=devs.filter(d=>d.kind==='videoinput');$('camSelect').innerHTML='';cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.deviceId;let lbl=c.label||`Camera ${i+1}`;if(/iphone/i.test(lbl))lbl='📱 '+lbl;else if(/facetime|builtin/i.test(lbl))lbl='💻 '+lbl;o.textContent=lbl;if(c.deviceId===currentCamId)o.selected=true;$('camSelect').appendChild(o);});if(cams.length===0)$('camSelect').innerHTML='<option>No cameras</option>';}catch(_){}}
$('camSelect').addEventListener('change',()=>startCamera($('camSelect').value));
if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',listCameras);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)listCameras();});

function drawCamera(){ctx.save();if(isFrontCamera){ctx.translate(W,0);ctx.scale(-1,1);}if(video.readyState>=2){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vAR=vw/vh,cAR=W/H;let sx,sy,sw,sh;if(vAR>cAR){sh=vh;sw=vh*cAR;sx=(vw-sw)/2;sy=0;}else{sw=vw;sh=vw/cAR;sx=0;sy=(vh-sh)/2;}cropParams={sx,sy,sw,sh};ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);}else{ctx.fillStyle='#020617';ctx.fillRect(0,0,W,H);cropParams=null;}ctx.restore();}

/* SPACE BACKGROUND */
function initStars(){stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*2,a:.3+Math.random()*.7,tw:Math.random()*Math.PI*2,vy:.05+Math.random()*.3});}
initStars();
function drawSpace(){
  /* deep space gradient */
  const sp=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,Math.max(W,H));
  sp.addColorStop(0,'rgba(20,15,50,.85)');
  sp.addColorStop(.6,'rgba(5,5,20,.92)');
  sp.addColorStop(1,'rgba(0,0,5,.98)');
  ctx.fillStyle=sp;ctx.fillRect(0,0,W,H);
  /* nebula clouds */
  for(let i=0;i<3;i++){
    const nx=(i*W/3+Date.now()/8000*15)%W;
    const ny=H*.2+i*100;
    const g=ctx.createRadialGradient(nx,ny,5,nx,ny,150);
    const col=i===0?'168,85,247':i===1?'59,130,246':'236,72,153';
    g.addColorStop(0,`rgba(${col},.18)`);
    g.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=g;ctx.fillRect(nx-150,ny-150,300,300);
  }
  /* stars */
  for(const s of stars){
    s.y+=s.vy;if(s.y>H)s.y=0;
    s.tw+=.05;
    const a=s.a*(.6+.4*Math.sin(s.tw));
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
    if(s.r>1.4){
      ctx.beginPath();ctx.arc(s.x,s.y,s.r*2.5,0,Math.PI*2);
      const sg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2.5);
      sg.addColorStop(0,`rgba(180,220,255,${a*.5})`);
      sg.addColorStop(1,'rgba(180,220,255,0)');
      ctx.fillStyle=sg;ctx.fill();
    }
  }
}

/* PLANET TYPES */
const PLANET_TYPES=[
  {name:'EARTH',  pal:['#3b82f6','#1e40af'], acc:'#22c55e', pts:5,  hp:5,  size:90},
  {name:'MARS',   pal:['#dc2626','#7c2d12'], acc:'#f97316', pts:7,  hp:6,  size:75},
  {name:'NEPTUNE',pal:['#3b82f6','#1e3a8a'], acc:'#60a5fa', pts:8,  hp:7,  size:85},
  {name:'VENUS',  pal:['#fbbf24','#92400e'], acc:'#f59e0b', pts:6,  hp:5,  size:80},
  {name:'JUPITER',pal:['#f59e0b','#7c2d12'], acc:'#fbbf24', pts:12, hp:10, size:110},
  {name:'SUN',    pal:['#fbbf24','#dc2626'], acc:'#ffffff', pts:20, hp:14, size:120},
  {name:'ICE',    pal:['#bae6fd','#0c4a6e'], acc:'#7dd3fc', pts:9,  hp:8,  size:90},
];
function spawnPlanet(){
  const t=PLANET_TYPES[0|Math.random()*PLANET_TYPES.length];
  const r=t.size/2;
  planets.push({
    x: r+30+Math.random()*(W-r*2-60),
    y: SAFE.y+r+40+Math.random()*(SAFE.h-r*2-100),
    r, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
    rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*.005,
    spec:t, hp:t.hp+Math.floor(level*.6), hpMax:t.hp+Math.floor(level*.6),
    cracks:[], destroyed:false, destT:0, alive:true,
  });
}
function endGame(){if(gameState==='gameover')return;gameState='gameover';if(score>hiScore){hiScore=score;localStorage.setItem('smash_hi',hiScore);}sfx.cheer();ping('complete_smash');burstC(W*.3,SAFE.y+220,90);burstC(W*.7,SAFE.y+220,90);if(isRecording){if(endRecordTimer)clearTimeout(endRecordTimer);endRecordTimer=setTimeout(()=>{if(isRecording&&gameState==='gameover')stopRecording();},END_RECORD_MS);}}

class P{constructor(x,y,c,big){this.x=x;this.y=y;this.vx=(Math.random()-.5)*(big?14:9);this.vy=(Math.random()-.5)*(big?14:9)-3;this.r=(big?5:3)+Math.random()*5;this.c=c;this.life=1;this.dec=.018;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.25;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.shadowColor=this.c;ctx.shadowBlur=8;ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
class Cf{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-.5)*10;this.vy=-6-Math.random()*6;this.w=6+Math.random()*6;this.h=4+Math.random()*4;this.rot=Math.random()*Math.PI;this.rotV=(Math.random()-.5)*.15;const PA=['#38bdf8','#a855f7','#ec4899','#fff','#fbbf24'];this.c=PA[0|Math.random()*PA.length];this.life=1;this.dec=.012;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.rot+=this.rotV;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.c;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();}}
class FT{constructor(x,y,t,c,big){this.x=x;this.y=y;this.t=t;this.c=c;this.life=1;this.vy=big?-3:-1.8;this.sz=big?40:24;}update(){this.y+=this.vy;this.life-=.022;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.font=`900 ${this.sz}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=4;ctx.strokeText(this.t,this.x,this.y);ctx.fillStyle=this.c;ctx.fillText(this.t,this.x,this.y);ctx.restore();}}
function burstP(x,y,c,n=15,big){for(let i=0;i<n;i++)particles.push(new P(x,y,i%2?c:'#fff',big));}
function burstC(x,y,n=70){for(let i=0;i<n;i++)confetti.push(new Cf(x,y));}
function floatT(x,y,t,c,big){floatTexts.push(new FT(x,y,t,c,big));}

function update(d){
  if(timerMode!=='endless'&&timerRunning){timerLeft=Math.max(0,timerLeft-d);if(timerLeft<=0){timerRunning=false;endGame();}}
  if(comboT>0)comboT-=d;else combo=0;
  spawnT-=d;
  if(spawnT<=0){spawnT=2+Math.random();if(planets.filter(p=>!p.destroyed).length<2)spawnPlanet();}

  /* fire lasers from each hand fingertip at fixed rate */
  fireT-=d;
  if(fireT<=0 && hands.length){
    fireT=.12; /* fire rate */
    for(const h of hands){
      const tip=h[0];
      /* fire from top edge corners toward fingertip */
      const origins=[{x:W*.1,y:0},{x:W*.9,y:0}];
      const o=origins[(lasers.length)%2];
      lasers.push({x1:o.x,y1:o.y,x2:tip.x,y2:tip.y,life:1,target:{x:tip.x,y:tip.y}});
      sfx.laser();
      /* damage check */
      for(const p of planets){
        if(p.destroyed)continue;
        if(Math.hypot(tip.x-p.x, tip.y-p.y) < p.r){
          p.hp--;
          /* add crack at hit point */
          const hitA = Math.atan2(tip.y-p.y, tip.x-p.x);
          p.cracks.push({angle:hitA, len:p.r*.4, life:2});
          burstP(tip.x,tip.y,p.spec.acc,8);
          sfx.hit();
          if(p.hp<=0){
            /* DESTROY! */
            p.destroyed=true; p.destT=0;
            destroyed++;
            combo++;comboT=2.5;
            const mult=combo>=2?combo:1;
            const pts=p.spec.pts*mult;
            score+=pts;levelScore+=pts;
            floatT(p.x,p.y, `💥 ${p.spec.name} +${pts}`, p.spec.acc, true);
            burstP(p.x,p.y,p.spec.acc,80,true);
            burstP(p.x,p.y,p.spec.pal[0],50,true);
            /* spawn debris pieces */
            for(let i=0;i<14;i++){
              const a=Math.random()*Math.PI*2;
              debris.push({x:p.x,y:p.y,vx:Math.cos(a)*(2+Math.random()*5),vy:Math.sin(a)*(2+Math.random()*5),r:3+Math.random()*8,col:p.spec.pal[0|Math.random()*2],rot:0,rotV:(Math.random()-.5)*.3,life:1.5});
            }
            sfx.destroy();
            shakeFrames=22;shakeAmp=14;flashAlpha=.7;flashCol='255,200,80';
            if(levelScore>=10+level*8){level++;levelScore=0;burstC(W*.3,SAFE.y+200,80);burstC(W*.7,SAFE.y+200,80);floatT(W/2,SAFE.y+200,`🚀 LEVEL ${level}`,'#fbbf24',true);sfx.levelup();}
          }
        }
      }
    }
  }
  /* update lasers */
  for(const l of lasers){l.life-=d*4;}
  lasers=lasers.filter(l=>l.life>0);
  /* update planets */
  for(const p of planets){
    if(p.destroyed){p.destT+=d*1.5;if(p.destT>1)p.alive=false;continue;}
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;
    if(p.x<p.r||p.x>W-p.r)p.vx*=-1;
    if(p.y<SAFE.y+p.r||p.y>SAFE.y+SAFE.h-p.r)p.vy*=-1;
    for(const c of p.cracks)c.life-=d;
    p.cracks=p.cracks.filter(c=>c.life>0);
  }
  planets=planets.filter(p=>p.alive);
  /* debris */
  for(const dd of debris){dd.x+=dd.vx;dd.y+=dd.vy;dd.vy+=.1;dd.rot+=dd.rotV;dd.life-=d;}
  debris=debris.filter(d=>d.life>0);
}

function drawPlanet(p){
  if(p.destroyed){
    /* fade + scale up */
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-p.destT);
    const s=1+p.destT*.5;
    ctx.translate(p.x,p.y);ctx.scale(s,s);
    /* explosion blast */
    const exp=ctx.createRadialGradient(0,0,p.r*.2,0,0,p.r*1.5);
    exp.addColorStop(0,'rgba(255,255,200,.95)');
    exp.addColorStop(.5,'rgba(255,150,50,.7)');
    exp.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=exp;
    ctx.beginPath();ctx.arc(0,0,p.r*1.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    return;
  }
  ctx.save();
  /* outer atmosphere glow */
  const atm=ctx.createRadialGradient(p.x,p.y,p.r*.95,p.x,p.y,p.r*1.4);
  atm.addColorStop(0,p.spec.acc+'66');
  atm.addColorStop(1,p.spec.acc+'00');
  ctx.fillStyle=atm;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.4,0,Math.PI*2);ctx.fill();
  /* main planet body */
  const grad=ctx.createRadialGradient(p.x-p.r*.4,p.y-p.r*.4, p.r*.1, p.x,p.y, p.r);
  grad.addColorStop(0, p.spec.pal[0]);
  grad.addColorStop(.7, p.spec.pal[1]);
  grad.addColorStop(1, '#000');
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
  /* surface details — continents using rotation */
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.rot);
  ctx.beginPath();
  ctx.ellipse(-p.r*.3, -p.r*.2, p.r*.35, p.r*.18, .3, 0, Math.PI*2);
  ctx.fillStyle=p.spec.acc+'88';ctx.fill();
  ctx.beginPath();
  ctx.ellipse(p.r*.25, p.r*.15, p.r*.2, p.r*.12, -.2, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(p.r*.1, -p.r*.4, p.r*.15, p.r*.1, .5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  /* cracks from damage */
  for(const c of p.cracks){
    ctx.save();
    ctx.translate(p.x,p.y);ctx.rotate(c.angle);
    ctx.strokeStyle=`rgba(255,80,0,${c.life/2})`;
    ctx.lineWidth=2.5;
    ctx.shadowColor='#ff5500';ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(p.r*.3,0);
    /* jagged crack line */
    let cx=p.r*.3,cy=0;
    for(let s=0;s<4;s++){
      cx -= c.len/4 + Math.random()*2;
      cy += (Math.random()-.5)*8;
      ctx.lineTo(cx,cy);
    }
    ctx.stroke();
    ctx.restore();
  }
  /* HP bar above planet */
  const bw=p.r*1.6, bh=4, bx=p.x-bw/2, by=p.y-p.r-14;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=p.hp/p.hpMax>.5?'#22c55e':p.hp/p.hpMax>.25?'#f59e0b':'#ef4444';
  ctx.fillRect(bx,by,bw*(p.hp/p.hpMax),bh);
  /* name label */
  ctx.font='bold 10px Arial';ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.textAlign='center';
  ctx.fillText(p.spec.name, p.x, by-3);
  ctx.restore();
}
function drawLaser(l){
  const a=l.life;
  ctx.save();
  /* outer glow line */
  ctx.strokeStyle=`rgba(56,189,248,${a*.6})`;
  ctx.lineWidth=6;
  ctx.shadowColor='#38bdf8';ctx.shadowBlur=16;
  ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
  /* inner bright core */
  ctx.strokeStyle=`rgba(255,255,255,${a})`;
  ctx.lineWidth=2;ctx.shadowBlur=0;
  ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();
  /* impact flash */
  ctx.beginPath();ctx.arc(l.x2,l.y2,8*a,0,Math.PI*2);
  const fg=ctx.createRadialGradient(l.x2,l.y2,0,l.x2,l.y2,12);
  fg.addColorStop(0,`rgba(255,255,255,${a})`);
  fg.addColorStop(1,'rgba(56,189,248,0)');
  ctx.fillStyle=fg;ctx.fill();
  ctx.restore();
}
function drawDebris(d){
  ctx.save();ctx.globalAlpha=Math.max(0,d.life);
  ctx.translate(d.x,d.y);ctx.rotate(d.rot);
  ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHandTarget(){for(const h of hands){const tip=h[0];ctx.save();/* targeting reticle */ctx.strokeStyle='#38bdf8';ctx.lineWidth=2;ctx.shadowColor='#38bdf8';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(tip.x,tip.y,18,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(tip.x,tip.y,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();/* crosshair lines */ctx.beginPath();ctx.moveTo(tip.x-25,tip.y);ctx.lineTo(tip.x-10,tip.y);ctx.moveTo(tip.x+10,tip.y);ctx.lineTo(tip.x+25,tip.y);ctx.moveTo(tip.x,tip.y-25);ctx.lineTo(tip.x,tip.y-10);ctx.moveTo(tip.x,tip.y+10);ctx.lineTo(tip.x,tip.y+25);ctx.stroke();ctx.restore();}}

function draw(){
  drawCamera();drawSpace();
  for(const p of planets) drawPlanet(p);
  for(const l of lasers) drawLaser(l);
  for(const d of debris) drawDebris(d);
  for(const pp of particles){pp.update();pp.draw();}particles=particles.filter(p=>p.life>0);
  for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);
  for(const t of floatTexts){t.update();t.draw();}floatTexts=floatTexts.filter(t=>t.life>0);
  drawHandTarget();
  drawHUD();
}

function drawHUD(){
  const hudY=SAFE.y+12;
  ctx.save();ctx.font='900 42px -apple-system,Arial';ctx.textAlign='left';ctx.textBaseline='top';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.fillText(String(score),SAFE.x+5,hudY);ctx.font='bold 11px Arial';ctx.fillStyle='#38bdf8';ctx.fillText(`DESTROYED ${destroyed} · LV ${level}`,SAFE.x+5,hudY+48);ctx.restore();
  ctx.save();ctx.textAlign='right';ctx.textBaseline='top';if(timerMode!=='endless'){const col=timerLeft<=10?'#ef4444':timerLeft<=20?'#f59e0b':'#22c55e';ctx.font='900 36px Arial';ctx.fillStyle=col;ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillText(`${Math.ceil(timerLeft)}s`,SAFE.x+SAFE.w-5,hudY);}ctx.restore();
  ctx.save();ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='rgba(255,255,255,.45)';ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=4;ctx.fillText('💥 SOLAR SMASH',W/2,hudY+5);ctx.restore();
  if(combo>=2&&comboT>0){const a=Math.min(1,comboT/2.5);const pulse=1+0.06*Math.sin(Date.now()/80);ctx.save();ctx.font=`900 ${(22+Math.min(combo,6)*1.4)*pulse}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=6;ctx.fillStyle=`rgba(56,189,248,${a})`;ctx.fillText(`×${combo}`,W/2,hudY+90);ctx.restore();}
  ctx.save();ctx.font='bold 11px Arial';ctx.textBaseline='bottom';ctx.textAlign='left';ctx.fillStyle=handsCount>0?'#55efc4':'#ff8888';ctx.fillText(handsCount>0?`🎯 ${handsCount} LOCKED`:'🎯 SHOW HAND',SAFE.x+5,SAFE.y+SAFE.h-8);if(hiScore>0){ctx.textAlign='right';ctx.fillStyle='rgba(249,202,36,.7)';ctx.fillText(`🏆 ${hiScore}`,SAFE.x+SAFE.w-5,SAFE.y+SAFE.h-8);}ctx.restore();
  if(isRecording){ctx.save();ctx.beginPath();ctx.arc(SAFE.x+SAFE.w-15,hudY+10,6,0,Math.PI*2);ctx.fillStyle=`rgba(244,63,94,${.7+.3*Math.sin(Date.now()/250)})`;ctx.shadowColor='#f43f5e';ctx.shadowBlur=12;ctx.fill();ctx.restore();}
}

function drawCountdown(){ctx.fillStyle='rgba(0,0,10,.55)';ctx.fillRect(0,0,W,H);const big=cdNum===0;ctx.save();ctx.font='900 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;ctx.fillStyle='#38bdf8';ctx.fillText('DESTROY THE PLANETS!',W/2,SAFE.y+220);ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('Point fingers — auto-fire lasers',W/2,SAFE.y+260);ctx.font=`900 ${big?100:160}px Arial`;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=8;ctx.strokeText(big?'GO!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.fillStyle=big?'#38bdf8':'#fff';ctx.fillText(big?'GO!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.restore();drawHandTarget();}

function drawEnd(){ctx.fillStyle='rgba(0,0,10,.85)';ctx.fillRect(0,0,W,H);const cw=SAFE.w-20,ch=400;const cx=SAFE.x+10,cy=SAFE.y+(SAFE.h-ch)/2-20;const ccx=cx+cw/2;ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,cy,cw,ch,24);else ctx.rect(cx,cy,cw,ch);ctx.fillStyle='rgba(5,8,30,.85)';ctx.fill();ctx.strokeStyle='rgba(56,189,248,.3)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();let y=cy+50;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='80px Arial';const e=score>=200?'🌌':score>=80?'☄️':score>=30?'🚀':'🛰️';ctx.fillText(e,ccx,y);y+=70;ctx.font='900 26px Arial';ctx.fillStyle='#38bdf8';const lbl=score>=200?'GALAXY DESTROYER!':score>=80?'PLANET KILLER!':score>=30?'GOOD AIM!':'KEEP SHOOTING!';ctx.fillText(lbl,ccx,y);y+=46;ctx.font='bold 16px Arial';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('SOLAR SMASH',ccx,y);y+=30;ctx.font='900 32px Arial';ctx.fillStyle='#fff';ctx.fillText(`${score} pts · ${destroyed} planets`,ccx,y);y+=42;if(score>=hiScore&&score>0){ctx.font='900 18px Arial';ctx.fillStyle='#fbbf24';ctx.fillText('🏆 NEW RECORD!',ccx,y);y+=22;}else if(hiScore>0){ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText(`Best: ${hiScore}`,ccx,y);}ctx.font='bold 13px Arial';ctx.fillStyle='#38bdf8';ctx.fillText('🎬 #GameOSSmash',ccx,cy+ch-44);ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText('▶ Press Start to play again',ccx,cy+ch-22);ctx.restore();}

function loop(ts){dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;ctx.setTransform(SCALE,0,0,SCALE,0,0);if(shakeFrames>0){const a=shakeAmp*(shakeFrames/22);ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);shakeFrames--;}
  if(gameState==='ready'){drawCamera();drawSpace();ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='80px Arial';ctx.fillText('💥',W/2,SAFE.y+220);ctx.font='900 48px Arial';const wm=ctx.createLinearGradient(0,SAFE.y+260,0,SAFE.y+320);wm.addColorStop(0,'#38bdf8');wm.addColorStop(1,'#7c3aed');ctx.fillStyle=wm;ctx.fillText('SOLAR SMASH',W/2,SAFE.y+290);ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('Lasers auto-fire at your finger',W/2,SAFE.y+325);if(hiScore>0){ctx.font='bold 16px Arial';ctx.fillStyle='#fbbf24';ctx.fillText(`🏆 Best: ${hiScore}`,W/2,SAFE.y+SAFE.h-100);}ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText('▶ Press Start',W/2,SAFE.y+SAFE.h-50);ctx.restore();}
  else if(gameState==='countdown'){drawCamera();drawSpace();cdT-=dt;if(cdT<=0){cdNum--;if(cdNum<0){gameState='playing';timerLeft=parseInt(timerMode)||999;timerRunning=true;}else{cdT=1;sfx.count(cdNum===0);}}drawCountdown();}
  else if(gameState==='playing'){update(dt);if(flashAlpha>0){ctx.fillStyle=`rgba(${flashCol},${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha=Math.max(0,flashAlpha-dt*2.5);}draw();}
  else if(gameState==='gameover'){drawCamera();drawSpace();for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);drawEnd();}
  requestAnimationFrame(loop);}

let mediaRecorder=null,recChunks=[],savedBlob=null,savedMime='';
function pickMime(){const w=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(const m of w)if(MediaRecorder.isTypeSupported(m))return m;return '';}
function startRecording(){recChunks=[];savedBlob=null;$('dlArea').style.display='none';getAC();const vs=canvas.captureStream(30);let stream=vs;if(audioDest&&audioDest.stream&&audioDest.stream.getAudioTracks().length){stream=new MediaStream([...vs.getVideoTracks(),...audioDest.stream.getAudioTracks()]);}savedMime=pickMime();const opts={videoBitsPerSecond:16_000_000,audioBitsPerSecond:256_000};if(savedMime)opts.mimeType=savedMime;try{mediaRecorder=new MediaRecorder(stream,opts);}catch(e){mediaRecorder=new MediaRecorder(stream);savedMime='video/webm';}mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};mediaRecorder.onstop=()=>{const ext=savedMime.includes('mp4')?'mp4':'webm';savedBlob=new Blob(recChunks,{type:savedMime||'video/webm'});savedBlob.__ext=ext;const mb=(savedBlob.size/1024/1024).toFixed(1);$('dlMeta').textContent=`${mb}MB .${ext}`;$('dlArea').style.display='flex';$('status').textContent='✅ Done!';};mediaRecorder.start(100);isRecording=true;$('recordBtn').textContent='⏹ Stop & Save';$('recordBtn').classList.add('rec');$('status').textContent='● REC';try{const ac=getAC();if(ac){const o=ac.createOscillator(),g=ac.createGain();g.gain.value=0.0001;o.connect(g);g.connect(audioOut());o.frequency.value=20;o.start();mediaRecorder._silent=o;}}catch(_){}ping('record_smash');}
function stopRecording(){if(mediaRecorder){try{if(mediaRecorder._silent)mediaRecorder._silent.stop();}catch(_){}if(mediaRecorder.state!=='inactive')mediaRecorder.stop();}isRecording=false;$('recordBtn').textContent='⏺ Record';$('recordBtn').classList.remove('rec');$('status').textContent='Saving…';}

function reset(){score=0;level=1;combo=0;comboT=0;levelScore=0;destroyed=0;planets=[];lasers=[];debris=[];particles=[];floatTexts=[];confetti=[];spawnT=1;fireT=0;flashAlpha=0;shakeFrames=0;timerRunning=false;timerLeft=parseInt(timerMode)||999;}
$('startBtn').addEventListener('click',()=>{getAC();reset();cdNum=3;cdT=1;sfx.count(false);gameState='countdown';$('startBtn').textContent='🔄 Restart';ping('start_smash');});
$('stopBtn').addEventListener('click',()=>{if(gameState==='playing'||gameState==='countdown')endGame();});
$('recordBtn').addEventListener('click',()=>{if(!isRecording)startRecording();else stopRecording();});
$('shareBtn').addEventListener('click',()=>{const url=location.href;if(navigator.share)navigator.share({title:'💥 Solar Smash',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>{$('status').textContent='🔗 Link copied!';setTimeout(()=>$('status').textContent='',2500);});else prompt('Link:',url);ping('share_smash');});
$('dlBtn').addEventListener('click',()=>{if(!savedBlob)return;const url=URL.createObjectURL(savedBlob);const a=document.createElement('a');a.href=url;a.download=`smash-${Date.now()}.${savedBlob.__ext||'webm'}`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);$('dlMeta').textContent='Downloaded! 🚀';ping('download_smash');});
$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇 Sound':'🔊 Sound';$('muteBtn').classList.toggle('on',!muted);});
document.querySelectorAll('.t-btn').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');timerMode=el.dataset.mode;}));

(async()=>{await startCamera();await listCameras();pumpFrames();})();
[1500,3500,7000].forEach(ms=>setTimeout(listCameras,ms));
requestAnimationFrame(t=>{lastTime=t;loop(t);});
</script>
