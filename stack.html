<audio id="silent" playsinline webkit-playsinline loop preload="auto" src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//FJAhwBkgVw6q9PoIjLZNAvQQyPM1wAA4AGRmHEEswj3w5tOi4NRGvSILIRWFYABg00cZ4FpcFzEkdjEQwYYXQH0ABp0uKkCUDuMa7QrZmWTFjHd" style="display:none"></audio>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script>
const STATS_NS='gameos-kyadav2270';
function ping(k){fetch(`https://abacus.jasoncameron.dev/hit/${STATS_NS}/${k}`).catch(()=>{});}
ping('visit_stack');
const canvas=document.getElementById('canv'),ctx=canvas.getContext('2d'),video=document.getElementById('vid');
const $=id=>document.getElementById(id);
const W=540,H=960,RW=1080,RH=1920,SCALE=RW/W;canvas.width=RW;canvas.height=RH;
const SAFE={x:25,y:90,w:390,h:630};
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);
let gameState='ready',lastTime=0,dt=0,hands=[],handsCount=0,cameraOK=false,cropParams=null,isFrontCamera=true;
let timerMode='60',timerLeft=60,timerRunning=false,isRecording=false,cdNum=3,cdT=0,endRecordTimer=null;
const END_RECORD_MS=4500;let shakeFrames=0,shakeAmp=0,flashAlpha=0,flashCol='255,255,255';

let muted=false,audioCtx=null,masterGain=null,audioDest=null,silentUnlocked=false;
function unlockSilent(){if(silentUnlocked)return;const el=$('silent');if(!el)return;el.volume=0.001;const p=el.play();if(p&&p.then)p.then(()=>silentUnlocked=true).catch(()=>{});else silentUnlocked=true;}
function getAC(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();if(audioCtx&&!masterGain){masterGain=audioCtx.createGain();masterGain.gain.value=1;masterGain.connect(audioCtx.destination);audioDest=audioCtx.createMediaStreamDestination();masterGain.connect(audioDest);try{const buf=audioCtx.createBuffer(1,1,22050);const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start(0);}catch(_){}}unlockSilent();return audioCtx;}
function audioOut(){getAC();return masterGain||(audioCtx&&audioCtx.destination);}
function tone(f,d,t='sine',v=.25,dl=0){if(muted)return;try{const ac=getAC();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(audioOut());o.type=t;o.frequency.setValueAtTime(f,ac.currentTime+dl);g.gain.setValueAtTime(v,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d+.01);}catch(_){}}
const sfx={
  clack(){tone(140,.05,'square',.3);tone(80,.08,'sine',.2,.01);},
  perfect(){tone(880,.06,'sine',.25);tone(1320,.1,'sine',.2,.04);tone(1760,.12,'sine',.15,.08);},
  gameover(){tone(110,.4,'sawtooth',.4);},
  count(last){tone(last?880:440,.15,'triangle',.3);},
  cheer(){tone(440,.3,'sine',.2);},
};

let mpHands=null,sendingHands=false;
try{mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});mpHands.setOptions({maxNumHands:1,modelComplexity:IS_MOBILE?0:1,minDetectionConfidence:IS_MOBILE?.3:.5,minTrackingConfidence:IS_MOBILE?.3:.4});mpHands.onResults(r=>{hands=[];handsCount=0;if(!r.multiHandLandmarks)return;handsCount=r.multiHandLandmarks.length;for(const lms of r.multiHandLandmarks){const lm=lms[9];let cx,cy;if(cropParams){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vx=lm.x*vw,vy=lm.y*vh;const nx=(vx-cropParams.sx)/cropParams.sw;cx=(isFrontCamera?(1-nx):nx)*W;cy=(vy-cropParams.sy)/cropParams.sh*H;}else{cx=(isFrontCamera?(1-lm.x):lm.x)*W;cy=lm.y*H;}hands.push([{x:cx,y:cy}]);}});}catch(e){console.warn(e);}
function palm(){return hands.length?hands[0][0]:null;}
async function pumpFrames(){if(mpHands&&video.readyState>=2&&!sendingHands){sendingHands=true;try{await mpHands.send({image:video});}catch(_){}sendingHands=false;}requestAnimationFrame(pumpFrames);}

let currentCamId=null;
async function startCamera(deviceId,facingPref){try{if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());const Wi=IS_MOBILE?2160:3840,Hi=IS_MOBILE?3840:2160;const c={video:deviceId?{deviceId:{exact:deviceId},width:{ideal:Wi},height:{ideal:Hi}}:{facingMode:facingPref||'user',width:{ideal:Wi},height:{ideal:Hi}},audio:false};const s=await navigator.mediaDevices.getUserMedia(c);video.srcObject=s;await video.play();const st=s.getVideoTracks()[0].getSettings();currentCamId=deviceId||st.deviceId;isFrontCamera=st.facingMode?(st.facingMode==='user'):true;cameraOK=true;$('status').textContent=`✅ ${st.width||'?'}×${st.height||'?'}`;return true;}catch(e){$('status').textContent='⚠️ '+e.message;return false;}}
async function listCameras(){try{const devs=await navigator.mediaDevices.enumerateDevices();const cams=devs.filter(d=>d.kind==='videoinput');$('camSelect').innerHTML='';cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.deviceId;let lbl=c.label||`Camera ${i+1}`;if(/iphone/i.test(lbl))lbl='📱 '+lbl;else if(/facetime|builtin/i.test(lbl))lbl='💻 '+lbl;o.textContent=lbl;if(c.deviceId===currentCamId)o.selected=true;$('camSelect').appendChild(o);});if(cams.length===0)$('camSelect').innerHTML='<option>No cameras</option>';}catch(_){}}
$('camSelect').addEventListener('change',()=>startCamera($('camSelect').value));
if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',listCameras);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)listCameras();});
function drawCamera(){ctx.save();if(isFrontCamera){ctx.translate(W,0);ctx.scale(-1,1);}if(video.readyState>=2){const vw=video.videoWidth||640,vh=video.videoHeight||480;const vAR=vw/vh,cAR=W/H;let sx,sy,sw,sh;if(vAR>cAR){sh=vh;sw=vh*cAR;sx=(vw-sw)/2;sy=0;}else{sw=vw;sh=vw/cAR;sx=0;sy=(vh-sh)/2;}cropParams={sx,sy,sw,sh};ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);}else{ctx.fillStyle='#0c1f33';ctx.fillRect(0,0,W,H);cropParams=null;}ctx.restore();}

class P{constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-.5)*9;this.vy=(Math.random()-.5)*9-3;this.r=3+Math.random()*5;this.c=c;this.life=1;this.dec=.018;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.25;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
class Cf{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-.5)*10;this.vy=-6-Math.random()*6;this.w=6+Math.random()*6;this.h=4+Math.random()*4;this.rot=Math.random()*Math.PI;this.rotV=(Math.random()-.5)*.15;const PA=['#0ea5e9','#fbbf24','#fff','#22c55e','#a855f7'];this.c=PA[0|Math.random()*PA.length];this.life=1;this.dec=.012;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.rot+=this.rotV;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.c;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();}}
class FT{constructor(x,y,t,c,big){this.x=x;this.y=y;this.t=t;this.c=c;this.life=1;this.vy=big?-3:-1.8;this.sz=big?40:22;}update(){this.y+=this.vy;this.life-=.022;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.font=`900 ${this.sz}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=4;ctx.strokeText(this.t,this.x,this.y);ctx.fillStyle=this.c;ctx.fillText(this.t,this.x,this.y);ctx.restore();}}
let particles=[],floatTexts=[],confetti=[];
function burstP(x,y,c,n=12){for(let i=0;i<n;i++)particles.push(new P(x,y,i%2?c:'#fff'));}
function burstC(x,y,n=70){for(let i=0;i<n;i++)confetti.push(new Cf(x,y));}
function floatT(x,y,t,c,big){floatTexts.push(new FT(x,y,t,c,big));}

/* ===== GAME: STACK TOWER ===== */
const BLOCK_H=32;
const TOWER_BASE_Y = H*.85;
let stack=[]; /* {x,w,y,col,offsetY} */
let movingBlock=null;
let prevPalm=null;
let dropArmed=false;
let perfectStreak=0;
const HUES=[200,210,220,180,160,140,120,180,200];

function initStack(){
  stack=[];
  /* base block */
  const baseW=W*.55;
  for(let i=0;i<3;i++){
    stack.push({x:W/2, w:baseW, y:TOWER_BASE_Y - i*BLOCK_H, col:hueColor(190+i*5)});
  }
  spawnMovingBlock();
}
function hueColor(h){return `hsl(${h},75%,55%)`;}
function spawnMovingBlock(){
  const top=stack[stack.length-1];
  const dir=Math.random()<.5?-1:1;
  const speed=2.5+Math.min(stack.length*.1, 4);
  movingBlock={
    x: dir<0 ? W+top.w/2 : -top.w/2,
    w: top.w,
    y: top.y - BLOCK_H,
    vx: dir*speed,
    col: hueColor(180+stack.length*8),
  };
}

let score=0,blocks=0;
let hiScore=parseInt(localStorage.getItem('stack_hi')||'0');

function endGame(){if(gameState==='gameover')return;gameState='gameover';if(score>hiScore){hiScore=score;localStorage.setItem('stack_hi',hiScore);}sfx.gameover();ping('complete_stack');burstC(W*.3,SAFE.y+220,90);burstC(W*.7,SAFE.y+220,90);if(isRecording){if(endRecordTimer)clearTimeout(endRecordTimer);endRecordTimer=setTimeout(()=>{if(isRecording&&gameState==='gameover')stopRecording();},END_RECORD_MS);}}

function tryDrop(){
  if(!movingBlock)return;
  const top=stack[stack.length-1];
  const ml=movingBlock.x-movingBlock.w/2, mr=movingBlock.x+movingBlock.w/2;
  const tl=top.x-top.w/2, tr=top.x+top.w/2;
  const overlap=Math.min(mr,tr)-Math.max(ml,tl);
  if(overlap<=0){
    /* missed entirely — game over */
    /* draw a falling block in the gap */
    for(let i=0;i<24;i++)particles.push(new P(movingBlock.x,movingBlock.y,'#ef4444'));
    floatT(W/2,movingBlock.y-30,'❌ MISSED','#ef4444',true);
    sfx.gameover();shakeFrames=22;shakeAmp=14;flashAlpha=.6;flashCol='239,68,68';
    movingBlock=null;
    endGame();
    return;
  }
  const overlapL=Math.max(ml,tl), overlapR=Math.min(mr,tr);
  const newX=(overlapL+overlapR)/2;
  const newW=overlap;
  /* perfect detection */
  const error = Math.abs(movingBlock.x - top.x);
  const perfect = error < 4;
  /* trim — show falling piece on the trimmed side */
  if(!perfect){
    /* falling debris */
    if(ml<tl){
      /* left edge sticking out — fall left */
      for(let i=0;i<6;i++)particles.push(new P(ml+10, movingBlock.y, movingBlock.col));
    }
    if(mr>tr){
      for(let i=0;i<6;i++)particles.push(new P(mr-10, movingBlock.y, movingBlock.col));
    }
  }
  stack.push({x:newX, w:newW, y:movingBlock.y, col:movingBlock.col});
  blocks++;
  if(perfect){
    perfectStreak++;
    const bonus=5*perfectStreak;
    score+=bonus;
    floatT(newX,movingBlock.y-30, `✨ PERFECT ×${perfectStreak} +${bonus}`, '#fbbf24', true);
    burstP(newX,movingBlock.y,'#fbbf24',16);burstC(newX,movingBlock.y,20);
    sfx.perfect();flashAlpha=.35;flashCol='251,191,36';
    if(window.GameOS){
      GameOS.onScore(bonus, newX, movingBlock.y-30);
      if(perfectStreak>=3){ GameOS.onBigMoment(Math.min(1, perfectStreak*0.18)); GameOS.shake(6+perfectStreak,12); }
    }
    /* perfects DON'T shrink — give back original width if streak >=3 */
    if(perfectStreak>=3) stack[stack.length-1].w = Math.min(W*.55, stack[stack.length-1].w + 8);
  } else {
    perfectStreak=0;
    score+=1;
    floatT(newX,movingBlock.y-30, '+1', movingBlock.col);
    sfx.clack();
    burstP(newX,movingBlock.y,movingBlock.col,8);
  }
  movingBlock=null;
  /* scroll camera (visual offset all blocks down a bit) */
  if(stack.length>5){
    const slide=BLOCK_H*.8;
    for(const b of stack) b.y += slide;
    /* removed bottom block once out of view */
    while(stack.length && stack[0].y>H+BLOCK_H) stack.shift();
  }
  /* check fail — width too small */
  if(newW < 10){
    floatT(newX,movingBlock?movingBlock.y-30:H/2, '❌ TOO THIN','#ef4444',true);
    sfx.gameover();shakeFrames=20;shakeAmp=12;
    endGame();
    return;
  }
  spawnMovingBlock();
}

function update(d){
  if(window.GameOS) GameOS.update(d);
  const ts = (window.GameOS && window.GameOS.timeScale) ? GameOS.timeScale() : 1;
  if(timerMode!=='endless'&&timerRunning){timerLeft=Math.max(0,timerLeft-d);if(timerLeft<=0){timerRunning=false;endGame();}}
  if(movingBlock){
    movingBlock.x += movingBlock.vx * ts;
    const top=stack[stack.length-1];
    /* bounce edges */
    if(movingBlock.x - movingBlock.w/2 < 20){movingBlock.vx=Math.abs(movingBlock.vx);}
    if(movingBlock.x + movingBlock.w/2 > W-20){movingBlock.vx=-Math.abs(movingBlock.vx);}
  }
  /* detect tap = hand quick downward motion */
  const p=palm();
  if(p && prevPalm){
    const dy=p.y-prevPalm.y;
    /* "down-stab" gesture: quick downward motion OR being below the moving block area triggers */
    if(dy>14 && p.y > SAFE.y+200 && dropArmed){
      tryDrop();
      dropArmed=false;
      setTimeout(()=>dropArmed=true, 200);
    }
  }
  prevPalm=p;
  if(!dropArmed && !p) dropArmed=true;
}

/* SKYLINE */
function drawSky(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'rgba(8,20,60,.85)');
  sky.addColorStop(.4,'rgba(20,40,90,.65)');
  sky.addColorStop(.7,'rgba(50,70,120,.45)');
  sky.addColorStop(1,'rgba(15,15,35,.85)');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  /* stars */
  for(let i=0;i<40;i++){const x=(i*53)%W,y=(i*31)%(H*.4);const a=.3+.4*Math.sin(Date.now()/500+i);ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();}
  /* distant skyline silhouette */
  ctx.fillStyle='rgba(10,15,30,.65)';
  ctx.beginPath();ctx.moveTo(0,H*.78);
  for(let i=0;i<25;i++){const x=i*(W/25);const h=20+(((i*13)%50)+20);ctx.lineTo(x,H*.78-h);ctx.lineTo(x+W/25,H*.78-h);}
  ctx.lineTo(W,H*.78);ctx.lineTo(W,H);ctx.lineTo(0,H);
  ctx.closePath();ctx.fill();
  /* tiny window lights */
  for(let i=0;i<60;i++){const x=Math.random()*W;const y=H*.78-Math.random()*60;ctx.fillStyle=Math.random()<.5?'#fbbf24':'#0ea5e9';ctx.fillRect(x,y,2,2);}
}

function draw3DBlock(b){
  /* perspective: side faces */
  const side=8;
  ctx.save();
  /* right side */
  ctx.fillStyle=shade(b.col,-30);
  ctx.beginPath();
  ctx.moveTo(b.x+b.w/2, b.y-BLOCK_H/2);
  ctx.lineTo(b.x+b.w/2+side, b.y-BLOCK_H/2-side*.5);
  ctx.lineTo(b.x+b.w/2+side, b.y+BLOCK_H/2-side*.5);
  ctx.lineTo(b.x+b.w/2, b.y+BLOCK_H/2);
  ctx.closePath();ctx.fill();
  /* top face */
  ctx.fillStyle=shade(b.col,20);
  ctx.beginPath();
  ctx.moveTo(b.x-b.w/2, b.y-BLOCK_H/2);
  ctx.lineTo(b.x+b.w/2, b.y-BLOCK_H/2);
  ctx.lineTo(b.x+b.w/2+side, b.y-BLOCK_H/2-side*.5);
  ctx.lineTo(b.x-b.w/2+side, b.y-BLOCK_H/2-side*.5);
  ctx.closePath();ctx.fill();
  /* front face */
  const fg=ctx.createLinearGradient(b.x-b.w/2,b.y,b.x+b.w/2,b.y);
  fg.addColorStop(0,shade(b.col,5));
  fg.addColorStop(.5,b.col);
  fg.addColorStop(1,shade(b.col,-15));
  ctx.fillStyle=fg;
  ctx.fillRect(b.x-b.w/2, b.y-BLOCK_H/2, b.w, BLOCK_H);
  /* outline */
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1.5;
  ctx.strokeRect(b.x-b.w/2, b.y-BLOCK_H/2, b.w, BLOCK_H);
  ctx.restore();
}
function shade(col, amt){
  /* col is hsl(h, 75%, L%) */
  const m=col.match(/hsl\((\d+),(\d+)%?,(\d+)%?\)/);
  if(!m) return col;
  const L=Math.max(0,Math.min(100,parseInt(m[3])+amt));
  return `hsl(${m[1]},${m[2]}%,${L}%)`;
}

function drawHand(){
  const p=palm();if(!p)return;
  ctx.save();
  ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);
  ctx.fillStyle='rgba(14,165,233,.18)';ctx.fill();
  ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);
  ctx.strokeStyle='#0ea5e9';ctx.lineWidth=3;ctx.shadowColor='#0ea5e9';ctx.shadowBlur=12;ctx.stroke();
  ctx.shadowBlur=0;
  ctx.font='14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('✋',p.x,p.y);
  /* drop zone hint */
  if(movingBlock){
    ctx.strokeStyle='rgba(14,165,233,.5)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.moveTo(p.x, p.y);ctx.lineTo(p.x, movingBlock.y-BLOCK_H/2);ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function draw(){
  drawCamera();
  ctx.fillStyle='rgba(0,0,15,.45)';ctx.fillRect(0,0,W,H);
  drawSky();
  /* draw stack from bottom up */
  for(const b of stack) draw3DBlock(b);
  /* moving block */
  if(movingBlock) draw3DBlock(movingBlock);
  /* perfect alignment guide — vertical pulse line down center of top block */
  if(movingBlock && stack.length){
    const top=stack[stack.length-1];
    ctx.save();
    ctx.strokeStyle=`rgba(251,191,36,${.3+.2*Math.sin(Date.now()/200)})`;
    ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(top.x, movingBlock.y-BLOCK_H);ctx.lineTo(top.x, top.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  drawHand();
  for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);
  for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);
  for(const t of floatTexts){t.update();t.draw();}floatTexts=floatTexts.filter(t=>t.life>0);
  if(window.GameOS) GameOS.drawPopups(ctx);
  drawHUD();
  if(window.GameOS) GameOS.drawComboHUD(ctx, SAFE.x+12, SAFE.y+SAFE.h-24, 200);
}

function drawHUD(){
  const hudY=SAFE.y+12;
  ctx.save();ctx.font='900 42px -apple-system,Arial';ctx.textAlign='left';ctx.textBaseline='top';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.fillText(String(score),SAFE.x+5,hudY);ctx.font='bold 11px Arial';ctx.fillStyle='#0ea5e9';ctx.fillText(`BLOCKS ${blocks}`,SAFE.x+5,hudY+48);ctx.restore();
  ctx.save();ctx.textAlign='right';ctx.textBaseline='top';if(timerMode!=='endless'){const col=timerLeft<=10?'#ef4444':timerLeft<=20?'#f59e0b':'#22c55e';ctx.font='900 36px Arial';ctx.fillStyle=col;ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillText(`${Math.ceil(timerLeft)}s`,SAFE.x+SAFE.w-5,hudY);}ctx.restore();
  if(perfectStreak>=2){const pulse=1+0.06*Math.sin(Date.now()/80);ctx.save();ctx.font=`900 ${22*pulse}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=6;ctx.fillStyle='#fbbf24';ctx.fillText(`✨ PERFECT ×${perfectStreak}`,W/2,hudY+30);ctx.restore();}
  ctx.save();ctx.font='bold 11px Arial';ctx.textBaseline='bottom';ctx.textAlign='left';ctx.fillStyle=handsCount>0?'#55efc4':'#ff8888';ctx.fillText(handsCount>0?'✋ READY':'✋ SHOW HAND',SAFE.x+5,SAFE.y+SAFE.h-8);if(hiScore>0){ctx.textAlign='right';ctx.fillStyle='rgba(249,202,36,.7)';ctx.fillText(`🏆 ${hiScore}`,SAFE.x+SAFE.w-5,SAFE.y+SAFE.h-8);}ctx.restore();
  if(isRecording){ctx.save();ctx.beginPath();ctx.arc(SAFE.x+SAFE.w-15,hudY+10,6,0,Math.PI*2);ctx.fillStyle=`rgba(244,63,94,${.7+.3*Math.sin(Date.now()/250)})`;ctx.shadowColor='#f43f5e';ctx.shadowBlur=12;ctx.fill();ctx.restore();}
}

function drawCountdown(){ctx.fillStyle='rgba(0,0,10,.55)';ctx.fillRect(0,0,W,H);const big=cdNum===0;ctx.save();ctx.font='900 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;ctx.fillStyle='#0ea5e9';ctx.fillText('STACK PERFECTLY!',W/2,SAFE.y+220);ctx.font='13px Arial';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('Quick downward hand = DROP',W/2,SAFE.y+255);ctx.font=`900 ${big?100:160}px Arial`;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=8;ctx.strokeText(big?'GO!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.fillStyle=big?'#0ea5e9':'#fff';ctx.fillText(big?'GO!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);ctx.restore();drawHand();}

function drawEnd(){ctx.fillStyle='rgba(0,0,10,.85)';ctx.fillRect(0,0,W,H);const cw=SAFE.w-20,ch=400;const cx=SAFE.x+10,cy=SAFE.y+(SAFE.h-ch)/2-20;const ccx=cx+cw/2;ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,cy,cw,ch,24);else ctx.rect(cx,cy,cw,ch);ctx.fillStyle='rgba(5,15,30,.85)';ctx.fill();ctx.strokeStyle='rgba(14,165,233,.3)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();let y=cy+50;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='80px Arial';const e=blocks>=30?'🏆':blocks>=20?'🏗️':blocks>=10?'🧱':'⬛';ctx.fillText(e,ccx,y);y+=70;ctx.font='900 26px Arial';ctx.fillStyle='#0ea5e9';const lbl=blocks>=30?'SKY HIGH!':blocks>=20?'ARCHITECT!':blocks>=10?'NICE BUILD!':'KEEP STACKING!';ctx.fillText(lbl,ccx,y);y+=46;ctx.font='bold 16px Arial';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('STACK TOWER',ccx,y);y+=30;ctx.font='900 32px Arial';ctx.fillStyle='#fff';ctx.fillText(`${score} pts · ${blocks} blocks`,ccx,y);y+=42;if(score>=hiScore&&score>0){ctx.font='900 18px Arial';ctx.fillStyle='#fbbf24';ctx.fillText('🏆 NEW RECORD!',ccx,y);y+=22;}else if(hiScore>0){ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText(`Best: ${hiScore}`,ccx,y);}ctx.font='bold 13px Arial';ctx.fillStyle='#0ea5e9';ctx.fillText('🎬 #GameOSStack',ccx,cy+ch-44);ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText('▶ Press Start to play again',ccx,cy+ch-22);ctx.restore();}

function loop(ts){dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;ctx.setTransform(SCALE,0,0,SCALE,0,0);if(shakeFrames>0){const a=shakeAmp*(shakeFrames/22);ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);shakeFrames--;}
  if(gameState==="ready"){drawCamera();drawSky();if(window.drawGameOSReady)window.drawGameOSReady(ctx,{W,H,SAFE,emoji:"🟦",name:"Stack Tower",tagline:"Jab hand DOWN to drop the block",hiScore,hue:200,accentA:"#38bdf8",accentB:"#818cf8",tip:"⬇ Perfect alignment = full width carry"});drawHand();}
  else if(gameState==='countdown'){drawCamera();drawSky();cdT-=dt;if(cdT<=0){cdNum--;if(cdNum<0){gameState='playing';timerLeft=parseInt(timerMode)||999;timerRunning=true;initStack();}else{cdT=1;sfx.count(cdNum===0);}}drawCountdown();}
  else if(gameState==='playing'){update(dt);if(flashAlpha>0){ctx.fillStyle=`rgba(${flashCol},${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha=Math.max(0,flashAlpha-dt*2.5);}draw();}
  else if(gameState==='gameover'){drawCamera();drawSky();for(const b of stack)draw3DBlock(b);for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);drawEnd();}
  requestAnimationFrame(loop);}

let mediaRecorder=null,recChunks=[],savedBlob=null,savedMime='';
function pickMime(){const w=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(const m of w)if(MediaRecorder.isTypeSupported(m))return m;return '';}
function startRecording(){recChunks=[];savedBlob=null;$('dlArea').style.display='none';getAC();const vs=canvas.captureStream(30);let stream=vs;if(audioDest&&audioDest.stream&&audioDest.stream.getAudioTracks().length){stream=new MediaStream([...vs.getVideoTracks(),...audioDest.stream.getAudioTracks()]);}savedMime=pickMime();const opts={videoBitsPerSecond:16_000_000,audioBitsPerSecond:256_000};if(savedMime)opts.mimeType=savedMime;try{mediaRecorder=new MediaRecorder(stream,opts);}catch(e){mediaRecorder=new MediaRecorder(stream);savedMime='video/webm';}mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};mediaRecorder.onstop=()=>{const ext=savedMime.includes('mp4')?'mp4':'webm';savedBlob=new Blob(recChunks,{type:savedMime||'video/webm'});savedBlob.__ext=ext;const mb=(savedBlob.size/1024/1024).toFixed(1);$('dlMeta').textContent=`${mb}MB .${ext}`;$('dlArea').style.display='flex';$('status').textContent='✅ Done!';};mediaRecorder.start(100);isRecording=true;$('recordBtn').textContent='⏹ Stop & Save';$('recordBtn').classList.add('rec');$('status').textContent='● REC';try{const ac=getAC();if(ac){const o=ac.createOscillator(),g=ac.createGain();g.gain.value=0.0001;o.connect(g);g.connect(audioOut());o.frequency.value=20;o.start();mediaRecorder._silent=o;}}catch(_){}ping('record_stack');}
function stopRecording(){if(mediaRecorder){try{if(mediaRecorder._silent)mediaRecorder._silent.stop();}catch(_){}if(mediaRecorder.state!=='inactive')mediaRecorder.stop();}isRecording=false;$('recordBtn').textContent='⏺ Record';$('recordBtn').classList.remove('rec');$('status').textContent='Saving…';}

function reset(){score=0;blocks=0;perfectStreak=0;stack=[];movingBlock=null;particles=[];floatTexts=[];confetti=[];flashAlpha=0;shakeFrames=0;prevPalm=null;dropArmed=true;timerRunning=false;timerLeft=parseInt(timerMode)||999;if(window.GameOS)GameOS.reset();}
$('startBtn').addEventListener('click',()=>{getAC();reset();cdNum=3;cdT=1;sfx.count(false);gameState='countdown';$('startBtn').textContent='🔄 Restart';ping('start_stack');});
$('stopBtn').addEventListener('click',()=>{if(gameState==='playing'||gameState==='countdown')endGame();});
$('recordBtn').addEventListener('click',()=>{if(!isRecording)startRecording();else stopRecording();});
$('shareBtn').addEventListener('click',()=>{const url=location.href;if(navigator.share)navigator.share({title:'🧱 Stack Tower',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>{$('status').textContent='🔗 Copied!';setTimeout(()=>$('status').textContent='',2500);});else prompt('Link:',url);ping('share_stack');});
$('dlBtn').addEventListener('click',()=>{if(!savedBlob)return;const url=URL.createObjectURL(savedBlob);const a=document.createElement('a');a.href=url;a.download=`stack-${Date.now()}.${savedBlob.__ext||'webm'}`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);$('dlMeta').textContent='Downloaded! 🚀';ping('download_stack');});
$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇 Sound':'🔊 Sound';$('muteBtn').classList.toggle('on',!muted);});
document.querySelectorAll('.t-btn').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');timerMode=el.dataset.mode;}));

(async()=>{await startCamera();await listCameras();pumpFrames();})();
[1500,3500,7000].forEach(ms=>setTimeout(listCameras,ms));
requestAnimationFrame(t=>{lastTime=t;loop(t);});
</script>
<script src="gameos-nav.js"></script>
