<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#06060c" />
  <title>GameOS — One Game a Day</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
    body{
      background:#06060c;color:#fff;
      display:flex;align-items:center;justify-content:center;
      height:100vh;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      gap:18px;
    }
    #wrap{
      position:relative;height:95vh;aspect-ratio:9/16;flex-shrink:0;
      border-radius:26px;overflow:hidden;
      box-shadow:
        0 0 80px rgba(168,85,247,.18),
        0 0 80px rgba(236,72,153,.18),
        0 0 0 2px rgba(255,255,255,.06);
    }
    canvas{width:100%;height:100%;display:block;background:#06060c}

    #panel{
      display:flex;flex-direction:column;gap:7px;
      width:190px;max-height:95vh;overflow-y:auto;scrollbar-width:none;
    }
    #panel::-webkit-scrollbar{display:none}

    .badge{
      padding:11px 8px;border-radius:13px;text-align:center;
      background:linear-gradient(135deg,#a855f7,#ec4899,#f97316);
      box-shadow:0 6px 22px rgba(168,85,247,.4);
    }
    .badge .nm{font-size:15px;font-weight:900;letter-spacing:2.5px;color:#fff}
    .badge .tg{font-size:8px;opacity:.95;margin-top:2px;letter-spacing:1px;font-weight:700;color:#fff}

    .btn{
      width:100%;padding:11px 8px;border:none;border-radius:11px;
      font-size:13px;font-weight:700;cursor:pointer;
      transition:transform .13s,opacity .13s;
    }
    .btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96);opacity:.85}
    #startBtn{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}
    #homeBtn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1)}
    #stopBtn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1)}
    #stopBtn:hover{background:rgba(239,68,68,.22);color:#fca5a5}
    #recordBtn{background:linear-gradient(135deg,#ef4444,#f43f5e);color:#fff}
    #recordBtn.rec{animation:rec 1.1s ease-in-out infinite}
    @keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.7)}50%{box-shadow:0 0 0 9px rgba(244,63,94,0)}}

    #shareBtn{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff}

    #dlArea{display:none;flex-direction:column;gap:5px}
    #dlBtn{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
    .dl-meta{font-size:9px;color:rgba(255,255,255,.4);text-align:center;line-height:1.5}

    .divider{height:1px;background:rgba(255,255,255,.07);margin:1px 0}
    .sec{font-size:9.5px;font-weight:800;color:rgba(255,255,255,.32);letter-spacing:1px;text-transform:uppercase}

    select{
      width:100%;padding:7px;border-radius:9px;
      background:rgba(255,255,255,.05);color:#fff;font-size:11px;
      border:1px solid rgba(255,255,255,.1);cursor:pointer;
    }
    select:focus{outline:none;border-color:rgba(168,85,247,.6)}

    .row3{display:flex;gap:5px}
    .t-btn{
      flex:1;padding:7px 3px;border:none;border-radius:8px;
      font-size:11px;font-weight:700;cursor:pointer;
      background:rgba(255,255,255,.05);color:rgba(255,255,255,.45);
      border:1px solid rgba(255,255,255,.08);transition:all .12s;
    }
    .t-btn.active{background:rgba(168,85,247,.22);color:#d8b4fe;border-color:rgba(168,85,247,.45)}
    .t-btn:hover{transform:scale(1.04)}

    /* face swap grid */
    #faceGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
    .face-opt{
      aspect-ratio:1;border-radius:8px;border:2px solid transparent;
      background:rgba(255,255,255,.05);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;transition:all .12s;
    }
    .face-opt:hover{transform:scale(1.1)}
    .face-opt.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.3);background:rgba(255,255,255,.12)}

    .toggle-btn{
      background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);
      border:1px solid rgba(255,255,255,.1);font-size:11px;
    }
    .toggle-btn.on{background:rgba(85,239,196,.15);color:#55efc4;border-color:rgba(85,239,196,.35)}

    #status{font-size:10px;color:rgba(255,255,255,.4);text-align:center;line-height:1.6;min-height:14px}

    /* MOBILE LAYOUT */
    @media (max-width: 900px), (orientation: portrait) and (max-width: 1100px) {
      body{
        flex-direction:column;
        min-height:100dvh;min-height:100vh;height:auto;
        align-items:stretch;justify-content:flex-start;
        padding:5px;gap:5px;overflow:visible;
      }
      #wrap{
        height:calc(100dvh - 130px);height:calc(100vh - 130px);
        width:auto;max-width:calc(100vw - 10px);
        aspect-ratio:9/16;margin:0 auto;
        border-radius:18px;flex-shrink:0;
      }
      #panel{
        width:100%;max-width:560px;margin:0 auto;
        flex-direction:row;flex-wrap:wrap;gap:5px;
        max-height:none;overflow:visible;
        align-content:flex-start;padding:0 4px;flex-shrink:0;
      }
      .badge,#status,.sec,.divider,#camSelect,#safeBtn,#faceGrid{display:none !important}
      #panel .btn{flex:1 1 calc(33% - 5px);padding:10px 5px;font-size:12px;min-width:0}
      #panel #recordBtn,#panel #shareBtn,#panel #homeBtn{flex:1 1 calc(50% - 3px)}
      #panel #dlArea{flex:1 1 100%;flex-direction:row;gap:4px}
      #panel #dlBtn{flex:1 1 100%;padding:10px 5px;font-size:12px}
      #panel .dl-meta{display:none}
      .row3{flex:1 1 100%;display:flex;gap:4px}
      .t-btn{padding:8px 3px;font-size:11px}
      #muteBtn{flex:1 1 calc(50% - 3px);padding:8px 4px;font-size:11px}
    }
  </style>
</head>
<body>

<div id="wrap"><canvas id="canv"></canvas></div>

<!-- QR modal for opening the link on phone -->
<div id="qrModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;backdrop-filter:blur(8px)">
  <div style="background:#0f0f1a;padding:28px;border-radius:18px;max-width:340px;text-align:center;border:1px solid rgba(255,255,255,.1)">
    <div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:8px">📱 Scan to play on phone</div>
    <div style="font-size:12px;color:rgba(255,255,255,.55);margin-bottom:18px">Use your phone's back camera for premium 1080p quality. Open camera app → point at QR.</div>
    <img id="qrImg" src="" alt="QR" style="width:240px;height:240px;border-radius:12px;background:#fff;padding:8px;display:block;margin:0 auto" />
    <div id="qrUrl" style="font-size:11px;color:rgba(255,255,255,.5);margin-top:14px;word-break:break-all;font-family:monospace"></div>
    <button id="qrClose" style="margin-top:16px;padding:11px 22px;border:none;border-radius:10px;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;font-weight:700;cursor:pointer;font-size:13px">Close</button>
  </div>
</div>

<div id="panel">
  <div class="badge"><div class="nm">GAMEOS</div><div class="tg">ONE GAME A DAY</div></div>

  <button class="btn" id="homeBtn">🏠 Home</button>
  <button class="btn" id="startBtn">▶ Start</button>
  <button class="btn" id="stopBtn">⏹ Stop</button>

  <div class="sec">Mode</div>
  <div class="row3">
    <button class="t-btn" data-mode="endless">∞</button>
    <button class="t-btn active" data-mode="60">60s</button>
    <button class="t-btn" data-mode="30">30s</button>
  </div>

  <button class="btn" id="recordBtn">⏺ Record</button>
  <div id="dlArea">
    <button class="btn" id="dlBtn">⬇ Download</button>
    <div class="dl-meta" id="dlMeta">—</div>
  </div>

  <button class="btn" id="shareBtn">🔗 Share game</button>
  <button class="btn" id="phoneBtn">📱 Open on Phone</button>

  <div class="divider"></div>
  <div class="sec">Camera</div>
  <select id="camSelect"><option>Loading…</option></select>
  <button class="btn toggle-btn" id="refreshCamBtn" style="font-size:11px">🔄 Refresh list</button>

  <button class="btn toggle-btn" id="flipBtn">🔄 Flip Camera</button>

  <div class="divider"></div>
  <button class="btn toggle-btn" id="safeBtn">📐 Safe Zone</button>
  <button class="btn toggle-btn on" id="muteBtn">🔊 Sound</button>
  <div id="status">Loading…</div>
</div>

<video id="vid" playsinline webkit-playsinline muted autoplay style="display:none"></video>
<audio id="silent" playsinline webkit-playsinline loop preload="auto"
       src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//FJAhwBkgVw6q9PoIjLZNAvQQyPM1wAA4AGRmHEEswj3w5tOi4NRGvSILIRWFYABg00cZ4FpcFzEkdjEQwYYXQH0ABp0uKkCUDuMa7QrZmWTFjHd"
       style="display:none"></audio>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║   GAMEOS  —  Hand-tracking arcade for daily 60-sec content          ║
   ║   Built on the BRUHZEN formula:                                     ║
   ║   DECLARE → ASSESS → ISOLATE → PROCESS → BUILD → REVEAL            ║
   ║   Each game = a 60-second emotional arc.                            ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

/* ── ANALYTICS (no signup) ── */
const STATS_NS='gameos-kyadav2270';
function ping(k){fetch(`https://abacus.jasoncameron.dev/hit/${STATS_NS}/${k}`).catch(()=>{});}
ping('visits');

/* ────────────────────────────────────────────────
   ENGINE
   ──────────────────────────────────────────────── */
const canvas = document.getElementById('canv');
const ctx    = canvas.getContext('2d');
const video  = document.getElementById('vid');
const $ = id => document.getElementById(id);

const W=540, H=960, RW=1080, RH=1920, SCALE=RW/W;
canvas.width=RW; canvas.height=RH;

const SAFE = { x:25, y:90, w:390, h:630 };
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
                || (window.matchMedia && window.matchMedia('(max-width: 900px)').matches);

/* ── routing ── */
const params   = new URLSearchParams(location.search);
const startGameId = params.get('g');     /* null => home */
const startFace   = params.get('face') || 'normal';

/* ── shared state ── */
let gameState = 'home';   /* home | countdown | playing | ending */
let lastTime=0, dt=0;
let hands=[], handsCount=0, face=null;
let cameraOK=false, cropParams=null;
let faceMode = startFace;
let timerMode='60', timerLeft=60, timerRunning=false;
let isRecording=false;
let safeZoneVisible=false;
let cdNum=3, cdT=0;
let endRecordTimer=null;
const END_RECORD_MS = 4500;

/* ── shake / flash ── */
let shakeFrames=0, shakeAmp=0, flashAlpha=0;

/* ── particles / texts (engine-owned, games push into them) ── */
let particles=[], floatTexts=[], confetti=[];

/* ────────────────────────────────────────────────
   PALETTES & THEMES
   ──────────────────────────────────────────────── */
const PALETTE = ['#ff6b6b','#a29bfe','#74b9ff','#55efc4','#ffd32a','#fd79a8','#00cec9','#e17055','#f97316'];

const FACE_OPTS = [
  ['normal','—'],
  ['dog','🐶'],['cat','🐱'],['fox','🦊'],['panda','🐼'],['frog','🐸'],
  ['tiger','🐯'],['monkey','🐵'],['robot','🤖'],['alien','👽'],['ghost','👻'],
  ['unicorn','🦄'],['pumpkin','🎃'],['sun','☀️'],['cool','😎'],['ninja','🥷'],['skull','💀'],['crown','👑'],
];
const FACE_EMOJI = Object.fromEntries(FACE_OPTS);

/* ────────────────────────────────────────────────
   AUDIO  —  iOS-safe + recording-ready
   ──────────────────────────────────────────────── */
let muted=false, audioCtx=null, masterGain=null, audioDest=null, silentUnlocked=false;
function unlockSilent(){
  if(silentUnlocked) return;
  const el=$('silent'); if(!el) return;
  el.volume=0.001;
  const p=el.play();
  if(p&&p.then) p.then(()=>silentUnlocked=true).catch(()=>{});
  else silentUnlocked=true;
}
function getAC(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  if(audioCtx&&!masterGain){
    masterGain=audioCtx.createGain(); masterGain.gain.value=1;
    masterGain.connect(audioCtx.destination);
    audioDest=audioCtx.createMediaStreamDestination();
    masterGain.connect(audioDest);
    try{
      const buf=audioCtx.createBuffer(1,1,22050);
      const src=audioCtx.createBufferSource();
      src.buffer=buf; src.connect(audioCtx.destination); src.start(0);
    }catch(_){}
  }
  unlockSilent();
  return audioCtx;
}
function audioOut(){ getAC(); return masterGain || (audioCtx&&audioCtx.destination); }
function tone(freq,dur,type='sine',vol=.25,delay=0){
  if(muted)return;
  try{
    const ac=getAC(); if(!ac)return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(audioOut()); o.type=type;
    o.frequency.setValueAtTime(freq,ac.currentTime+delay);
    g.gain.setValueAtTime(vol,ac.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+delay+dur);
    o.start(ac.currentTime+delay); o.stop(ac.currentTime+delay+dur+.01);
  }catch(_){}
}
function sfx(name, opts={}) {
  if (muted) return;
  switch(name){
    case 'pop': {
      const p = opts.pts || 1;
      const f = p>=5?880:p>=3?620:380+p*40;
      try {
        const ac = getAC(); if (!ac) return;
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(audioOut()); o.type='sine';
        o.frequency.setValueAtTime(f, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(f*.3, ac.currentTime+.12);
        g.gain.setValueAtTime(.28, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.12);
        o.start(ac.currentTime); o.stop(ac.currentTime+.13);
      } catch(_){}
      break;
    }
    case 'bomb':
      try {
        const ac = getAC(); if (!ac) return;
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(audioOut()); o.type='sawtooth';
        o.frequency.setValueAtTime(160, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(35, ac.currentTime+.3);
        g.gain.setValueAtTime(.4, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.3);
        o.start(ac.currentTime); o.stop(ac.currentTime+.32);
      } catch(_){}
      break;
    case 'slice':
      try {
        const ac = getAC(); if (!ac) return;
        const buf = ac.createBuffer(1, ac.sampleRate*0.15, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1-i/d.length);
        const src = ac.createBufferSource(); src.buffer = buf;
        const g = ac.createGain(); g.gain.value = 0.3;
        const f = ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=2000;
        src.connect(f); f.connect(g); g.connect(audioOut());
        src.start();
      } catch(_){}
      break;
    case 'whack':
      tone(120, .08, 'square', .35);
      tone(80, .12, 'sine', .25, .02);
      break;
    case 'levelup':
      [523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.22,i*.08));
      break;
    case 'count':
      tone(opts.last?880:440, .15, 'triangle', .3);
      break;
    case 'power':
      [1200,1500,1800].forEach((f,i)=>tone(f,.1,'sine',.18,i*.06));
      break;
    case 'tier':
      [523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.22,i*.1));
      break;
  }
}

/* ────────────────────────────────────────────────
   MEDIAPIPE — Hands + Face Detection
   ──────────────────────────────────────────────── */
let mpHands=null, mpFace=null, sendingHands=false, sendingFace=false;
try{
  mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
  mpHands.setOptions({
    maxNumHands:2,
    modelComplexity: IS_MOBILE?0:1,
    minDetectionConfidence: IS_MOBILE?.3:.5,
    minTrackingConfidence:  IS_MOBILE?.3:.4,
  });
  mpHands.onResults(r=>{
    hands=[]; handsCount=0;
    if(!r.multiHandLandmarks)return;
    handsCount=r.multiHandLandmarks.length;
    for(const lms of r.multiHandLandmarks){
      const handPts=[];
      for(const idx of [0,4,8,12,16,20]){
        const lm=lms[idx]; let cx,cy;
        if(cropParams){
          const vw=video.videoWidth||640,vh=video.videoHeight||480;
          const vx=lm.x*vw,vy=lm.y*vh;
          const nx = (vx-cropParams.sx)/cropParams.sw;
          cx = (isFrontCamera ? (1-nx) : nx) * W;
          cy=(vy-cropParams.sy)/cropParams.sh*H;
        } else { cx=(isFrontCamera?(1-lm.x):lm.x)*W; cy=lm.y*H; }
        if(cx>=0&&cx<=W&&cy>=0&&cy<=H) handPts.push({x:cx,y:cy});
      }
      hands.push(handPts);
    }
  });
}catch(e){console.warn('Hands init',e);}

try{
  if (typeof FaceDetection !== 'undefined') {
    mpFace=new FaceDetection({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}`});
    mpFace.setOptions({model:'short', minDetectionConfidence: IS_MOBILE?.3:.5});
    mpFace.onResults(r=>{
      if(!r.detections || !r.detections.length){ /* keep last face for stability */ return; }
      const d = r.detections[0];
      const bb = d.boundingBox;
      const vw=video.videoWidth||640, vh=video.videoHeight||480;
      const vx = bb.xCenter*vw, vy = bb.yCenter*vh;
      const vw2= bb.width*vw,    vh2= bb.height*vh;
      if(cropParams){
        const fx = (1-(vx-cropParams.sx)/cropParams.sw)*W;
        const fy = (vy-cropParams.sy)/cropParams.sh*H;
        const fw = vw2/cropParams.sw*W;
        const fh = vh2/cropParams.sh*H;
        face = {x:fx,y:fy,w:fw,h:fh, t:Date.now()};
      } else {
        face = {x:(1-bb.xCenter)*W, y:bb.yCenter*H, w:bb.width*W, h:bb.height*H, t:Date.now()};
      }
    });
    console.log('FaceDetection ready');
  } else {
    console.warn('FaceDetection global not found — using fallback positioning');
  }
}catch(e){console.warn('Face init failed',e); mpFace=null;}

/* flatten all fingertip points across both hands for easy collision tests */
function allHandPts(){
  const out=[];
  for(const h of hands) for(const p of h) out.push(p);
  return out;
}

/* ────────────────────────────────────────────────
   CAMERA + FRAME LOOP
   ──────────────────────────────────────────────── */
let frameTick=0;
async function pumpFrames(){
  if(video.readyState>=2){
    /* alternate every other frame between hands and face for perf */
    if(mpHands && !sendingHands){
      sendingHands=true;
      try{ await mpHands.send({image:video}); }catch(_){}
      sendingHands=false;
    }
    frameTick++;
    /* face detection disabled */
  }
  requestAnimationFrame(pumpFrames);
}

let currentCamId=null;
let isFrontCamera = true;   /* default mirrored — most cameras */

async function startCamera(deviceId, facingPref){
  try{
    if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
    /* CRAVE pattern: facingMode 'user' by default, 720p mobile / 1080p laptop */
    const W_ideal = IS_MOBILE ? 720  : 1920;
    const H_ideal = IS_MOBILE ? 1280 : 1080;
    const constraints = {
      video: deviceId
        ? {deviceId:{exact:deviceId}, width:{ideal:W_ideal}, height:{ideal:H_ideal}}
        : {facingMode: facingPref || 'user', width:{ideal:W_ideal}, height:{ideal:H_ideal}},
      audio:false
    };
    const s = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = s; await video.play();
    const settings = s.getVideoTracks()[0].getSettings();
    currentCamId = deviceId || settings.deviceId;
    /* infer mirror: 'environment' = back cam, do not mirror */
    isFrontCamera = settings.facingMode ? (settings.facingMode==='user') : true;
    cameraOK = true;
    $('status').textContent = `✅ ${settings.width||'?'}×${settings.height||'?'}`;
    return true;
  } catch(e){
    $('status').textContent = '⚠️ '+e.message;
    return false;
  }
}
async function listCameras(){
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cams=devs.filter(d=>d.kind==='videoinput');
    $('camSelect').innerHTML='';
    cams.forEach((c,i)=>{
      const o=document.createElement('option');
      o.value=c.deviceId;
      let lbl=c.label||`Camera ${i+1}`;
      if(/iphone/i.test(lbl)) lbl='📱 '+lbl;
      else if(/facetime|builtin|integrated/i.test(lbl)) lbl='💻 '+lbl;
      o.textContent=lbl;
      if(c.deviceId===currentCamId) o.selected=true;

/* ────────────────────────────────────────────────
   CAMERA DRAW with FACE SWAP
   ──────────────────────────────────────────────── */
function drawCamera(){
  ctx.save();
  /* mirror only for front (selfie) cameras — keep back-cam un-mirrored */
  if (isFrontCamera) { ctx.translate(W,0); ctx.scale(-1,1); }
  if(video.readyState>=2){
    const vw=video.videoWidth||640, vh=video.videoHeight||480;
    const vAR=vw/vh, cAR=W/H;
    let sx,sy,sw,sh;
    if(vAR>cAR){sh=vh; sw=vh*cAR; sx=(vw-sw)/2; sy=0;}
    else       {sw=vw; sh=vw/cAR; sx=0; sy=(vh-sh)/2;}
    cropParams={sx,sy,sw,sh};
    ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);
  } else {
    ctx.fillStyle='#0a0612'; ctx.fillRect(0,0,W,H);
    cropParams=null;
  }
  ctx.restore();

}

/* ────────────────────────────────────────────────
   PARTICLES / TEXTS / CONFETTI
   ──────────────────────────────────────────────── */
class Particle{
  constructor(x,y,col){this.x=x;this.y=y;
    this.vx=(Math.random()-.5)*9;this.vy=(Math.random()-.5)*9-3;
    this.r=3+Math.random()*5;this.col=col;this.life=1;this.dec=.018;}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.25;this.life-=this.dec;}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}
}
class Conf{
  constructor(x,y){this.x=x;this.y=y;
    this.vx=(Math.random()-.5)*10;this.vy=-6-Math.random()*6;
    this.w=6+Math.random()*6;this.h=4+Math.random()*4;
    this.rot=Math.random()*Math.PI;this.rotV=(Math.random()-.5)*.15;
    this.col=PALETTE[Math.floor(Math.random()*PALETTE.length)];
    this.life=1;this.dec=.012;}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.rot+=this.rotV;this.life-=this.dec;}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.fillStyle=this.col;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();}
}
class FT{
  constructor(x,y,t,col,big){this.x=x;this.y=y;this.t=t;this.col=col;
    this.life=1;this.vy=big?-3:-1.8;this.size=big?40:26;}
  update(){this.y+=this.vy;this.life-=.022;}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    ctx.font=`900 ${this.size}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=4;
    ctx.strokeText(this.t,this.x,this.y);
    ctx.fillStyle=this.col;ctx.fillText(this.t,this.x,this.y);
    ctx.restore();}
}
function burstP(x,y,col,n=20){for(let i=0;i<n;i++) particles.push(new Particle(x,y,i%2?col:'#fff'));}
function burstC(x,y,n=70){for(let i=0;i<n;i++) confetti.push(new Conf(x,y));}
function floatT(x,y,t,col,big){floatTexts.push(new FT(x,y,t,col,big));}

      }
      ctx.restore();
    }
    for (const f of this.items) this.drawFruit(f);
  },
  drawFruit(f) {
    if (f.sliced) {
      /* split halves */
      const t=f.sliceT;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-t);
      ctx.translate(f.x,f.y);
      const off = t*40;
      ctx.save(); ctx.translate(-off,off*.3);
      ctx.font=`${f.r*1.4}px Arial`; ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(f.spec.emoji,0,0);
      ctx.restore();
      ctx.save(); ctx.translate(off,off*.3);
      ctx.fillText(f.spec.emoji,0,0);
      ctx.restore();
      ctx.restore();
      return;
    }
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
    /* shadow ring */
    ctx.shadowColor=f.spec.col; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(0,0,f.r,0,Math.PI*2);
    ctx.fillStyle=f.spec.col; ctx.fill();
    ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(0,0,f.r,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2; ctx.stroke();
    ctx.font=`${f.r*1.4}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.spec.emoji,0,2);
    ctx.restore();
  },
};

/* ╔═══ GAME 4: MOSQUITO WHACK ═══╗ */
const G_WHACK = {
  id:'whack', name:'Mosquito Smash', emoji:'🦟',
  hue: 200,
  bg: ['#0a1f2d','#1e3a5f','#06060c'],
  declare: 'SWAT THEM ALL!',
  tag: 'Smash mosquitoes fast',
  twists: { 3:'⚡ FASTER!', 5:'🐝 ANGRY BEES!', 7:'🌪️ SWARM!' },

  init() {
    this.items=[]; this.spawnT=.6; this.score=0;this.level=1;this.lives=3;this.levelScore=0;
    this.combo=0; this.comboT=0;
  },
  cfg() { const l=this.level; return {
    spawnSec: Math.max(.35, .9-(l-1)*.07), life: Math.max(1.3, 2.5-(l-1)*.15),
    bee: l>=5?.2:0, nextAt:8+l*4,
  };},
  spawn() {
    const c=this.cfg();
    const isBee = Math.random() < c.bee;
    const r = 26 + Math.random()*8;
    this.items.push({
      x: r+30 + Math.random()*(W-r*2-60),
      y: SAFE.y+50 + Math.random()*(SAFE.h-100),
      r, type: isBee ? 'bee':'mosquito',
      emoji: isBee ? '🐝' : '🦟',
      col: isBee ? '#fbbf24' : '#94a3b8',
      pts: isBee ? 3 : 1,
      lifeMax: c.life, life: c.life,
      hover: Math.random()*Math.PI*2,
      alive:true, hit:false, hitT:0,
    });
  },
  update(dt) {
    this.spawnT-=dt;
    if (this.spawnT<=0) { this.spawnT=this.cfg().spawnSec; if (this.items.length<6) this.spawn(); }
    if (this.comboT>0) this.comboT-=dt; else this.combo=0;
    const pts=allHandPts();
    for (const m of this.items) {
      if (m.hit) { m.hitT += dt*3; if (m.hitT>1) m.alive=false; continue; }
      m.life -= dt;
      m.hover += dt*8;
      m.x += Math.sin(m.hover)*1.2;
      m.y += Math.cos(m.hover*.7)*.8;
      if (m.life <= 0) m.alive = false;
      for (const p of pts) if (Math.hypot(p.x-m.x,p.y-m.y)<m.r*1.7) { this.smash(m); break; }
    }
    this.items = this.items.filter(i=>i.alive);
  },
  smash(m) {
    m.hit=true; burstP(m.x,m.y,m.col,18);
    this.combo++; this.comboT=1.5;
    const mult = this.combo>=2?this.combo:1;
    const p = m.pts*mult;
    this.score += p; this.levelScore += p;
    floatT(m.x,m.y-20, this.combo>=2?`×${this.combo} +${p}`:`+${p}`, m.col, this.combo>=4);
    sfx('whack');
    this.checkLvlUp();
  },
  checkLvlUp() {
    if (this.levelScore>=this.cfg().nextAt) {
      this.level++; this.levelScore=0; flashAlpha=.6; shakeFrames=14; shakeAmp=6;
      burstC(W*.3,SAFE.y+200,80); burstC(W*.7,SAFE.y+200,80);
      const tw=this.twists[this.level];
      floatT(W/2,SAFE.y+170, tw||`🚀 LEVEL ${this.level}`,'#f9ca24',true);
      sfx('levelup');
    }
  },
  draw() { for (const m of this.items) this.drawItem(m); },
  drawItem(m) {
    if (m.hit) {
      const s = 1+m.hitT*.6;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-m.hitT);
      ctx.translate(m.x,m.y); ctx.scale(s,s);
      ctx.font=`${m.r*1.6}px Arial`; ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('💥',0,0);
      ctx.restore();
      return;
    }
    /* lifetime ring */
    const lp = m.life / m.lifeMax;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.beginPath(); ctx.arc(0,0,m.r+8,-Math.PI/2,-Math.PI/2 + lp*Math.PI*2);
    ctx.strokeStyle = lp<.3?'#ef4444': lp<.6?'#f59e0b':'#22c55e';
    ctx.lineWidth=3; ctx.stroke();
    /* body shadow */
    ctx.shadowColor=m.col; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(0,0,m.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fill();
    ctx.shadowBlur=0;
    ctx.font=`${m.r*1.5}px Arial`; ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m.emoji,0,2);
    ctx.restore();
  },
};

/* hit-test home cards using tap or hand point */
function homeCardAt(px,py){
  const cardW = (SAFE.w-30-20)/2, cardH = 175;
  const startX = SAFE.x+15, startY = SAFE.y+180;
  for (let i=0;i<homeCards.length;i++) {
    const r=Math.floor(i/2), c=i%2;
    const cx = startX + c*(cardW+20);
    const cy = startY + r*(cardH+18);
    if (px>=cx && px<=cx+cardW && py>=cy && py<=cy+cardH) return i;
  }
  return -1;
}

/* ────────────────────────────────────────────────

   ──────────────────────────────────────────────── */
function drawBg(g){
  if (g) {
    ctx.fillStyle='#06060c'; ctx.fillRect(0,0,W,H);
    drawCamera();
    /* very light brand-tinted vignette — keeps face bright */
    const ov=ctx.createRadialGradient(W/2,H/2, H*.3, W/2,H/2, H*.75);
    ov.addColorStop(0, 'rgba(0,0,0,0)');
    ov.addColorStop(1, `hsla(${g.hue}, 60%, 6%, .55)`);
    ctx.fillStyle=ov; ctx.fillRect(0,0,W,H);
  } else {
    /* on home, no camera by default — just gradient */
    ctx.fillStyle='#0a0612'; ctx.fillRect(0,0,W,H);
  }
}

function loop(ts){
  dt = Math.min((ts-lastTime)/1000, .05); lastTime = ts;

  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  if (shakeFrames>0) {
    const a=shakeAmp*(shakeFrames/20);
    ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);
    shakeFrames--;
  }

  if (gameState==='home') {
    drawBg(null);
    drawHome();
    /* allow hand to "tap" cards by hovering */
    const pts = allHandPts();
    if (pts.length) {
      const idx = homeCardAt(pts[0].x, pts[0].y);
      homeHover = idx;
      /* hover-to-select: 0.8s hover triggers */
      if (idx>=0) {
        if (homeHover === homeHoverIdx) homeHoverT += dt; else { homeHoverT = 0; homeHoverIdx = idx; }
        if (homeHoverT > 0.8) {
          const g = homeCards[idx];
          loadGame(g.id);
          startGame();
          homeHoverT = 0;
        }
      } else { homeHoverT = 0; }
    }
    drawHands();
  }
  else if (gameState==='countdown') {
    drawBg(currentGame);
    if (flashAlpha>0) { ctx.fillStyle=`rgba(255,235,80,${flashAlpha})`; ctx.fillRect(0,0,W,H); flashAlpha=Math.max(0,flashAlpha-dt*2.5); }
    drawSafeZone();
    cdT -= dt;
    if (cdT <= 0) {
      cdNum--;
      if (cdNum < 0) {
        gameState='playing';
        timerLeft = parseInt(timerMode)||999;
        timerRunning = true;
        currentGame.lastTime = lastTime;
      } else { cdT = 1; sfx('count',{last:cdNum===0}); }
    }
    drawCountdown();
  }
  else if (gameState==='playing') {
    drawBg(currentGame);
    if (flashAlpha>0) { ctx.fillStyle=`rgba(255,235,80,${flashAlpha})`; ctx.fillRect(0,0,W,H); flashAlpha=Math.max(0,flashAlpha-dt*2.5); }
    drawSafeZone();

    if (timerMode!=='endless' && timerRunning) {
      timerLeft = Math.max(0, timerLeft-dt);
      if (timerLeft<=0) { timerRunning=false; endGame(); }
    }

    currentGame.update(dt);
    currentGame.draw();

    /* particles + texts */
    for (const p of particles){p.update();p.draw();} particles=particles.filter(p=>p.life>0);
    for (const c of confetti){c.update();c.draw();}  confetti=confetti.filter(c=>c.life>0);
    for (const t of floatTexts){t.update();t.draw();} floatTexts=floatTexts.filter(t=>t.life>0);

    drawHands();
    drawHUD();
  }
  else if (gameState==='ending') {
    drawBg(currentGame);
    drawSafeZone();
    for (const p of particles){p.update();p.draw();} particles=particles.filter(p=>p.life>0);
    for (const c of confetti){c.update();c.draw();}  confetti=confetti.filter(c=>c.life>0);
    drawEnd('GAME OVER', '#ff6b6b');
  }

  requestAnimationFrame(loop);
}
let homeHoverIdx=-1, homeHoverT=0;

/* ────────────────────────────────────────────────
   GAME CONTROL
   ──────────────────────────────────────────────── */
function loadGame(id){
  if (!GAMES[id]) return;
  currentGame = GAMES[id];
  loadHi();
  $('startBtn').textContent = '▶ Start ' + currentGame.emoji;
  ping('open_'+id);
}
function startGame(){
  if (!currentGame) return;
  getAC();  /* unlock audio on user gesture */
  currentGame.init();
  particles=[]; floatTexts=[]; confetti=[];
  flashAlpha=0; shakeFrames=0;
  timerLeft = parseInt(timerMode)||999;
  timerRunning = false;
  cdNum = 3; cdT = 1; sfx('count',{last:false});
  gameState = 'countdown';
  ping('start_'+currentGame.id);
}
function endGame(){
  if (gameState==='ending') return;
  gameState='ending';
  saveHi();
  burstC(W*.3, SAFE.y+220, 90); burstC(W*.7, SAFE.y+220, 90);
  sfx('tier');
  ping('complete_'+currentGame.id);
  if (isRecording) {
    if (endRecordTimer) clearTimeout(endRecordTimer);
    endRecordTimer = setTimeout(()=>{ if (isRecording && gameState==='ending') stopRecording(); }, END_RECORD_MS);
  }
}
function goHome(){
  gameState='home';
  if (isRecording) stopRecording();
  $('startBtn').textContent = '▶ Start';
  homeHover=-1; homeHoverIdx=-1; homeHoverT=0;
}

/* ────────────────────────────────────────────────
   RECORDING
   ──────────────────────────────────────────────── */
let mediaRecorder=null, recChunks=[], savedBlob=null, savedMime='';
function pickMime(){
  const want=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4',
              'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for (const m of want) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function startRecording(){
  recChunks=[]; savedBlob=null; $('dlArea').style.display='none';
  getAC();
  const vs = canvas.captureStream(30);
  let stream = vs;
  if (audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length) {
    stream = new MediaStream([...vs.getVideoTracks(), ...audioDest.stream.getAudioTracks()]);
  }
  savedMime = pickMime();
  const opts = { videoBitsPerSecond: 9_000_000, audioBitsPerSecond: 192_000 };
  if (savedMime) opts.mimeType = savedMime;
  try { mediaRecorder = new MediaRecorder(stream, opts); }
  catch(e){ mediaRecorder = new MediaRecorder(stream); savedMime='video/webm'; }
  mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recChunks.push(e.data); };
  mediaRecorder.onstop = ()=>{
    const ext = savedMime.includes('mp4')?'mp4':'webm';
    savedBlob = new Blob(recChunks, {type: savedMime||'video/webm'});
    savedBlob.__ext = ext;
    const mb = (savedBlob.size/1024/1024).toFixed(1);
    $('dlMeta').textContent = `${mb}MB · 1080×1920 .${ext}`;
    $('dlArea').style.display = 'flex';
    $('status').textContent = '✅ Done!';
  };
  mediaRecorder.start(100);
  isRecording = true;
  $('recordBtn').textContent='⏹ Stop & Save'; $('recordBtn').classList.add('rec');
  $('status').textContent = '● REC '+(savedMime.includes('mp4')?'MP4':'WebM')+' + audio';
  /* keep audio alive */
  try {
    const ac = getAC(); if (ac) {
      const o = ac.createOscillator(), g = ac.createGain();
      g.gain.value=0.0001; o.connect(g); g.connect(audioOut());
      o.frequency.value=20; o.start();
      mediaRecorder._silent = o;
    }
  } catch(_){}
  ping('record_'+ (currentGame?currentGame.id:'home'));
}
function stopRecording(){
  if (mediaRecorder) {
    try { if (mediaRecorder._silent) mediaRecorder._silent.stop(); } catch(_){}
    if (mediaRecorder.state!=='inactive') mediaRecorder.stop();
  }
  isRecording=false;
  $('recordBtn').textContent='⏺ Record'; $('recordBtn').classList.remove('rec');
  $('status').textContent='Saving…';
}

function buildFacePanel(){ /* face swap removed */ }

/* ────────────────────────────────────────────────
   SHARE
   ──────────────────────────────────────────────── */
function shareLink(){
  const base = location.origin + location.pathname;
  const q = new URLSearchParams();
  if (currentGame) q.set('g', currentGame.id);
  if (faceMode!=='normal') q.set('face', faceMode);
  const url = q.toString() ? `${base}?${q}` : base;
  /* native share if available (mobile), else copy */
  if (navigator.share) {
    navigator.share({title:'GameOS', text:'Play this hand-tracking game with me!', url}).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(()=>{
      $('status').textContent='🔗 Link copied!';
      setTimeout(()=>$('status').textContent='', 2500);
    });
  } else {
    prompt('Copy this link:', url);
  }
  ping('share_'+(currentGame?currentGame.id:'home'));
}

/* ────────────────────────────────────────────────
   BUTTONS
   ──────────────────────────────────────────────── */
$('startBtn').addEventListener('click',()=>{
  if (!currentGame) {
    /* if on home, default to first game */
    loadGame(homeCards[0].id);
  }
  startGame();
});
$('homeBtn').addEventListener('click', goHome);
$('stopBtn').addEventListener('click', ()=>{
  if (gameState==='playing'||gameState==='countdown') endGame();
});
$('recordBtn').addEventListener('click',()=>{
  if (!isRecording) startRecording(); else stopRecording();
});
$('shareBtn').addEventListener('click', shareLink);
$('phoneBtn').addEventListener('click', ()=>{
  const base = location.origin + location.pathname;
  const q = new URLSearchParams();
  if (currentGame) q.set('g', currentGame.id);
  const url = q.toString() ? `${base}?${q}` : base;
  $('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=480x480&data=${encodeURIComponent(url)}`;
  $('qrUrl').textContent = url;
  $('qrModal').style.display = 'flex';
});
$('qrClose').addEventListener('click', ()=> $('qrModal').style.display='none');
$('qrModal').addEventListener('click', e=>{
  if (e.target.id==='qrModal') $('qrModal').style.display='none';
});
$('dlBtn').addEventListener('click', ()=>{
  if (!savedBlob) return;
  const url = URL.createObjectURL(savedBlob);
  const a = document.createElement('a');
  a.href=url; a.download=`gameos-${currentGame?currentGame.id:'home'}-${Date.now()}.${savedBlob.__ext||'webm'}`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  $('dlMeta').textContent='Downloaded! 🚀';
  ping('download_'+(currentGame?currentGame.id:'home'));
});
$('muteBtn').addEventListener('click',()=>{
  muted=!muted;
  $('muteBtn').textContent=muted?'🔇 Sound':'🔊 Sound';
  $('muteBtn').classList.toggle('on',!muted);
});
$('safeBtn').addEventListener('click',()=>{
  safeZoneVisible=!safeZoneVisible;
  $('safeBtn').textContent=safeZoneVisible?'📐 Safe Zone ON':'📐 Safe Zone';
  $('safeBtn').classList.toggle('on',safeZoneVisible);
});
document.querySelectorAll('.t-btn').forEach(el=>el.addEventListener('click',()=>{
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); timerMode=el.dataset.mode;
}));
$('camSelect').addEventListener('change',()=>startCamera($('camSelect').value));
$('refreshCamBtn').addEventListener('click', async ()=>{
  $('status').textContent='🔄 Scanning iPhone…';
  /* retry a few times — Continuity Camera takes a moment to announce after wake */
  for (let i=0;i<3;i++) {
    try {
      const tmp = await navigator.mediaDevices.getUserMedia({video:true});
      tmp.getTracks().forEach(t=>t.stop());
    } catch(_){}
    await listCameras();
    const cnt = $('camSelect').options.length;
    if (cnt >= 2) { $('status').textContent=`✅ ${cnt} cameras found`; return; }
    await new Promise(r=>setTimeout(r,1200));
  }
  $('status').textContent='Only 1 cam · Wake iPhone & retry';
});
/* auto-refresh dropdown when iPhone Continuity Camera activates / disconnects */
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', listCameras);
}
$('flipBtn').addEventListener('click', async ()=>{
  const wantFacing = isFrontCamera ? 'environment' : 'user';
  await startCamera(null, wantFacing);
  listCameras();
});

/* canvas tap on home (mobile) → start that game */
canvas.addEventListener('click', e=>{
  if (gameState!=='home') return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left) / rect.width * W;
  const y = (e.clientY-rect.top) / rect.height * H;
  const idx = homeCardAt(x,y);
  if (idx>=0) {
    loadGame(homeCards[idx].id);
    startGame();
  }
});

/* ────────────────────────────────────────────────
   INIT
   ──────────────────────────────────────────────── */
buildFacePanel();
(async()=>{
  await startCamera();
  await listCameras();
  pumpFrames();
  /* if URL says ?g=xxx, jump straight to that game's countdown after Start */
  if (startGameId && GAMES[startGameId]) {
    loadGame(startGameId);
    /* let them tap Start so audio unlocks */
    $('status').textContent = `Ready · Press ▶`;
  } else {
    /* home menu */
    $('status').textContent = 'Pick a game';
  }
})();
requestAnimationFrame(t=>{ lastTime=t; loop(t); });
</script>
