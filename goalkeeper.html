<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a3d20" />
<title>⚽ Goalkeeper — Block Every Shot</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{
  background:#06120b;color:#fff;
  display:flex;align-items:center;justify-content:center;
  height:100vh;overflow:hidden;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;gap:18px;
}
#wrap{
  position:relative;height:95vh;aspect-ratio:9/16;flex-shrink:0;
  border-radius:24px;overflow:hidden;
  box-shadow:0 0 90px rgba(34,197,94,.25),0 0 0 2px rgba(255,255,255,.06);
}
canvas{width:100%;height:100%;display:block;background:#06120b}
#panel{display:flex;flex-direction:column;gap:7px;width:186px;max-height:95vh;overflow-y:auto;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
.badge{padding:11px 8px;border-radius:13px;text-align:center;background:linear-gradient(135deg,#16a34a,#0a3d20);box-shadow:0 6px 22px rgba(34,197,94,.4)}
.badge .nm{font-size:15px;font-weight:900;letter-spacing:2px;color:#fff}
.badge .tg{font-size:8.5px;opacity:.95;margin-top:2px;letter-spacing:1px;font-weight:700}
.btn{width:100%;padding:11px 8px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96);opacity:.85}
#startBtn{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
#stopBtn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1)}
#recordBtn{background:linear-gradient(135deg,#ef4444,#f43f5e);color:#fff}
#recordBtn.rec{animation:rec 1.1s ease-in-out infinite}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.7)}50%{box-shadow:0 0 0 9px rgba(244,63,94,0)}}
#shareBtn{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff}
#dlArea{display:none;flex-direction:column;gap:5px}
#dlBtn{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.dl-meta{font-size:9px;color:rgba(255,255,255,.4);text-align:center;line-height:1.4}
.divider{height:1px;background:rgba(255,255,255,.07);margin:1px 0}
.sec{font-size:10px;font-weight:800;color:rgba(255,255,255,.32);letter-spacing:1px;text-transform:uppercase}
select{width:100%;padding:7px;border-radius:9px;background:rgba(255,255,255,.05);color:#fff;font-size:11px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.row3{display:flex;gap:5px}
.t-btn{flex:1;padding:7px 3px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.08);transition:all .12s}
.t-btn.active{background:rgba(34,197,94,.2);color:#86efac;border-color:rgba(34,197,94,.45)}
.toggle-btn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1);font-size:11px}
.toggle-btn.on{background:rgba(85,239,196,.15);color:#55efc4;border-color:rgba(85,239,196,.35)}
#status{font-size:10px;color:rgba(255,255,255,.4);text-align:center;line-height:1.6}
.hint{font-size:10px;color:rgba(255,255,255,.3);line-height:1.85}
@media (max-width:900px),(orientation:portrait) and (max-width:1100px){
  body{flex-direction:column;min-height:100dvh;min-height:100vh;height:auto;align-items:stretch;justify-content:flex-start;padding:5px;gap:5px;overflow:visible}
  #wrap{height:calc(100dvh - 130px);height:calc(100vh - 130px);width:auto;max-width:calc(100vw - 10px);aspect-ratio:9/16;margin:0 auto;border-radius:18px;flex-shrink:0}
  #panel{width:100%;max-width:560px;margin:0 auto;flex-direction:row;flex-wrap:wrap;gap:5px;max-height:none;overflow:visible;align-content:flex-start;padding:0 4px;flex-shrink:0}
  .badge,#status,.sec,.divider,#camSelect,.hint{display:none !important}
  #panel .btn{flex:1 1 calc(33% - 5px);padding:10px 5px;font-size:12px;min-width:0}
  #panel #recordBtn,#panel #shareBtn{flex:1 1 calc(50% - 3px)}
  #panel #dlArea{flex:1 1 100%;flex-direction:row;gap:4px}
  #panel #dlBtn{flex:1 1 100%;padding:10px 5px;font-size:12px}
  #panel .dl-meta{display:none}
  .row3{flex:1 1 100%;display:flex;gap:4px}
}
</style>

<body>
<div id="wrap"><canvas id="canv"></canvas></div>
<div id="panel">
  <div class="badge"><div class="nm">⚽ GOALKEEPER</div><div class="tg">BLOCK EVERY SHOT</div></div>
  <button class="btn" id="startBtn">▶ Start</button>
  <button class="btn" id="stopBtn">⏹ Stop</button>
  <div class="sec">Mode</div>
  <div class="row3">
    <button class="t-btn" data-mode="endless">∞</button>
    <button class="t-btn active" data-mode="60">60s</button>
    <button class="t-btn" data-mode="30">30s</button>
  </div>
  <button class="btn" id="recordBtn">⏺ Record</button>
  <div id="dlArea"><button class="btn" id="dlBtn">⬇ Download</button><div class="dl-meta" id="dlMeta">—</div></div>
  <button class="btn" id="shareBtn">🔗 Share</button>
  <div class="divider"></div>
  <div class="sec">Camera</div>
  <select id="camSelect"><option>Loading…</option></select>
  <div class="divider"></div>
  <button class="btn toggle-btn on" id="muteBtn">🔊 Sound</button>
  <div id="status">Loading…</div>
  <div class="divider"></div>
  <div class="hint">🥅 Block shots with hands<br>🧤 Use BOTH arms wide<br>⚽ Don't let ball pass<br>🏆 Most saves wins</div>
</div>
<video id="vid" playsinline webkit-playsinline muted autoplay style="display:none"></video>
<audio id="silent" playsinline webkit-playsinline loop preload="auto" src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//FJAhwBkgVw6q9PoIjLZNAvQQyPM1wAA4AGRmHEEswj3w5tOi4NRGvSILIRWFYABg00cZ4FpcFzEkdjEQwYYXQH0ABp0uKkCUDuMa7QrZmWTFjHd" style="display:none"></audio>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script>
const STATS_NS='gameos-kyadav2270';
function ping(k){fetch(`https://abacus.jasoncameron.dev/hit/${STATS_NS}/${k}`).catch(()=>{});}
ping('visit_keeper');

/* ENGINE */
const canvas=document.getElementById('canv'), ctx=canvas.getContext('2d'), video=document.getElementById('vid');
const $=id=>document.getElementById(id);
const W=540,H=960,RW=1080,RH=1920,SCALE=RW/W;
canvas.width=RW;canvas.height=RH;
const SAFE={x:25,y:90,w:390,h:630};
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);

let gameState='ready',lastTime=0,dt=0;
let hands=[],handsCount=0,cameraOK=false,cropParams=null,isFrontCamera=true;
let timerMode='60',timerLeft=60,timerRunning=false,isRecording=false;
let cdNum=3,cdT=0,endRecordTimer=null;
const END_RECORD_MS=4500;
let shakeFrames=0,shakeAmp=0,flashAlpha=0,flashCol='255,255,255';

/* GAME STATE */
let score=0,level=1,lives=3,combo=0,comboT=0,levelScore=0;
let balls=[],particles=[],floatTexts=[],confetti=[];
let spawnT=1.4;
let hiScore=parseInt(localStorage.getItem('keeper_hi')||'0');

/* AUDIO */
let muted=false,audioCtx=null,masterGain=null,audioDest=null,silentUnlocked=false;
function unlockSilent(){if(silentUnlocked)return;const el=$('silent');if(!el)return;el.volume=0.001;const p=el.play();if(p&&p.then)p.then(()=>silentUnlocked=true).catch(()=>{});else silentUnlocked=true;}
function getAC(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  if(audioCtx&&!masterGain){
    masterGain=audioCtx.createGain();masterGain.gain.value=1;
    masterGain.connect(audioCtx.destination);
    audioDest=audioCtx.createMediaStreamDestination();masterGain.connect(audioDest);
    try{const buf=audioCtx.createBuffer(1,1,22050);const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start(0);}catch(_){}
  }
  unlockSilent();return audioCtx;
}
function audioOut(){getAC();return masterGain||(audioCtx&&audioCtx.destination);}
function tone(f,d,t='sine',v=.25,dl=0){if(muted)return;try{const ac=getAC();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(audioOut());o.type=t;o.frequency.setValueAtTime(f,ac.currentTime+dl);g.gain.setValueAtTime(v,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d+.01);}catch(_){}}
function noise(dur,vol=.3,freq=4000){if(muted)return;try{const ac=getAC();if(!ac)return;const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=ac.createBufferSource();src.buffer=buf;const g=ac.createGain();g.gain.value=vol;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;src.connect(f);f.connect(g);g.connect(audioOut());src.start();}catch(_){}}
const sfx={
  save(){tone(800,.08,'square',.3);tone(1200,.1,'sine',.25,.04);},
  goal(){tone(120,.4,'sawtooth',.4);setTimeout(()=>noise(.6,.3,800),0);},
  kick(){tone(180,.05,'square',.4);noise(.05,.25,2000);},
  whistle(){tone(2400,.4,'sine',.25);tone(2600,.4,'sine',.2,.05);},
  count(last){tone(last?880:440,.15,'triangle',.3);},
  levelup(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.22,i*.08));},
  cheer(){noise(.6,.2,3000);tone(440,.3,'sine',.15,.1);tone(660,.3,'sine',.15,.15);},
};

/* MEDIAPIPE HANDS */
let mpHands=null,sendingHands=false;
try{
  mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
  mpHands.setOptions({maxNumHands:2,modelComplexity:IS_MOBILE?0:1,minDetectionConfidence:IS_MOBILE?.3:.5,minTrackingConfidence:IS_MOBILE?.3:.4});
  mpHands.onResults(r=>{
    hands=[];handsCount=0;
    if(!r.multiHandLandmarks)return;
    handsCount=r.multiHandLandmarks.length;
    for(const lms of r.multiHandLandmarks){
      const pts=[];
      for(const idx of [0,4,8,12,16,20]){
        const lm=lms[idx];let cx,cy;
        if(cropParams){
          const vw=video.videoWidth||640,vh=video.videoHeight||480;
          const vx=lm.x*vw,vy=lm.y*vh;
          const nx=(vx-cropParams.sx)/cropParams.sw;
          cx=(isFrontCamera?(1-nx):nx)*W;
          cy=(vy-cropParams.sy)/cropParams.sh*H;
        }else{cx=(isFrontCamera?(1-lm.x):lm.x)*W;cy=lm.y*H;}
        if(cx>=0&&cx<=W&&cy>=0&&cy<=H)pts.push({x:cx,y:cy});
      }
      hands.push(pts);
    }
  });
}catch(e){console.warn(e);}
function allHandPts(){const o=[];for(const h of hands)for(const p of h)o.push(p);return o;}

async function pumpFrames(){
  if(mpHands&&video.readyState>=2&&!sendingHands){sendingHands=true;try{await mpHands.send({image:video});}catch(_){}sendingHands=false;}
  requestAnimationFrame(pumpFrames);
}

let currentCamId=null;
async function startCamera(deviceId,facingPref){
  try{
    if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
    const Wi=IS_MOBILE?720:1920,Hi=IS_MOBILE?1280:1080;
    const c={video:deviceId?{deviceId:{exact:deviceId},width:{ideal:Wi},height:{ideal:Hi}}:{facingMode:facingPref||'user',width:{ideal:Wi},height:{ideal:Hi}},audio:false};
    const s=await navigator.mediaDevices.getUserMedia(c);
    video.srcObject=s;await video.play();
    const st=s.getVideoTracks()[0].getSettings();
    currentCamId=deviceId||st.deviceId;
    isFrontCamera=st.facingMode?(st.facingMode==='user'):true;
    cameraOK=true;$('status').textContent=`✅ ${st.width||'?'}×${st.height||'?'}`;
    return true;
  }catch(e){$('status').textContent='⚠️ '+e.message;return false;}
}
async function listCameras(){
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cams=devs.filter(d=>d.kind==='videoinput');
    $('camSelect').innerHTML='';
    cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.deviceId;let lbl=c.label||`Camera ${i+1}`;if(/iphone/i.test(lbl))lbl='📱 '+lbl;else if(/facetime|builtin/i.test(lbl))lbl='💻 '+lbl;o.textContent=lbl;if(c.deviceId===currentCamId)o.selected=true;$('camSelect').appendChild(o);});
    if(cams.length===0)$('camSelect').innerHTML='<option>No cameras</option>';
  }catch(_){}
}
$('camSelect').addEventListener('change',()=>startCamera($('camSelect').value));
if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',listCameras);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)listCameras();});

/* CAMERA DRAW + STADIUM OVERLAY */
function drawCamera(){
  ctx.save();
  if(isFrontCamera){ctx.translate(W,0);ctx.scale(-1,1);}
  if(video.readyState>=2){
    const vw=video.videoWidth||640,vh=video.videoHeight||480;
    const vAR=vw/vh,cAR=W/H;
    let sx,sy,sw,sh;
    if(vAR>cAR){sh=vh;sw=vh*cAR;sx=(vw-sw)/2;sy=0;}
    else{sw=vw;sh=vw/cAR;sx=0;sy=(vh-sh)/2;}
    cropParams={sx,sy,sw,sh};
    ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);
  }else{ctx.fillStyle='#0a3d20';ctx.fillRect(0,0,W,H);cropParams=null;}
  ctx.restore();
}

/* STADIUM (drawn on top of camera) */
function drawStadium(){
  /* sky gradient at top */
  const sky=ctx.createLinearGradient(0,0,0,H*.4);
  sky.addColorStop(0,'rgba(15,30,60,.55)');
  sky.addColorStop(1,'rgba(15,30,60,0)');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.4);

  /* floodlight glow corners */
  for(let i=0;i<4;i++){
    const x=i%2===0?80:W-80, y=60;
    const g=ctx.createRadialGradient(x,y,5,x,y,160);
    g.addColorStop(0,'rgba(255,255,200,.35)');
    g.addColorStop(1,'rgba(255,255,200,0)');
    ctx.fillStyle=g;ctx.fillRect(x-160,y-160,320,320);
  }

  /* CROWD silhouette at top */
  const crowdY=H*.18;
  const cgrad=ctx.createLinearGradient(0,crowdY,0,crowdY+30);
  cgrad.addColorStop(0,'rgba(20,15,25,.7)');
  cgrad.addColorStop(1,'rgba(20,15,25,0)');
  ctx.fillStyle=cgrad;
  ctx.fillRect(0,crowdY,W,30);
  /* tiny dot crowd */
  for(let i=0;i<60;i++){
    const x=i*(W/60)+(Math.sin(Date.now()/600+i)*.5);
    ctx.beginPath();ctx.arc(x,crowdY+5+(i%3)*4,2.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(${30+i%20},${20+(i*7)%30},${40+i%30},.6)`;ctx.fill();
  }

  /* GOAL POST — front-facing perspective */
  drawGoalPost();
}
function drawGoalPost(){
  /* goal at upper-center, perspective looking out from goal */
  const gx=W*.5, gy=H*.32, gw=W*.78, gh=H*.28;
  const left=gx-gw/2, right=gx+gw/2, top=gy-gh/2, bot=gy+gh/2;

  /* NET — diagonal mesh lines */
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.15)';
  ctx.lineWidth=1;
  /* vertical strands */
  const cols=14;
  for(let i=0;i<=cols;i++){
    const x=left+(right-left)*(i/cols);
    /* perspective: net stretches back, top closer */
    ctx.beginPath();ctx.moveTo(x,top);
    ctx.lineTo(left+(right-left)*(i/cols)*0.9+W*.05, bot);
    ctx.stroke();
  }
  /* horizontal strands */
  const rows=8;
  for(let i=0;i<=rows;i++){
    const y=top+(bot-top)*(i/rows);
    ctx.beginPath();ctx.moveTo(left+(i/rows)*W*.04, y);
    ctx.lineTo(right-(i/rows)*W*.04, y);
    ctx.stroke();
  }
  ctx.restore();

  /* GOAL POSTS - thick white frame */
  ctx.save();
  ctx.strokeStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=12;
  ctx.lineWidth=8;ctx.lineCap='round';
  /* top crossbar */
  ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(right,top);ctx.stroke();
  /* left post */
  ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,bot);ctx.stroke();
  /* right post */
  ctx.beginPath();ctx.moveTo(right,top);ctx.lineTo(right,bot);ctx.stroke();
  ctx.restore();

  /* PITCH lines below — penalty area */
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;
  /* goal line */
  ctx.beginPath();ctx.moveTo(0,bot);ctx.lineTo(W,bot);ctx.stroke();
  /* penalty arc/box */
  const pyA=bot, pyB=bot+H*.16;
  ctx.beginPath();
  ctx.moveTo(W*.1,pyA);ctx.lineTo(W*.1,pyB);
  ctx.lineTo(W*.9,pyB);ctx.lineTo(W*.9,pyA);
  ctx.stroke();
  /* 6-yard */
  const pyC=bot+H*.07;
  ctx.beginPath();
  ctx.moveTo(W*.28,pyA);ctx.lineTo(W*.28,pyC);
  ctx.lineTo(W*.72,pyC);ctx.lineTo(W*.72,pyA);
  ctx.stroke();
  /* penalty spot */
  ctx.beginPath();ctx.arc(W*.5,bot+H*.11,3.5,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}

/* SHOT TARGET BOX — where ball must NOT enter */
function goalBox(){
  const gx=W*.5,gy=H*.32,gw=W*.78,gh=H*.28;
  return {l:gx-gw/2,r:gx+gw/2,t:gy-gh/2,b:gy+gh/2};
}

/* BALL — proper soccer ball with pentagon panels */
function drawBall(b){
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(b.rot);
  /* shadow on pitch */
  ctx.save();
  ctx.translate(0, b.r*1.4);
  ctx.scale(1, .35);
  ctx.beginPath();ctx.arc(0,0,b.r*.9,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  ctx.restore();
  /* ball body — gradient sphere */
  const g=ctx.createRadialGradient(-b.r*.3,-b.r*.4,b.r*.05,0,0,b.r*1.1);
  g.addColorStop(0,'#fff');g.addColorStop(.6,'#e5e7eb');g.addColorStop(1,'#9ca3af');
  ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);
  ctx.fillStyle=g;ctx.fill();
  /* pentagon pattern — center pentagon */
  ctx.fillStyle='#0f172a';
  const pents=[
    {cx:0,cy:0,s:.36},
    {cx:.55,cy:-.3,s:.22},
    {cx:-.55,cy:-.3,s:.22},
    {cx:.55,cy:.4,s:.22},
    {cx:-.55,cy:.4,s:.22},
  ];
  for(const p of pents){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5 - Math.PI/2;
      const px=p.cx*b.r + Math.cos(a)*b.r*p.s;
      const py=p.cy*b.r + Math.sin(a)*b.r*p.s;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.fill();
  }
  /* highlight */
  ctx.beginPath();ctx.ellipse(-b.r*.3,-b.r*.35,b.r*.22,b.r*.13,-.5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();
  ctx.restore();
}

/* ════ GAME LOGIC ════ */
function cfg(){
  const l=level;
  return{
    spawnSec:Math.max(.7,1.6-(l-1)*.13),
    spd:1.3+(l-1)*.22,
    nextAt:5+l*3,
  };
}
function spawnBall(){
  /* ball starts from goal area, flies toward player (bottom of screen) */
  const startInsideGoal = Math.random()<.85; /* shot heading to goal */
  const g=goalBox();
  const sx = startInsideGoal
    ? g.l + Math.random()*(g.r-g.l)
    : Math.random()*W;
  const sy = g.t + Math.random()*(g.b-g.t)*.7;
  /* target — somewhere in the lower play area */
  const targetX = 60 + Math.random()*(W-120);
  const targetY = H*.7 + Math.random()*(H*.15);
  const c=cfg();
  /* compute velocity to reach target in ~1.3s */
  const flightT = 1.3;
  const vx = (targetX-sx)/flightT * .016 * c.spd;
  const vy = (targetY-sy)/flightT * .016 * c.spd;
  balls.push({
    x:sx, y:sy, r:14, rot:0, rotV:(Math.random()-.5)*.3,
    vx,vy, scale:.45,
    saved:false, scored:false, life:1,
    fxT:0,
  });
  sfx.kick();
}
function endGame(){
  if(gameState==='gameover')return;
  gameState='gameover';
  if(score>hiScore){hiScore=score;localStorage.setItem('keeper_hi',hiScore);}
  sfx.whistle();sfx.cheer();
  ping('complete_keeper');
  burstC(W*.3,SAFE.y+220,90);burstC(W*.7,SAFE.y+220,90);
  if(isRecording){if(endRecordTimer)clearTimeout(endRecordTimer);endRecordTimer=setTimeout(()=>{if(isRecording&&gameState==='gameover')stopRecording();},END_RECORD_MS);}
}

class P{constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-.5)*9;this.vy=(Math.random()-.5)*9-3;this.r=3+Math.random()*5;this.c=c;this.life=1;this.dec=.018;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.25;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
class Cf{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-.5)*10;this.vy=-6-Math.random()*6;this.w=6+Math.random()*6;this.h=4+Math.random()*4;this.rot=Math.random()*Math.PI;this.rotV=(Math.random()-.5)*.15;const PA=['#22c55e','#fbbf24','#ef4444','#fff','#0ea5e9'];this.c=PA[0|Math.random()*PA.length];this.life=1;this.dec=.012;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.3;this.rot+=this.rotV;this.life-=this.dec;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.c;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();}}
class FT{constructor(x,y,t,c,big){this.x=x;this.y=y;this.t=t;this.c=c;this.life=1;this.vy=big?-3:-1.8;this.sz=big?40:26;}update(){this.y+=this.vy;this.life-=.022;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.font=`900 ${this.sz}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=4;ctx.strokeText(this.t,this.x,this.y);ctx.fillStyle=this.c;ctx.fillText(this.t,this.x,this.y);ctx.restore();}}
function burstP(x,y,c,n=22){for(let i=0;i<n;i++)particles.push(new P(x,y,i%2?c:'#fff'));}
function burstC(x,y,n=70){for(let i=0;i<n;i++)confetti.push(new Cf(x,y));}
function floatT(x,y,t,c,big){floatTexts.push(new FT(x,y,t,c,big));}

function update(d){
  if(timerMode!=='endless'&&timerRunning){timerLeft=Math.max(0,timerLeft-d);if(timerLeft<=0){timerRunning=false;endGame();}}
  if(comboT>0)comboT-=d;else combo=0;
  spawnT-=d;
  if(spawnT<=0){spawnT=cfg().spawnSec*(.85+Math.random()*.3);if(balls.length<4)spawnBall();}

  const pts=allHandPts();
  for(const b of balls){
    if(b.saved||b.scored){b.fxT+=d*2.5;if(b.fxT>1)b.life=0;continue;}
    b.x+=b.vx;b.y+=b.vy;b.scale=Math.min(1.2,b.scale+d*.4);
    b.r=14*b.scale;b.rot+=b.rotV;
    /* check hand collision */
    for(const p of pts){
      if(Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.8){
        /* SAVE! */
        b.saved=true;burstP(b.x,b.y,'#22c55e',26);
        combo++;comboT=2;
        const mult=combo>=2?combo:1;
        const ps=3*mult;
        score+=ps;levelScore+=ps;
        floatT(b.x,b.y-30,combo>=2?`SAVE! ×${combo} +${ps}`:`SAVE! +${ps}`,'#22c55e',true);
        sfx.save();
        if(levelScore>=cfg().nextAt){level++;levelScore=0;flashAlpha=.5;flashCol='34,197,94';burstC(W*.3,SAFE.y+200,60);burstC(W*.7,SAFE.y+200,60);floatT(W/2,SAFE.y+200,`🚀 LEVEL ${level}`,'#fbbf24',true);sfx.levelup();}
        break;
      }
    }
    /* check goal scored against you */
    if(!b.saved && b.y>H*.85){
      b.scored=true;burstP(b.x,b.y,'#ef4444',30);
      lives=Math.max(0,lives-1);combo=0;
      floatT(W/2,H*.7,'⚽ GOAL!','#ef4444',true);
      shakeFrames=22;shakeAmp=14;flashAlpha=.6;flashCol='239,68,68';
      sfx.goal();
      if(timerMode==='endless'&&lives<=0)endGame();
    }
    if(b.x<-30||b.x>W+30){b.life=0;}
  }
  balls=balls.filter(b=>b.life>0);
}

function draw(){
  drawCamera();
  /* dark playfield wash */
  ctx.fillStyle='rgba(8,20,12,.4)';ctx.fillRect(0,0,W,H);
  drawStadium();

  for(const b of balls){
    if(b.saved){
      ctx.save();ctx.globalAlpha=Math.max(0,1-b.fxT);
      const s=1+b.fxT*.6;
      ctx.translate(b.x,b.y);ctx.scale(s,s);
      ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🧤',0,0);
      ctx.restore();
    }else if(b.scored){
      ctx.save();ctx.globalAlpha=Math.max(0,1-b.fxT);
      drawBall(b);
      ctx.restore();
    }else{
      drawBall(b);
    }
  }

  for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);
  for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);
  for(const t of floatTexts){t.update();t.draw();}floatTexts=floatTexts.filter(t=>t.life>0);

  drawHands();
  drawHUD();
}

function drawHands(){
  for(const ha of hands){
    for(const p of ha){
      ctx.save();
      ctx.beginPath();ctx.arc(p.x,p.y,28,0,Math.PI*2);
      ctx.fillStyle='rgba(34,197,94,.18)';ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,20,0,Math.PI*2);
      ctx.strokeStyle='#22c55e';ctx.lineWidth=3;
      ctx.shadowColor='#22c55e';ctx.shadowBlur=12;ctx.stroke();
      ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);
      ctx.fillStyle='#fff';ctx.fill();
      ctx.restore();
    }
  }
}

function drawHUD(){
  const hudY=SAFE.y+12;
  /* score */
  ctx.save();
  ctx.font='900 42px -apple-system,Arial';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;ctx.fillStyle='#fff';
  ctx.fillText(String(score),SAFE.x+5,hudY);
  ctx.font='bold 11px Arial';ctx.fillStyle='#22c55e';
  ctx.fillText('SAVES · LV '+level,SAFE.x+5,hudY+48);
  ctx.restore();
  /* timer/lives */
  ctx.save();
  ctx.textAlign='right';ctx.textBaseline='top';
  if(timerMode==='endless'){
    ctx.font='22px Arial';
    ctx.fillText('❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives)),SAFE.x+SAFE.w-5,hudY+8);
  }else{
    const col=timerLeft<=10?'#ef4444':timerLeft<=20?'#f59e0b':'#22c55e';
    ctx.font='900 36px Arial';ctx.fillStyle=col;
    ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=8;
    ctx.fillText(`${Math.ceil(timerLeft)}s`,SAFE.x+SAFE.w-5,hudY);
  }
  ctx.restore();
  /* title */
  ctx.save();
  ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=4;
  ctx.fillText('🧤 GOALKEEPER', W/2, hudY+5);
  ctx.restore();
  /* combo */
  if(combo>=2&&comboT>0){
    const a=Math.min(1,comboT/2);
    const pulse=1+0.06*Math.sin(Date.now()/80);
    ctx.save();ctx.font=`900 ${(22+Math.min(combo,6)*1.4)*pulse}px Arial`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=6;
    ctx.fillStyle=`rgba(251,191,36,${a})`;
    ctx.fillText(`🔥 ×${combo}`,W/2,hudY+85);
    ctx.restore();
  }
  /* hand status + hi score */
  ctx.save();
  ctx.font='bold 11px Arial';ctx.textBaseline='bottom';
  ctx.textAlign='left';
  ctx.fillStyle=handsCount>0?'#55efc4':'#ff8888';
  ctx.fillText(handsCount>0?`🖐 ${handsCount}`:'🖐 SHOW HANDS',SAFE.x+5,SAFE.y+SAFE.h-8);
  if(hiScore>0){ctx.textAlign='right';ctx.fillStyle='rgba(249,202,36,.7)';ctx.fillText(`🏆 ${hiScore}`,SAFE.x+SAFE.w-5,SAFE.y+SAFE.h-8);}
  ctx.restore();
  /* REC */
  if(isRecording){ctx.save();ctx.beginPath();ctx.arc(SAFE.x+SAFE.w-15,hudY+10,6,0,Math.PI*2);ctx.fillStyle=`rgba(244,63,94,${.7+.3*Math.sin(Date.now()/250)})`;ctx.shadowColor='#f43f5e';ctx.shadowBlur=12;ctx.fill();ctx.restore();}
}

function drawCountdown(){
  ctx.fillStyle='rgba(0,0,10,.55)';ctx.fillRect(0,0,W,H);
  const big=cdNum===0;
  ctx.save();
  ctx.font='900 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;
  ctx.fillStyle='#fbbf24';ctx.fillText('BLOCK EVERY SHOT!',W/2,SAFE.y+220);
  ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText('Spread your arms wide',W/2,SAFE.y+260);
  ctx.font=`900 ${big?100:160}px Arial`;
  ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=8;
  ctx.strokeText(big?'GO!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);
  ctx.fillStyle=big?'#22c55e':'#fff';
  ctx.fillText(big?'GO!':String(cdNum),W/2,SAFE.y+SAFE.h/2+30);
  ctx.restore();
  drawHands();
}

function drawEnd(){
  ctx.fillStyle='rgba(0,0,10,.85)';ctx.fillRect(0,0,W,H);
  const cw=SAFE.w-20,ch=380;
  const cx=SAFE.x+10,cy=SAFE.y+(SAFE.h-ch)/2-20;
  const ccx=cx+cw/2;
  ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,cy,cw,ch,24);else ctx.rect(cx,cy,cw,ch);ctx.fillStyle='rgba(0,0,10,.7)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  let y=cy+50;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='80px Arial';
  const e = score>=20?'🏆':score>=10?'🥇':score>=5?'🥈':'🥉';
  ctx.fillText(e,ccx,y);y+=70;
  ctx.font='900 26px Arial';ctx.fillStyle='#fbbf24';
  const lbl = score>=20?'WORLD CLASS!':score>=10?'GREAT SAVES!':score>=5?'NICE WORK!':'KEEP TRYING';
  ctx.fillText(lbl,ccx,y);y+=46;
  ctx.font='bold 16px Arial';ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText('GOALKEEPER',ccx,y);y+=30;
  ctx.font='900 32px Arial';ctx.fillStyle='#fff';
  ctx.fillText(`${score} saves · LV ${level}`,ccx,y);y+=46;
  if(score>=hiScore&&score>0){ctx.font='900 18px Arial';ctx.fillStyle='#fbbf24';ctx.fillText('🏆 NEW RECORD!',ccx,y);y+=30;}
  else if(hiScore>0){ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText(`Best: ${hiScore}`,ccx,y);y+=20;}
  ctx.font='bold 13px Arial';ctx.fillStyle='#22c55e';
  ctx.fillText('🎬 #GameOSGoalkeeper',ccx,cy+ch-44);
  ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.fillText('▶ Press Start to play again',ccx,cy+ch-22);
  ctx.restore();
}

function loop(ts){
  dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  if(shakeFrames>0){const a=shakeAmp*(shakeFrames/22);ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);shakeFrames--;}

  if(gameState==='ready'){
    drawCamera();
    ctx.fillStyle='rgba(0,0,10,.55)';ctx.fillRect(0,0,W,H);
    drawStadium();
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='80px Arial';ctx.fillText('🧤',W/2,SAFE.y+220);
    ctx.font='900 48px Arial';
    const wm=ctx.createLinearGradient(0,SAFE.y+260,0,SAFE.y+320);
    wm.addColorStop(0,'#22c55e');wm.addColorStop(1,'#0a3d20');
    ctx.fillStyle=wm;
    ctx.fillText('GOALKEEPER',W/2,SAFE.y+290);
    ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.fillText('Block every shot with your hands',W/2,SAFE.y+330);
    if(hiScore>0){ctx.font='bold 16px Arial';ctx.fillStyle='#fbbf24';ctx.fillText(`🏆 Best: ${hiScore}`,W/2,SAFE.y+SAFE.h-100);}
    ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.fillText('▶ Press Start',W/2,SAFE.y+SAFE.h-50);
    ctx.restore();
    drawHands();
  }
  else if(gameState==='countdown'){
    drawCamera();ctx.fillStyle='rgba(8,20,12,.4)';ctx.fillRect(0,0,W,H);drawStadium();
    cdT-=dt;
    if(cdT<=0){cdNum--;if(cdNum<0){gameState='playing';timerLeft=parseInt(timerMode)||999;timerRunning=true;}else{cdT=1;sfx.count(cdNum===0);}}
    drawCountdown();
  }
  else if(gameState==='playing'){
    update(dt);
    if(flashAlpha>0){ctx.fillStyle=`rgba(${flashCol},${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha=Math.max(0,flashAlpha-dt*2.5);}
    draw();
  }
  else if(gameState==='gameover'){
    drawCamera();ctx.fillStyle='rgba(8,20,12,.4)';ctx.fillRect(0,0,W,H);drawStadium();
    for(const c of confetti){c.update();c.draw();}confetti=confetti.filter(c=>c.life>0);
    for(const p of particles){p.update();p.draw();}particles=particles.filter(p=>p.life>0);
    drawEnd();
  }
  requestAnimationFrame(loop);
}

/* RECORDING */
let mediaRecorder=null,recChunks=[],savedBlob=null,savedMime='';
function pickMime(){const w=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(const m of w)if(MediaRecorder.isTypeSupported(m))return m;return '';}
function startRecording(){
  recChunks=[];savedBlob=null;$('dlArea').style.display='none';getAC();
  const vs=canvas.captureStream(30);let stream=vs;
  if(audioDest&&audioDest.stream&&audioDest.stream.getAudioTracks().length){stream=new MediaStream([...vs.getVideoTracks(),...audioDest.stream.getAudioTracks()]);}
  savedMime=pickMime();
  const opts={videoBitsPerSecond:9_000_000,audioBitsPerSecond:192_000};
  if(savedMime)opts.mimeType=savedMime;
  try{mediaRecorder=new MediaRecorder(stream,opts);}catch(e){mediaRecorder=new MediaRecorder(stream);savedMime='video/webm';}
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=()=>{const ext=savedMime.includes('mp4')?'mp4':'webm';savedBlob=new Blob(recChunks,{type:savedMime||'video/webm'});savedBlob.__ext=ext;const mb=(savedBlob.size/1024/1024).toFixed(1);$('dlMeta').textContent=`${mb}MB .${ext}`;$('dlArea').style.display='flex';$('status').textContent='✅ Done!';};
  mediaRecorder.start(100);
  isRecording=true;$('recordBtn').textContent='⏹ Stop & Save';$('recordBtn').classList.add('rec');$('status').textContent='● REC';
  try{const ac=getAC();if(ac){const o=ac.createOscillator(),g=ac.createGain();g.gain.value=0.0001;o.connect(g);g.connect(audioOut());o.frequency.value=20;o.start();mediaRecorder._silent=o;}}catch(_){}
  ping('record_keeper');
}
function stopRecording(){if(mediaRecorder){try{if(mediaRecorder._silent)mediaRecorder._silent.stop();}catch(_){}if(mediaRecorder.state!=='inactive')mediaRecorder.stop();}isRecording=false;$('recordBtn').textContent='⏺ Record';$('recordBtn').classList.remove('rec');$('status').textContent='Saving…';}

/* BUTTONS */
function reset(){score=0;level=1;lives=3;combo=0;comboT=0;levelScore=0;balls=[];particles=[];floatTexts=[];confetti=[];spawnT=1.4;flashAlpha=0;shakeFrames=0;timerRunning=false;timerLeft=parseInt(timerMode)||999;}
$('startBtn').addEventListener('click',()=>{getAC();reset();cdNum=3;cdT=1;sfx.count(false);gameState='countdown';$('startBtn').textContent='🔄 Restart';ping('start_keeper');});
$('stopBtn').addEventListener('click',()=>{if(gameState==='playing'||gameState==='countdown')endGame();});
$('recordBtn').addEventListener('click',()=>{if(!isRecording)startRecording();else stopRecording();});
$('shareBtn').addEventListener('click',()=>{const url=location.href;if(navigator.share)navigator.share({title:'⚽ Goalkeeper',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>{$('status').textContent='🔗 Link copied!';setTimeout(()=>$('status').textContent='',2500);});else prompt('Link:',url);ping('share_keeper');});
$('dlBtn').addEventListener('click',()=>{if(!savedBlob)return;const url=URL.createObjectURL(savedBlob);const a=document.createElement('a');a.href=url;a.download=`goalkeeper-${Date.now()}.${savedBlob.__ext||'webm'}`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);$('dlMeta').textContent='Downloaded! 🚀';ping('download_keeper');});
$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇 Sound':'🔊 Sound';$('muteBtn').classList.toggle('on',!muted);});
document.querySelectorAll('.t-btn').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');timerMode=el.dataset.mode;}));

/* INIT */
(async()=>{await startCamera();await listCameras();pumpFrames();})();
[1500,3500,7000].forEach(ms=>setTimeout(listCameras,ms));
requestAnimationFrame(t=>{lastTime=t;loop(t);});
</script>
